<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - EDITH AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <script>
    // Inline blocking script to prevent theme flickering on page refresh
    if (localStorage.getItem('theme') === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      transition: background-color 0.4s ease;
    }

    /* Ambient Pulsing Glow Blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(130px);
      z-index: -1;
      animation: pulseGlowEffect 8s ease-in-out infinite alternate;
      will-change: opacity, transform;
    }

    @keyframes pulseGlowEffect {
      0% { opacity: 0.15; transform: scale(1); }
      100% { opacity: 0.35; transform: scale(1.08); }
    }

    /* Luxury Cyber Glass Card Base */
    .glass-card {
      backdrop-filter: blur(40px) saturate(220%);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    }

    /* Adaptive Input Fields */
    .neon-input {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* State-driven Button Shimmer */
    .btn-gradient {
      background: linear-gradient(135deg, #7c3aed 0%, #059669 50%, #0284c7 100%);
      background-size: 200% auto;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-gradient:hover:not(:disabled) {
      background-position: right center;
      transform: translateY(-1px);
    }
    
    .btn-gradient:active:not(:disabled) {
      transform: translateY(1px);
    }

    /* Brand Logo Identity Ring Animation */
    @keyframes orbAnimation {
      0% { box-shadow: 0 0 20px rgba(124, 58, 237, 0.3), inset 0 0 10px rgba(124, 58, 237, 0.2); }
      50% { box-shadow: 0 0 35px rgba(16, 185, 129, 0.4), inset 0 0 15px rgba(16, 185, 129, 0.2); }
      100% { box-shadow: 0 0 20px rgba(124, 58, 237, 0.3), inset 0 0 10px rgba(124, 58, 237, 0.2); }
    }
    .shai-orb {
      animation: orbAnimation 4s ease-in-out infinite;
    }

    /* Toast Fly-in Animations */
    .toast-notification {
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform: translateY(-30px) scale(0.95);
      opacity: 0;
    }
    .toast-show {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    /* Custom Theme Token Rules mapping variables cleanly */
    .dark body { background-color: #040209; }
    .dark .glass-card {
      --card-border: rgba(255, 255, 255, 0.04);
      --card-shadow: 0 25px 70px -10px rgba(0, 0, 0, 0.8), 0 0 50px rgba(124, 58, 237, 0.03), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      background: rgba(12, 8, 22, 0.65);
    }
    .dark .neon-input {
      background: rgba(4, 2, 8, 0.5) !important;
      border: 1px solid rgba(255, 255, 255, 0.07) !important;
      color: #ffffff;
    }
    .dark .neon-input:focus {
      border-color: rgba(16, 185, 129, 0.6) !important;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
      background: rgba(4, 2, 8, 0.75) !important;
    }

    :not(.dark) body { background-color: #f8fafc; }
    :not(.dark) .glass-card {
      --card-border: rgba(15, 23, 42, 0.06);
      --card-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.12), 0 4px 20px rgba(124, 58, 237, 0.02);
      background: rgba(255, 255, 255, 0.75);
    }
    :not(.dark) .neon-input {
      background: rgba(255, 255, 255, 0.8) !important;
      border: 1px solid rgba(15, 23, 42, 0.1) !important;
      color: #0f172a;
    }
    :not(.dark) .neon-input:focus {
      border-color: #10b981 !important;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
      background: #ffffff !important;
    }
  </style>
</head>

<body class="flex items-center justify-center relative px-4 py-12 min-h-screen">

  <!-- Dynamic Toast Container -->
  <div id="toastContainer" class="fixed top-6 z-50 pointer-events-none w-full max-w-sm px-4">
    <div id="toast" class="toast-notification bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-800 dark:text-gray-200 px-5 py-4 rounded-2xl shadow-2xl flex items-center gap-3 text-sm">
      <div class="flex items-center justify-center w-6 h-6 rounded-full bg-red-500/10">
        <i id="toastIcon" class="fa-solid fa-circle-exclamation text-red-500 dark:text-red-400 text-sm"></i>
      </div>
      <span id="toastMessage" class="font-medium tracking-wide">Notification message</span>
    </div>
  </div>

  <!-- Ambient Lights Layer -->
  <div class="blob w-96 h-96 top-12 left-12 bg-gradient-to-br from-violet-600 to-fuchsia-600 dark:from-purple-900/40 dark:to-transparent"></div>
  <div class="blob w-[30rem] h-[30rem] bottom-12 right-12 bg-gradient-to-br from-emerald-500 to-cyan-500 dark:from-emerald-900/30 dark:to-transparent" style="animation-delay: -4s;"></div>

  <div class="w-full max-w-lg relative z-10">
    <!-- Main Interactive Card Node -->
    <div class="glass-card rounded-[36px] p-8 md:p-11 relative">
      
      <!-- Premium Fast Action Theme Switcher Header Placement -->
      <button type="button" onclick="toggleInterfaceTheme()" class="absolute right-8 top-8 w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 flex items-center justify-center text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white transition-all active:scale-95 focus:outline-none">
        <i id="themeToggleIcon" class="fa-solid fa-moon text-sm"></i>
      </button>

      <div>
        <!-- Identity Header Group -->
        <div class="text-center mb-9">
          <div class="shai-orb w-16 h-16 mx-auto rounded-2xl flex items-center justify-center text-xl mb-4 bg-violet-500/10 dark:bg-slate-900 border border-violet-500/20 text-violet-600 dark:text-emerald-400">
            <i class="fa-solid fa-user-plus text-lg"></i>
          </div>
          <h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-2 tracking-tight">Join <span class="text-transparent bg-clip-text bg-gradient-to-r from-violet-600 dark:from-emerald-400 via-indigo-500 dark:via-indigo-300 to-emerald-500 dark:to-purple-400">EDITH AI</span></h1>
          <p class="text-slate-500 dark:text-slate-400 text-[10px] font-bold tracking-widest uppercase">Initialize Your Node Credentials</p>
        </div>

        <form id="regForm" class="space-y-5">
          <!-- Username Input -->
          <div>
            <label class="block text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2 ml-1">Username</label>
            <div class="relative group">
              <i class="fa-solid fa-user absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-600 group-focus-within:text-emerald-500 transition-colors duration-300"></i>
              <input type="text" id="username" required placeholder="Create unique user handle" 
                class="neon-input w-full rounded-xl pl-12 pr-6 py-4 text-sm focus:outline-none placeholder:text-slate-400 dark:placeholder:text-slate-700">
            </div>
          </div>

          <!-- Phone and Email Grid Matrix -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
              <label class="block text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2 ml-1">Email Address</label>
              <div class="relative group">
                <i class="fa-solid fa-envelope absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-600 group-focus-within:text-emerald-500 transition-colors duration-300"></i>
                <input type="email" id="email" required placeholder="name@domain.com" 
                  class="neon-input w-full rounded-xl pl-12 pr-6 py-4 text-sm focus:outline-none placeholder:text-slate-400 dark:placeholder:text-slate-700">
              </div>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2 ml-1">Phone Number</label>
              <div class="relative group">
                <i class="fa-solid fa-phone absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-600 group-focus-within:text-emerald-500 transition-colors duration-300"></i>
                <input type="tel" id="phone" placeholder="Contact number" 
                  class="neon-input w-full rounded-xl pl-12 pr-4 py-4 text-sm focus:outline-none placeholder:text-slate-400 dark:placeholder:text-slate-700">
              </div>
            </div>
          </div>

          <!-- Password Field -->
          <div>
            <label class="block text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2 ml-1">Password</label>
            <div class="relative group">
              <i class="fa-solid fa-lock absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-600 group-focus-within:text-emerald-500 transition-colors duration-300"></i>
              <input type="password" id="pass" required placeholder="••••••••" 
                class="neon-input w-full rounded-xl pl-12 pr-14 py-4 text-sm focus:outline-none placeholder:text-slate-400 dark:placeholder:text-slate-700">
              
              <button type="button" onclick="toggleFieldVisibility('pass', 'toggleEyeIcon1')" class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors focus:outline-none py-1">
                <i id="toggleEyeIcon1" class="fa-solid fa-eye text-xs"></i>
              </button>
            </div>
          </div>

          <!-- Verify Password Field -->
          <div>
            <label class="block text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2 ml-1">Confirm Password</label>
            <div class="relative group">
              <i class="fa-solid fa-shield-halved absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-600 group-focus-within:text-emerald-500 transition-colors duration-300"></i>
              <input type="password" id="confirmPass" required placeholder="••••••••" 
                class="neon-input w-full rounded-xl pl-12 pr-14 py-4 text-sm focus:outline-none placeholder:text-slate-400 dark:placeholder:text-slate-700">
              
              <button type="button" onclick="toggleFieldVisibility('confirmPass', 'toggleEyeIcon2')" class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors focus:outline-none py-1">
                <i id="toggleEyeIcon2" class="fa-solid fa-eye text-xs"></i>
              </button>
            </div>
          </div>

          <!-- Primary Submit Gateway Button -->
          <button type="submit" id="reg-btn"
            class="btn-gradient w-full text-white font-semibold py-4 rounded-xl shadow-xl mt-4 disabled:opacity-60 text-sm tracking-wider uppercase flex items-center justify-center gap-2">
            <span>Create Account Node</span>
          </button>
        </form>

        <p class="text-center mt-7 text-slate-500 dark:text-slate-400 text-xs font-light tracking-wide">
          Already a certified member? <a href="login.html" class="text-violet-600 dark:text-cyan-400 font-medium hover:text-emerald-600 dark:hover:text-purple-300 hover:underline transition-colors ml-1">Sign In</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://student-hub-edith-backend.onrender.com";

    // Setup visual parameters dynamically according to structural dark class state mapping
    function syncThemeToggleIcon() {
      const icon = document.getElementById("themeToggleIcon");
      if (document.documentElement.classList.contains("dark")) {
        icon.className = "fa-solid fa-sun text-sm text-amber-400";
      } else {
        icon.className = "fa-solid fa-moon text-sm text-slate-700";
      }
    }
    
    // Core theme management pipeline toggle
    function toggleInterfaceTheme() {
      if (document.documentElement.classList.contains("dark")) {
        document.documentElement.classList.remove("dark");
        localStorage.setItem("theme", "light");
      } else {
        document.documentElement.classList.add("dark");
        localStorage.setItem("theme", "dark");
      }
      syncThemeToggleIcon();
    }

    // Initialize layout theme icons instantly on load runtime
    syncThemeToggleIcon();

    // Adaptive Notification Engine
    function showNotification(message, isSuccess = false) {
      const toast = document.getElementById("toast");
      const icon = document.getElementById("toastIcon");
      const msgSpan = document.getElementById("toastMessage");
      const iconContainer = icon.parentElement;

      msgSpan.innerText = message;
      
      if(isSuccess) {
        toast.className = "toast-notification bg-white dark:bg-slate-950 border border-emerald-500/30 text-slate-800 dark:text-gray-200 px-5 py-4 rounded-2xl shadow-2xl flex items-center gap-3 text-sm";
        iconContainer.className = "flex items-center justify-center w-6 h-6 rounded-full bg-emerald-500/10";
        icon.className = "fa-solid fa-circle-check text-emerald-600 dark:text-emerald-400 text-sm";
      } else {
        toast.className = "toast-notification bg-white dark:bg-slate-950 border border-red-500/20 text-slate-800 dark:text-gray-200 px-5 py-4 rounded-2xl shadow-2xl flex items-center gap-3 text-sm";
        iconContainer.className = "flex items-center justify-center w-6 h-6 rounded-full bg-red-500/10";
        icon.className = "fa-solid fa-circle-exclamation text-red-500 dark:text-red-400 text-sm";
      }

      toast.classList.add("toast-show");
      setTimeout(() => {
        toast.classList.remove("toast-show");
      }, 4000);
    }

    // Input type switcher visibility flag framework
    function toggleFieldVisibility(fieldId, iconId) {
      const targetField = document.getElementById(fieldId);
      const targetIcon = document.getElementById(iconId);

      if (targetField.type === "password") {
        targetField.type = "text";
        targetIcon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        targetField.type = "password";
        targetIcon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    // Form pipeline capture network request handling
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('pass').value;
      const confirmPass = document.getElementById('confirmPass').value;
      const btn = document.getElementById('reg-btn');

      if(password !== confirmPass) {
        return showNotification("Validation error: Passwords do not match!");
      }

      btn.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin mr-2"></i> Initializing...`;
      btn.disabled = true;

      try {
        const response = await fetch(`${API_BASE}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, phone, password }) 
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('userName', username);
          localStorage.setItem('userEmail', email);
          localStorage.setItem('userPhone', phone);
          
          showNotification("Registration successful! Synced node to access portal...", true);
          
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);
        } else {
          showNotification(data.error || "Registration validation error");
          resetButtonState(btn);
        }
      } catch (err) {
        console.error(err);
        showNotification("Core registration interface connection error");
        resetButtonState(btn);
      }
    });

    function resetButtonState(buttonElement) {
      buttonElement.innerHTML = `<span>Create Account Node</span>`;
      buttonElement.disabled = false;
    }
  </script>
</body>

</html>
