<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - EDITH AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      background-color: #030712;
    }

    /* Premium Stationary Radial Glow Background */
    .bg-animate {
      background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
      min-height: 100vh;
    }

    /* Ambient Premium Blobs - Constant positions, no structural movement, only smooth transparency pulse */
    .blob {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      filter: blur(120px);
      z-index: -1;
      animation: pulseGlowEffect 6s ease-in-out infinite alternate;
      will-change: opacity;
    }

    @keyframes pulseGlowEffect {
      0% { opacity: 0.15; }
      100% { opacity: 0.35; }
    }

    /* Luxury Cyber Glass Card */
    .glass-card {
      background: rgba(10, 15, 30, 0.7);
      backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 50px rgba(168, 85, 247, 0.1), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    /* Ultra-sleek Cyber Input Styling */
    .neon-input {
      background: rgba(3, 7, 18, 0.6) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      transition: all 0.3s ease;
    }

    .neon-input:focus {
      border-color: #38bdf8 !important; 
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
      background: rgba(3, 7, 18, 0.8) !important;
    }

    /* Elegant Metallic Button Gradient */
    .btn-gradient {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .btn-gradient:hover:not(:disabled) {
      box-shadow: 0 0 25px rgba(124, 58, 237, 0.4);
      transform: translateY(-1px);
      filter: brightness(1.1);
    }

    /* Core Smooth Animated Orb Logo */
    @keyframes orbAnimation {
      0% { box-shadow: 0 0 15px rgba(124, 58, 237, 0.5); }
      50% { box-shadow: 0 0 30px rgba(56, 189, 248, 0.6); }
      100% { box-shadow: 0 0 15px rgba(124, 58, 237, 0.5); }
    }
    .shai-orb {
      animation: orbAnimation 3s ease-in-out infinite;
    }

    /* Custom Notification Toast */
    .toast-notification {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      transform: translateY(-20px);
      opacity: 0;
    }
    .toast-show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>

<body class="bg-animate flex items-center justify-center relative px-4 py-10">

  <!-- Dynamic Toast Overlay Container -->
  <div id="toastContainer" class="fixed top-6 z-50 pointer-events-none w-full max-w-sm px-4">
    <div id="toast" class="toast-notification bg-slate-950/95 backdrop-blur-md border border-red-500/30 text-gray-200 px-5 py-4 rounded-2xl shadow-xl flex items-center gap-3 text-sm">
      <i id="toastIcon" class="fa-solid fa-circle-exclamation text-red-400 text-base"></i>
      <span id="toastMessage" class="font-medium">Notification message</span>
    </div>
  </div>

  <!-- Ambient Backdrop Lights (Fixed Positions with Glow Pulse) -->
  <div class="blob w-80 h-80 top-1/4 left-1/4"></div>
  <div class="blob w-96 h-96 bottom-1/4 right-1/4" style="background: #3b82f6; animation-delay: -3s;"></div>

  <div class="w-full max-w-lg">
    <!-- Perfectly Contained Premium Card with Soft Tilt -->
    <div class="glass-card rounded-[32px] p-8 md:p-10" data-tilt data-tilt-max="3" data-tilt-glare data-tilt-max-glare="0.03">
      
      <div>
        <!-- App Identity Logo Header -->
        <div class="text-center mb-8">
          <div class="shai-orb w-14 h-14 mx-auto bg-gradient-to-br from-purple-600 to-blue-600 rounded-2xl flex items-center justify-center text-xl mb-4 shadow-xl text-white">
            <i class="fa-solid fa-user-plus"></i>
          </div>
          <h1 class="text-3xl font-bold text-white mb-1.5 tracking-tight">Join <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">EDITH AI</span></h1>
          <p class="text-slate-400 text-xs font-light tracking-wide">Create your secure gateway credentials</p>
        </div>

        <form id="regForm" class="space-y-4">
          <!-- Username Block -->
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Username</label>
            <div class="relative group">
              <i class="fa-solid fa-user absolute left-5 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-cyan-400 transition-colors"></i>
              <input type="text" id="username" required placeholder="Enter username" 
                class="neon-input w-full rounded-xl pl-12 pr-6 py-3.5 text-white text-sm focus:outline-none">
            </div>
          </div>

          <!-- Contact Metrics Grid Row -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Email Address</label>
              <div class="relative group">
                <i class="fa-solid fa-envelope absolute left-5 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-cyan-400 transition-colors"></i>
                <input type="email" id="email" required placeholder="name@domain.com" 
                  class="neon-input w-full rounded-xl pl-12 pr-6 py-3.5 text-white text-sm focus:outline-none">
              </div>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Phone Number (Optional)</label>
              <div class="relative group">
                <i class="fa-solid fa-phone absolute left-5 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-cyan-400 transition-colors"></i>
                <input type="tel" id="phone" maxlength="15" placeholder="Enter contact number" 
                  class="neon-input w-full rounded-xl pl-12 pr-4 py-3.5 text-white text-sm focus:outline-none">
              </div>
            </div>
          </div>

          <!-- Create Password Input Block -->
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Password</label>
            <div class="relative group">
              <i class="fa-solid fa-lock absolute left-5 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-cyan-400 transition-colors"></i>
              <input type="password" id="pass" required placeholder="••••••••" 
                class="neon-input w-full rounded-xl pl-12 pr-14 py-3.5 text-white text-sm focus:outline-none">
              
              <button type="button" onclick="toggleFieldVisibility('pass', 'toggleEyeIcon1')" class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white transition-colors focus:outline-none py-1">
                <i id="toggleEyeIcon1" class="fa-solid fa-eye text-xs"></i>
              </button>
            </div>
          </div>

          <!-- Verify Password Input Block -->
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Confirm Password</label>
            <div class="relative group">
              <i class="fa-solid fa-shield-halved absolute left-5 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-cyan-400 transition-colors"></i>
              <input type="password" id="confirmPass" required placeholder="••••••••" 
                class="neon-input w-full rounded-xl pl-12 pr-14 py-3.5 text-white text-sm focus:outline-none">
              
              <button type="button" onclick="toggleFieldVisibility('confirmPass', 'toggleEyeIcon2')" class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white transition-colors focus:outline-none py-1">
                <i id="toggleEyeIcon2" class="fa-solid fa-eye text-xs"></i>
              </button>
            </div>
          </div>

          <!-- Action Button -->
          <button type="submit" id="reg-btn"
            class="btn-gradient w-full text-white font-semibold py-4 rounded-xl shadow-xl transition-all mt-4 disabled:opacity-50 text-sm tracking-wide">
            CREATE ACCOUNT NODE
          </button>
        </form>

        <p class="text-center mt-6 text-slate-400 text-xs font-light">
          Already a certified member? <a href="login.html" class="text-cyan-400 font-medium hover:text-purple-400 hover:underline ml-1">Sign In</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://student-hub-edith-backend.onrender.com";
    
    // Balanced Tilt Configuration for flawless appearance
    VanillaTilt.init(document.querySelectorAll(".glass-card"), { 
      max: 3, 
      speed: 800, 
      glare: true, 
      "max-glare": 0.05,
      scale: 1.01
    });

    // Custom System Notifications
    function showNotification(message, isSuccess = false) {
      const toast = document.getElementById("toast");
      const icon = document.getElementById("toastIcon");
      const msgSpan = document.getElementById("toastMessage");

      msgSpan.innerText = message;
      
      if(isSuccess) {
        toast.classList.replace("border-red-500/30", "border-emerald-500/30");
        icon.className = "fa-solid fa-circle-check text-emerald-400 text-base";
      } else {
        toast.classList.replace("border-emerald-500/30", "border-red-500/30");
        icon.className = "fa-solid fa-circle-exclamation text-red-400 text-base";
      }

      toast.classList.add("toast-show");
      setTimeout(() => {
        toast.classList.remove("toast-show");
      }, 4000);
    }

    // Toggle Field Visibility Feature
    function toggleFieldVisibility(fieldId, iconId) {
      const targetField = document.getElementById(fieldId);
      const targetIcon = document.getElementById(iconId);

      if (targetField.type === "password") {
        targetField.type = "text";
        targetIcon.classList.remove("fa-eye");
        targetIcon.classList.add("fa-eye-slash");
      } else {
        targetField.type = "password";
        targetIcon.classList.remove("fa-eye-slash");
        targetIcon.classList.add("fa-eye");
      }
    }

    // Submission Handler
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('pass').value;
      const confirmPass = document.getElementById('confirmPass').value;
      const btn = document.getElementById('reg-btn');

      if(password !== confirmPass) {
        return showNotification("Validation error: Passwords do not match!");
      }

      btn.innerText = "Registering...";
      btn.disabled = true;

      try {
        // ఇక్కడ బ్యాకెండ్ కి అన్ని ఫీల్డ్స్ పంపుతున్నాము
        const response = await fetch(`${API_BASE}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, phone, password }) 
        });

        const data = await response.json();

        if (response.ok) {
          // డాష్‌బోర్డ్ కోసం లోకల్ స్టోరేజ్ లో డేటా ని స్టోర్ చేస్తున్నాము
          localStorage.setItem('userName', username);
          localStorage.setItem('userEmail', email);
          localStorage.setItem('userPhone', phone);
          
          showNotification("Registration successful! Route switching to login window...", true);
          
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1200);
        } else {
          showNotification(data.error || "Registration validation error");
          btn.innerText = "CREATE ACCOUNT NODE";
          btn.disabled = false;
        }
      } catch (err) {
        console.error(err);
        showNotification("Core registration interface connection error");
        btn.innerText = "CREATE ACCOUNT NODE";
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
