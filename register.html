<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - EDITH AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      background-color: #03000a;
    }

    /* Premium Stationary Radial Glow Background */
    .bg-animate {
      background: radial-gradient(circle at 50% 50%, #090514 0%, #020005 100%);
      min-height: 100vh;
    }

    /* Ambient Premium Blobs - Deep Cinematic Neon Glows */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      z-index: -1;
      animation: pulseGlowEffect 8s ease-in-out infinite alternate;
      will-change: opacity;
    }

    @keyframes pulseGlowEffect {
      0% { opacity: 0.2; transform: scale(1); }
      100% { opacity: 0.4; transform: scale(1.05); }
    }

    /* Luxury Cyber Glass Card - High Contrast Depth */
    .glass-card {
      background: rgba(10, 6, 18, 0.65);
      backdrop-filter: blur(40px) saturate(220%);
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: 0 25px 70px -10px rgba(0, 0, 0, 0.7), 
                  0 0 50px rgba(139, 92, 246, 0.05), 
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* Ultra-sleek Cyber Input Styling */
    .neon-input {
      background: rgba(2, 0, 5, 0.5) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .neon-input:focus {
      border-color: rgba(6, 182, 212, 0.6) !important; 
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.15), inset 0 0 10px rgba(6, 182, 212, 0.05);
      background: rgba(2, 0, 5, 0.8) !important;
    }

    /* Elegant Metallic Button Gradient */
    .btn-gradient {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      background-size: 200% auto;
      transition: all 0.4s ease;
    }

    .btn-gradient:hover:not(:disabled) {
      background-position: right center;
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
      transform: translateY(-1px);
    }
    
    .btn-gradient:active:not(:disabled) {
      transform: translateY(1px);
    }

    /* Core Smooth Animated Orb Logo */
    @keyframes orbAnimation {
      0% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(168, 85, 247, 0.2); }
      50% { box-shadow: 0 0 35px rgba(6, 182, 212, 0.5), inset 0 0 15px rgba(6, 182, 212, 0.2); }
      100% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(168, 85, 247, 0.2); }
    }
    .shai-orb {
      animation: orbAnimation 4s ease-in-out infinite;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(6, 182, 212, 0.2));
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Custom Notification Toast */
    .toast-notification {
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform: translateY(-30px) scale(0.95);
      opacity: 0;
    }
    .toast-show {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
  </style>
</head>

<body class="bg-animate flex items-center justify-center relative px-4 py-12">

  <div id="toastContainer" class="fixed top-6 z-50 pointer-events-none w-full max-w-sm px-4">
    <div id="toast" class="toast-notification bg-slate-955/95 backdrop-blur-xl border border-red-500/20 text-gray-200 px-5 py-4 rounded-2xl shadow-2xl flex items-center gap-3 text-sm">
      <div class="flex items-center justify-center w-6 h-6 rounded-full bg-red-500/10">
        <i id="toastIcon" class="fa-solid fa-circle-exclamation text-red-400 text-sm"></i>
      </div>
      <span id="toastMessage" class="font-medium tracking-wide">Notification message</span>
    </div>
  </div>

  <div class="blob w-96 h-96 top-12 left-12" style="background: linear-gradient(135deg, #4f46e5, #7c3aed);"></div>
  <div class="blob w-[30rem] h-[30rem] bottom-12 right-12" style="background: linear-gradient(135deg, #0891b2, #4f46e5); animation-delay: -4s;"></div>

  <div class="w-full max-w-lg relative z-10">
    <div class="glass-card rounded-[36px] p-8 md:p-11">
      
      <div>
        <div class="text-center mb-9">
          <div class="shai-orb w-16 h-16 mx-auto rounded-2xl flex items-center justify-center text-xl mb-4 text-cyan-400">
            <i class="fa-solid fa-user-plus text-lg"></i>
          </div>
          <h1 class="text-3xl font-bold text-white mb-2 tracking-tight">Join <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-300 to-purple-400">EDITH AI</span></h1>
          <p class="text-slate-400 text-xs font-light tracking-widest uppercase">Initialize Your Node Credentials</p>
        </div>

        <form id="regForm" class="space-y-5">
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Username</label>
            <div class="relative group">
              <i class="fa-solid fa-user absolute left-5 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-cyan-400 transition-colors duration-300"></i>
              <input type="text" id="username" required placeholder="Create unique user handle" 
                class="neon-input w-full rounded-xl pl-12 pr-6 py-4 text-white text-sm focus:outline-none placeholder:text-slate-600">
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
              <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Email Address</label>
              <div class="relative group">
                <i class="fa-solid fa-envelope absolute left-5 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-cyan-400 transition-colors duration-300"></i>
                <input type="email" id="email" required placeholder="name@domain.com" 
                  class="neon-input w-full rounded-xl pl-12 pr-6 py-4 text-white text-sm focus:outline-none placeholder:text-slate-600">
              </div>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Phone Number</label>
              <div class="relative group">
                <i class="fa-solid fa-phone absolute left-5 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-cyan-400 transition-colors duration-300"></i>
                <input type="tel" id="phone" placeholder="Enter contact number" 
                  class="neon-input w-full rounded-xl pl-12 pr-4 py-4 text-white text-sm focus:outline-none placeholder:text-slate-600">
              </div>
            </div>
          </div>

          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Password</label>
            <div class="relative group">
              <i class="fa-solid fa-lock absolute left-5 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-cyan-400 transition-colors duration-300"></i>
              <input type="password" id="pass" required placeholder="••••••••" 
                class="neon-input w-full rounded-xl pl-12 pr-14 py-4 text-white text-sm focus:outline-none placeholder:text-slate-600">
              
              <button type="button" onclick="toggleFieldVisibility('pass', 'toggleEyeIcon1')" class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors focus:outline-none py-1">
                <i id="toggleEyeIcon1" class="fa-solid fa-eye text-xs"></i>
              </button>
            </div>
          </div>

          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Confirm Password</label>
            <div class="relative group">
              <i class="fa-solid fa-shield-halved absolute left-5 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-cyan-400 transition-colors duration-300"></i>
              <input type="password" id="confirmPass" required placeholder="••••••••" 
                class="neon-input w-full rounded-xl pl-12 pr-14 py-4 text-white text-sm focus:outline-none placeholder:text-slate-600">
              
              <button type="button" onclick="toggleFieldVisibility('confirmPass', 'toggleEyeIcon2')" class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors focus:outline-none py-1">
                <i id="toggleEyeIcon2" class="fa-solid fa-eye text-xs"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="reg-btn"
            class="btn-gradient w-full text-white font-semibold py-4 rounded-xl shadow-xl transition-all mt-4 disabled:opacity-60 text-sm tracking-wider uppercase flex items-center justify-center gap-2">
            <span>Create Account Node</span>
          </button>
        </form>

        <p class="text-center mt-7 text-slate-400 text-xs font-light tracking-wide">
          Already a certified member? <a href="login.html" class="text-cyan-400 font-medium hover:text-purple-300 hover:underline transition-colors ml-1">Sign In</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://student-hub-edith-backend.onrender.com";

    // Custom System Notifications
    function showNotification(message, isSuccess = false) {
      const toast = document.getElementById("toast");
      const icon = document.getElementById("toastIcon");
      const msgSpan = document.getElementById("toastMessage");
      const iconContainer = icon.parentElement;

      msgSpan.innerText = message;
      
      if(isSuccess) {
        toast.className = "toast-notification bg-slate-950/95 backdrop-blur-xl border border-emerald-500/30 text-gray-200 px-5 py-4 rounded-2xl shadow-2xl flex items-center gap-3 text-sm";
        iconContainer.className = "flex items-center justify-center w-6 h-6 rounded-full bg-emerald-500/10";
        icon.className = "fa-solid fa-circle-check text-emerald-400 text-sm";
      } else {
        toast.className = "toast-notification bg-slate-950/95 backdrop-blur-xl border border-red-500/20 text-gray-200 px-5 py-4 rounded-2xl shadow-2xl flex items-center gap-3 text-sm";
        iconContainer.className = "flex items-center justify-center w-6 h-6 rounded-full bg-red-500/10";
        icon.className = "fa-solid fa-circle-exclamation text-red-400 text-sm";
      }

      toast.classList.add("toast-show");
      setTimeout(() => {
        toast.classList.remove("toast-show");
      }, 4000);
    }

    // Toggle Field Visibility Feature
    function toggleFieldVisibility(fieldId, iconId) {
      const targetField = document.getElementById(fieldId);
      const targetIcon = document.getElementById(iconId);

      if (targetField.type === "password") {
        targetField.type = "text";
        targetIcon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        targetField.type = "password";
        targetIcon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    // Submission Handler
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('pass').value;
      const confirmPass = document.getElementById('confirmPass').value;
      const btn = document.getElementById('reg-btn');

      // Password Uniformity Validation
      if(password !== confirmPass) {
        return showNotification("Validation error: Passwords do not match!");
      }

      // Update button to a sleek loading state
      btn.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin mr-2"></i> Initializing...`;
      btn.disabled = true;

      try {
        const response = await fetch(`${API_BASE}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, phone, password }) 
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('userName', username);
          localStorage.setItem('userEmail', email);
          localStorage.setItem('userPhone', phone);
          
          showNotification("Registration successful! Synced node to access portal...", true);
          
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);
        } else {
          showNotification(data.error || "Registration validation error");
          resetButtonState(btn);
        }
      } catch (err) {
        console.error(err);
        showNotification("Core registration interface connection error");
        resetButtonState(btn);
      }
    });

    function resetButtonState(buttonElement) {
      buttonElement.innerHTML = `<span>Create Account Node</span>`;
      buttonElement.disabled = false;
    }
  </script>
</body>

</html>
