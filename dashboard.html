<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionCore AI | Neural Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #00f2ff;
            --bg: #0b0f1a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(0, 242, 255, 0.05) 0%, transparent 40%);
            color: white;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Sidebar Navigation --- */
        nav {
            width: 80px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            gap: 30px;
        }

        .nav-icon {
            width: 45px; height: 45px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            font-size: 1.2rem;
        }

        .nav-icon:hover { border-color: var(--primary); color: var(--primary); }
        .nav-icon.active { background: var(--primary); box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); border: none; }

        /* --- Main Content --- */
        main {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-weight: 800; font-size: 2rem; margin: 0; letter-spacing: -1px; }
        .header span { color: var(--primary); }

        /* --- Camera Viewport with HUD --- */
        .viewport-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 10px;
            border-radius: 24px;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.7);
        }

        .video-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16/9;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror View */
        }

        /* Scanning HUD Overlay */
        .hud-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 2px solid transparent;
            pointer-events: none;
            box-sizing: border-box;
            z-index: 2;
        }

        .corner {
            position: absolute; width: 30px; height: 30px;
            border: 2px solid var(--accent);
            opacity: 0.5;
        }
        .top-left { top: 20px; left: 20px; border-right: 0; border-bottom: 0; }
        .top-right { top: 20px; right: 20px; border-left: 0; border-bottom: 0; }
        .bottom-left { bottom: 20px; left: 20px; border-right: 0; border-top: 0; }
        .bottom-right { bottom: 20px; right: 20px; border-left: 0; border-top: 0; }

        .scan-line {
            position: absolute;
            width: 100%; height: 2px;
            background: linear-gradient(to right, transparent, var(--accent), transparent);
            box-shadow: 0 0 15px var(--accent);
            top: -2px;
            display: none;
        }

        @keyframes scanMove {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        /* --- Controls & Status --- */
        .controls {
            margin-top: 20px;
            width: 100%;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        .status-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 15px;
        }

        #emotionText {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent);
            text-align: center;
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-icon">📊</div>
    <div class="nav-icon active">📷</div>
    <div class="nav-icon">👤</div>
    <div class="nav-icon" onclick="location.href='index.html'">🚪</div>
</nav>

<main>
    <div class="header">
        <h1>NEURAL<span>CORE</span> DASHBOARD</h1>
        <p style="color: #64748b; font-size: 0.9rem; margin-top: 5px;">Biometric Emotion Analysis System v2.0</p>
    </div>

    <div class="viewport-container">
        <div class="video-wrapper">
            <div class="hud-overlay">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
                <div id="scanLine" class="scan-line"></div>
            </div>
            
            <video id="video" autoplay playsinline></video>
        </div>

        <div class="controls">
            <button id="btn">Initiate Neural Scan</button>
            <div class="status-box">
                <p id="emotionText">SYSTEM READY</p>
            </div>
        </div>
    </div>
</main>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    const video = document.getElementById('video');
    const btn = document.getElementById('btn');
    const emotionText = document.getElementById('emotionText');
    const scanLine = document.getElementById('scanLine');

    // ✅ START CAMERA
    navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } })
    .then(stream => {
        video.srcObject = stream;
    })
    .catch(err => {
        emotionText.innerText = "CAMERA ERROR";
        alert("Please enable camera access.");
    });

    // ✅ ANALYSIS LOGIC
    btn.addEventListener("click", () => {
        // Start Scanning Animation
        scanLine.style.display = "block";
        scanLine.style.animation = "scanMove 2s linear infinite";
        emotionText.innerText = "SCANNING...";

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);

        const imageData = canvas.toDataURL('image/png');

        // Use your Server IP
       fetch("https://michele-nonrousing-joni.ngrok-free.dev/detect-emotion", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ image: imageData })
        })
        .then(res => res.json())
        .then(data => {
            // Stop animation and show result
            scanLine.style.display = "none";
            scanLine.style.animation = "none";
            emotionText.innerText = (data.emotion || "UNKNOWN").toUpperCase();
        })
        .catch(err => {
            scanLine.style.display = "none";
            emotionText.innerText = "SERVER ERROR";
            console.error(err);
        });
    });
</script>

</body>
</html>
