<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Vault - EDITH Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700&family=Caveat:wght=500;700&display=swap');
    
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      transition: background 0.3s ease, color 0.3s ease;
    }
    
    /* Dark Mode Gradient Layout */
    .dark body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #030712 75%); 
    }
    
    /* Light Mode Gradient Layout */
    .light body {
      background: radial-gradient(circle at 50% 0%, #f0f2fe 0%, #e2e8f0 75%);
    }

    .glass-card {
      transition: all 0.3s ease;
    }
    
    .dark .glass-card {
      background: rgba(10, 11, 23, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .light .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }
    
    .dark .glass-card:hover { 
      border-color: rgba(168, 85, 247, 0.4);
      box-shadow: 0 20px 40px -15px rgba(168, 85, 247, 0.2); 
    }

    .light .glass-card:hover { 
      border-color: rgba(79, 70, 229, 0.3);
      box-shadow: 0 20px 40px -15px rgba(79, 70, 229, 0.1); 
    }
    
    /* Ruled Live Preview Matrix Styles */
    .ruled-notebook-preview {
      background-color: #faf8f5; 
      background-image: linear-gradient(#e2dcd5 1px, transparent 1px);
      background-size: 100% 24px;
      font-family: 'Caveat', cursive;
      font-size: 18px;
      line-height: 24px;
      color: #0f172a;
    }

    .ruled-notebook-preview pre {
      background: rgba(0,0,0,0.04) !important;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.4;
      padding: 8px;
      border-left: 3px solid #4f46e5;
      border-radius: 4px;
      color: #1e1b4b;
    }
    
    .ruled-notebook-preview ul { list-style-type: disc; margin-left: 16px; }
    .ruled-notebook-preview ol { list-style-type: decimal; margin-left: 16px; }
  </style>
</head>
<body class="text-gray-800 dark:text-gray-200 min-h-screen">

  <header class="sticky top-0 z-40 bg-white/10 dark:bg-gray-950/20 backdrop-blur-md border-b border-black/5 dark:border-white/5">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3.5">
        <div onclick="window.location.href='dashboard.html'" class="cursor-pointer w-10 h-10 bg-gradient-to-r from-purple-600 to-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-sm shadow-lg">
          <i class="fa-solid fa-arrow-left"></i>
        </div>
        <h1 class="text-xl font-bold tracking-tight text-gray-900 dark:text-white">
          Digital Vault <span class="text-xs font-semibold text-indigo-600 dark:text-purple-400 border border-indigo-500/30 dark:border-purple-500/30 px-1.5 py-0.5 rounded-md ml-1 bg-indigo-500/10 dark:bg-purple-500/10">Storage</span>
        </h1>
      </div>

      <button onclick="toggleTheme()" id="themeToggleBtn" class="w-10 h-10 flex items-center justify-center rounded-xl bg-gray-200/50 dark:bg-white/5 border border-black/5 dark:border-white/10 text-gray-700 dark:text-gray-300 hover:scale-105 transition-all">
        <i class="fa-solid fa-sun hidden dark:block"></i>
        <i class="fa-solid fa-moon block dark:hidden"></i>
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-12">
    <div class="mb-10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <h2 class="text-3xl font-bold text-gray-900 dark:text-white tracking-tight">System Transcripts</h2>
        <p class="text-gray-500 dark:text-gray-400 text-sm font-light mt-1">Review saved analytical records and custom compiled notes.</p>
      </div>
      <button onclick="clearAllNotes()" class="px-4 py-2 bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 text-red-500 dark:text-red-400 text-xs font-semibold rounded-xl transition-all">
        <i class="fa-solid fa-dumpster-fire mr-1"></i> Clear All Vaults
      </button>
    </div>

    <div id="notesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

    <div id="emptyState" class="hidden text-center py-20">
      <div class="text-gray-400 dark:text-gray-600 text-5xl mb-4"><i class="fa-solid fa-folder-open"></i></div>
      <p class="text-gray-600 dark:text-gray-400 font-medium">No notes synthesized yet.</p>
      <p class="text-gray-400 dark:text-gray-500 text-sm mt-1">Ask EDITH to "prepare notes" in the Intelligence Lab terminal.</p>
    </div>
  </main>

  <script>
    window.onload = () => {
      applySavedTheme();
      if (!localStorage.getItem('token')) {
        window.location.href = 'login.html';
        return;
      }
      renderNotes();
    };

    function applySavedTheme() {
      const dashboardMode = localStorage.getItem('mode');
      const dashboardTheme = localStorage.getItem('theme');
      
      if (dashboardMode === 'light' || dashboardTheme === 'light' || dashboardMode === 'false') {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
      } else {
        document.documentElement.classList.remove('light');
        document.documentElement.classList.add('dark');
      }
    }

    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
        localStorage.setItem('mode', 'light'); 
        localStorage.setItem('theme', 'light'); 
      } else {
        document.documentElement.classList.remove('light');
        document.documentElement.classList.add('dark');
        localStorage.setItem('mode', 'dark');  
        localStorage.setItem('theme', 'dark');  
      }
    }

    function renderNotes() {
      const container = document.getElementById('notesContainer');
      const emptyState = document.getElementById('emptyState');
      
      let notes = [];
      try {
        notes = JSON.parse(localStorage.getItem('edith_vault_notes')) || [];
      } catch (e) {
        console.error("Database parsing fault, resetting stream registry.", e);
        notes = [];
      }

      if (notes.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      
      let htmlContent = "";
      notes.forEach(note => {
        let rawContent = note.body || note.content || "";
        let renderedMarkdown = "";
        try {
          renderedMarkdown = typeof marked.parse === 'function' ? marked.parse(rawContent) : rawContent;
        } catch(err) {
          renderedMarkdown = rawContent;
        }

        htmlContent += `
          <div class="glass-card rounded-2xl p-6 relative flex flex-col justify-between" id="card_${note.id}">
            <div>
              <div class="flex justify-between items-start mb-4 pr-8">
                <h3 class="text-lg font-bold text-indigo-600 dark:text-purple-400 tracking-tight">${escapeHtml(note.title || "Synthesized Knowledge Unit")}</h3>
                <button onclick="deleteNote('${note.id}')" title="Delete Note" class="text-gray-400 dark:text-gray-500 hover:text-red-500 transition-colors absolute top-6 right-6 text-sm">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </div>
              
              <div class="ruled-notebook-preview rounded-xl p-4 max-h-60 overflow-y-auto border border-amber-200/40 shadow-inner space-y-2 mb-2">
                <div class="text-xs font-sans font-bold text-indigo-600/60 uppercase tracking-widest border-b border-dashed border-indigo-200 pb-1 mb-2 select-none">// Live Notebook Blueprint Preview</div>
                <div class="font-medium">
                  ${renderedMarkdown}
                </div>
              </div>
            </div>
            
            <div class="mt-4 pt-4 border-t border-black/5 dark:border-white/5 flex items-center justify-between text-[11px] text-gray-400 dark:text-gray-500 font-mono">
              <span>${note.timestamp || "Recent Build"}</span>
              <button onclick="downloadSingleNoteAsPDF('${note.id}')" class="px-2.5 py-1 bg-indigo-600/10 dark:bg-purple-600/20 hover:bg-indigo-600 hover:dark:bg-purple-600 border border-indigo-500/30 dark:border-purple-500/30 text-indigo-600 dark:text-purple-300 hover:text-white rounded-md font-sans font-semibold transition-all flex items-center gap-1 text-[11px]">
                <i class="fa-solid fa-file-pdf"></i> Export Handwriting PDF
              </button>
            </div>
          </div>
        `;
      });

      container.innerHTML = htmlContent;
    }

    function downloadSingleNoteAsPDF(noteId) {
      const notes = JSON.parse(localStorage.getItem('edith_vault_notes')) || [];
      const note = notes.find(n => n.id === noteId || n._id === noteId);

      if (!note) {
        alert("Transcript map asset trace lost.");
        return;
      }

      const rawContent = note.body || note.content || "";
      const printWrapper = document.createElement('div');
      printWrapper.style.padding = '50px 40px';
      printWrapper.style.color = '#0f172a'; 
      printWrapper.style.backgroundColor = '#faf8f5'; 
      printWrapper.style.backgroundImage = 'linear-gradient(#e2dcd5 1px, transparent 1px)';
      printWrapper.style.backgroundSize = '100% 28px';
      printWrapper.style.fontFamily = '"Caveat", cursive';
      printWrapper.style.fontSize = '22px';
      printWrapper.style.lineHeight = '28px';

      let parsedContent = "";
      try {
        parsedContent = typeof marked.parse === 'function' ? marked.parse(rawContent) : rawContent;
      } catch(e) {
        parsedContent = rawContent;
      }

      printWrapper.innerHTML = `
        <div style="border-bottom: 2px dashed #4f46e5; padding-bottom: 8px; margin-bottom: 28px; font-family: sans-serif; line-height: 1.4;">
          <h1 style="color: #4f46e5; margin: 0; font-size: 16px; font-weight: bold; letter-spacing: 1px;">EDITH DIGITAL VAULT NOTEBOOK</h1>
          <p style="color: #64748b; margin: 4px 0 0 0; font-size: 11px; text-transform: uppercase;">
            Ref: ${note.id || 'Vault-Node'} • Created: ${note.timestamp || 'Chrono Node Active'}
          </p>
        </div>
        <div style="margin-bottom: 15px;">
          <h2 style="color: #1e1b4b; font-size: 26px; margin-top: 0; font-weight: 700; text-decoration: underline; decoration-color: #a78bfa;">${note.title}</h2>
        </div>
        <div class="handwritten-body" style="font-weight: 500;">
          ${parsedContent}
        </div>
      `;

      printWrapper.querySelectorAll('pre').forEach(p => {
        p.style.backgroundColor = 'rgba(0,0,0,0.03)';
        p.style.fontFamily = 'monospace';
        p.style.fontSize = '14px';
        p.style.padding = '10px';
        p.style.margin = '10px 0';
        p.style.borderRadius = '6px';
        p.style.borderLeft = '3px solid #4f46e5';
        p.style.lineHeight = '1.4';
      });
      
      printWrapper.querySelectorAll('ul, ol').forEach(list => {
        list.style.paddingLeft = '20px';
      });

      const printOptions = {
        margin:       15,
        filename:     `${note.title.replace(/[^a-z0-9]/gi, '_')}_Handwritten.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, logging: false },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().from(printWrapper).set(printOptions).save();
    }

    function deleteNote(noteId) {
      if(confirm("Delete this specific analytical transcript note entry?")) {
        let notes = JSON.parse(localStorage.getItem('edith_vault_notes')) || [];
        notes = notes.filter(note => note.id !== noteId && note._id !== noteId);
        localStorage.setItem('edith_vault_notes', JSON.stringify(notes));
        renderNotes();
      }
    }

    function clearAllNotes() {
      if(confirm("CRITICAL ACTION: Completely purge all structured vault summaries permanently?")) {
        localStorage.removeItem('edith_vault_notes');
        renderNotes();
      }
    }

    function escapeHtml(text) {
      if (!text) return "";
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
