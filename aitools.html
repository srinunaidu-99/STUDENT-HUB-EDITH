<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specialized Pipelines - EDITH Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700&display=swap');
    
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #030712 75%); 
      overflow-x: hidden; 
    }
    
    .glass-panel {
      background: rgba(10, 11, 23, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    
    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 20px 2px rgba(99, 102, 241, 0.4), 0 0 40px 8px rgba(168, 85, 247, 0.2);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 0 35px 6px rgba(99, 102, 241, 0.6), 0 0 60px 16px rgba(168, 85, 247, 0.4);
      }
    }
    .edith-orb {
      animation: pulseGlow 4s ease-in-out infinite;
      background: linear-gradient(135deg, #6366f1, #a855f7);
    }
  </style>
</head>
<body class="text-gray-200 min-h-screen">

  <header class="bg-gray-950/20 backdrop-blur-md border-b border-white/5 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3.5 cursor-pointer" onclick="window.location.href='dashboard.html'">
        <div class="edith-orb w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold tracking-wider text-sm shadow-lg">
          E
        </div>
        <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-gray-200 to-indigo-300 bg-clip-text text-transparent">
          EDITH <span class="text-xs font-semibold text-cyan-400 border border-cyan-500/30 px-1.5 py-0.5 rounded-md ml-1 bg-cyan-500/10">LIVE COMPILER</span>
        </h1>
      </div>
      
      <button onclick="window.location.href='dashboard.html'" class="px-4 py-2 text-xs font-semibold bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl transition-all flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Back to Control Matrix
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-10 sm:py-14">
    
    <div class="mb-10 flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div class="text-center md:text-left">
        <span class="text-[10px] uppercase tracking-widest font-bold text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-2.5 py-1 rounded-md inline-block mb-3">Cloud Sandbox Core</span>
        <h2 class="text-2xl sm:text-4xl font-bold text-white tracking-tight mb-2">Live Multi-Language Compiler</h2>
        <p class="text-gray-400 text-sm font-light">Write code natively, execute in safe remote sandboxes, and capture stdout/stderr instantly.</p>
      </div>
      
      <!-- Selector Hub -->
      <div class="flex justify-center">
        <div class="bg-gray-900/80 border border-white/10 rounded-xl px-3 py-2 flex items-center gap-2">
          <label class="text-[10px] font-bold uppercase tracking-wider text-gray-400">Environment:</label>
          <select id="languageSelector" onchange="handleLanguageChange()" class="bg-transparent text-sm font-semibold text-white outline-none cursor-pointer pr-4">
            <option value="python" class="bg-gray-950 text-gray-200">Python 3 (3.10.0)</option>
            <option value="javascript" class="bg-gray-950 text-gray-200">JavaScript (Node v18)</option>
            <option value="c" class="bg-gray-950 text-gray-200">C (GCC 10.2.0)</option>
            <option value="cpp" class="bg-gray-950 text-gray-200">C++ (GCC 10.2.0)</option>
            <option value="java" class="bg-gray-950 text-gray-200">Java (OpenJDK 15)</option>
            <option value="go" class="bg-gray-950 text-gray-200">Go Lang (1.16.2)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Workspace Deck -->
    <div class="glass-panel rounded-3xl p-6 sm:p-8 shadow-xl relative">
      <div class="space-y-6">
        
        <!-- Editor Frame -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="block text-[10px] uppercase font-bold tracking-wider text-gray-400">Source Code Input Terminal</label>
            <span id="langIndicator" class="text-xs text-indigo-400 font-mono">main.py</span>
          </div>
          <textarea id="sourceInput" placeholder="Initialize source payload structure here..." 
            class="w-full h-72 bg-gray-950/80 border border-white/10 focus:border-indigo-500/50 rounded-2xl p-5 text-sm font-mono outline-none transition-all placeholder-gray-700 shadow-inner resize-y text-gray-100"></textarea>
        </div>

        <!-- Engine Triggers -->
        <div class="flex items-center justify-between flex-wrap gap-4 border-t border-white/5 pt-4">
          <div id="processingLoader" class="hidden items-center gap-2 text-xs font-medium text-amber-400">
            <i class="fa-solid fa-circle-notch animate-spin text-sm"></i> Compiling matrix stream on secure server arrays...
          </div>
          <div id="idleStatus" class="text-xs text-gray-500 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full inline-block"></span> Remote Runtime System Online
          </div>
          
          <button onclick="executeCodeLive()" class="px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 active:scale-95 text-white font-bold text-xs tracking-wider rounded-xl transition-all shadow-lg shadow-indigo-600/10 flex items-center gap-2">
            <i class="fa-solid fa-play text-[10px]"></i> EXECUTE LIVE PAYLOAD
          </button>
        </div>

        <!-- Terminal Logs -->
        <div class="relative pt-2">
          <div class="flex justify-between items-center mb-2">
            <label class="block text-[10px] uppercase font-bold tracking-wider text-gray-400">Live Terminal Logs (stdout)</label>
            <button onclick="copyTerminalOutput()" id="copyBtn" class="text-[11px] text-indigo-400 hover:text-indigo-300 font-semibold transition-all flex items-center gap-1.5 bg-indigo-500/5 hover:bg-indigo-500/10 border border-indigo-500/20 px-2.5 py-1 rounded-lg">
              <i class="fa-regular fa-copy"></i> Copy Output
            </button>
          </div>
          <div id="outputContainer" style="white-space: pre-wrap;" class="w-full h-48 bg-black/95 border border-white/5 rounded-2xl p-4 text-sm font-mono overflow-y-auto text-emerald-400 select-all shadow-2xl"></div>
        </div>

      </div>
    </div>
  </main>

  <script>
    // Exact Piston API Version Mappings to bypass 401/400 errors
    const runtimeConfig = {
      python: { version: "3.10.0", file: "main.py", code: "print(\"Hello, EDITH System Engine!\")\n\n# Quick Test Loop\nfor i in range(1, 4):\n    print(f\"Processing secure pipeline stack: {i}\")" },
      javascript: { version: "18.15.0", file: "index.js", code: "console.log(\"Node.js Virtual Sandbox Active.\");\n\nconst items = ['Auth_Node', 'Database_Core', 'API_Gateway'];\nitems.forEach((item, index) => {\n    console.log(`[Matrix Key ${index + 1}]: ${item}`);\n});" },
      c: { version: "10.2.0", file: "main.c", code: "#include <stdio.h>\n\nint main() {\n    printf(\"Hello from Native C Runtime Environment!\\n\");\n    int val = 42;\n    printf(\"Allocated system constant core: %d\\n\", val);\n    return 0;\n}" },
      cpp: { version: "10.2.0", file: "main.cpp", code: "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    cout << \"C++ Sandboxed Compiler Online.\" << endl;\n    vector<int> stream = {10, 20, 30};\n    cout << \"Stream buffer size parsed: \" << stream.size() << endl;\n    return 0;\n}" },
      java: { version: "15.0.2", file: "Main.java", code: "public class Main {\n    public static void main(String[] args) {\n        System.out.println(\"Java Sandbox Stream Initialized successfully.\");\n        System.out.println(\"System Architecture: OpenJDK Engine\");\n    }\n}" },
      go: { version: "1.16.2", file: "main.go", code: "package main\nimport \"fmt\"\n\nfunc main() {\n    fmt.Println(\"Go Language Core active inside compiler cluster.\")\n}" }
    };

    window.onload = () => {
      handleLanguageChange();
    };

    function handleLanguageChange() {
      const selectedLang = document.getElementById('languageSelector').value;
      const target = runtimeConfig[selectedLang];
      
      document.getElementById('langIndicator').innerText = target.file;
      document.getElementById('sourceInput').value = target.code;
      document.getElementById('outputContainer').innerHTML = "";
    }

    async function executeCodeLive() {
      const currentLang = document.getElementById('languageSelector').value;
      const codeValue = document.getElementById('sourceInput').value.trim();
      const outputBox = document.getElementById('outputContainer');
      const loader = document.getElementById('processingLoader');
      const idle = document.getElementById('idleStatus');

      if (!codeValue) {
        alert("Execution halted: Source buffer stream cannot be blank.");
        return;
      }

      loader.classList.remove('hidden');
      loader.classList.add('flex');
      idle.classList.add('hidden');
      outputBox.innerHTML = "<span class='text-amber-400 animate-pulse'>[CONNECTING]: Packaging source matrix and routing to sandbox API clusters...</span>";

      try {
        const response = await fetch("https://emkc.org/api/v2/piston/execute", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            language: currentLang,
            version: runtimeConfig[currentLang].version, 
            files: [{ name: runtimeConfig[currentLang].file, content: codeValue }]
          })
        });

        if (!response.ok) {
          throw new Error(`Server returned network exception state code: ${response.status}`);
        }

        const data = await response.json();
        
        loader.classList.remove('flex');
        loader.classList.add('hidden');
        idle.classList.remove('hidden');

        if (data && data.run) {
          const stdout = data.run.stdout;
          const stderr = data.run.stderr;

          if (stderr) {
            outputBox.innerHTML = `<span class='text-red-500 font-bold'>[RUNTIME EXCEPTION REGISTERED]:</span>\n<span class='text-red-400'>${escapeHTML(stderr)}</span>`;
          } else if (stdout) {
            outputBox.innerHTML = escapeHTML(stdout);
          } else {
            outputBox.innerHTML = "<span class='text-gray-400 font-mono'>[SUCCESS]: Code block executed with no stdout stream returned.</span>";
          }
        } else {
          outputBox.innerHTML = "<span class='text-red-400 font-mono'>[BUILD FAILURE]: Could not extract execution data from payload.</span>";
        }

      } catch (error) {
        loader.classList.remove('flex');
        loader.classList.add('hidden');
        idle.classList.remove('hidden');
        outputBox.innerHTML = `<span class='text-red-500 font-bold'>[API PIPELINE BREAKDOWN]:</span>\n<span class='text-red-400'>${error.message}\nEnsure server endpoints are accessible.</span>`;
      }
    }

    function escapeHTML(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function copyTerminalOutput() {
      const outputBox = document.getElementById('outputContainer');
      if (!outputBox.innerText || outputBox.innerText.includes("[CONNECTING]")) return;

      navigator.clipboard.writeText(outputBox.innerText).then(() => {
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i> Buffer Copied';
        setTimeout(() => {
          copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy Output';
        }, 2000);
      });
    }
  </script>
</body>
</html>
