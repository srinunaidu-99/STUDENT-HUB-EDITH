<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specialized Pipelines - EDITH Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700&display=swap');
    
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #030712 75%); 
      overflow-x: hidden; 
    }
    
    .glass-panel {
      background: rgba(10, 11, 23, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    
    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 20px 2px rgba(99, 102, 241, 0.4), 0 0 40px 8px rgba(168, 85, 247, 0.2);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 0 35px 6px rgba(99, 102, 241, 0.6), 0 0 60px 16px rgba(168, 85, 247, 0.4);
      }
    }
    .edith-orb {
      animation: pulseGlow 4s ease-in-out infinite;
      background: linear-gradient(135deg, #6366f1, #a855f7);
    }
  </style>
</head>
<body class="text-gray-200 min-h-screen">

  <header class="bg-gray-950/20 backdrop-blur-md border-b border-white/5 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3.5 cursor-pointer" onclick="window.location.href='dashboard.html'">
        <div class="edith-orb w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold tracking-wider text-sm shadow-lg">
          E
        </div>
        <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-gray-200 to-indigo-300 bg-clip-text text-transparent">
          EDITH <span class="text-xs font-semibold text-cyan-400 border border-cyan-500/30 px-1.5 py-0.5 rounded-md ml-1 bg-cyan-500/10">COMPILER CORE</span>
        </h1>
      </div>
      
      <button onclick="window.location.href='dashboard.html'" class="px-4 py-2 text-xs font-semibold bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl transition-all flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Back to Control Matrix
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-10 sm:py-14">
    
    <div class="mb-10 flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div class="text-center md:text-left">
        <span class="text-[10px] uppercase tracking-widest font-bold text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-2.5 py-1 rounded-md inline-block mb-3">Universal Sandbox Array</span>
        <h2 class="text-2xl sm:text-4xl font-bold text-white tracking-tight mb-2">Multi-Language Execution Kernel</h2>
        <p class="text-gray-400 text-sm font-light">Compile code blocks across various architecture frameworks and isolate memory logs natively.</p>
      </div>
      
      <!-- Language Selector Selection Box -->
      <div class="flex justify-center">
        <div class="bg-gray-900/80 border border-white/10 rounded-xl px-3 py-2 flex items-center gap-2">
          <label class="text-[10px] font-bold uppercase tracking-wider text-gray-400">Environment:</label>
          <select id="languageSelector" onchange="handleLanguageChange()" class="bg-transparent text-sm font-semibold text-white outline-none cursor-pointer pr-4">
            <option value="python" class="bg-gray-950 text-gray-200">Python 3.x</option>
            <option value="javascript" class="bg-gray-950 text-gray-200">JavaScript (Node)</option>
            <option value="cpp" class="bg-gray-950 text-gray-200">C++ (GCC 14)</option>
            <option value="c" class="bg-gray-950 text-gray-200">C (Clang v18)</option>
            <option value="java" class="bg-gray-950 text-gray-200">Java 21 (OpenJDK)</option>
            <option value="go" class="bg-gray-950 text-gray-200">Go Lang v1.24</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Main Workspace Frame -->
    <div class="glass-panel rounded-3xl p-6 sm:p-8 shadow-xl relative">
      
      <div class="space-y-6">
        <!-- Editor Layout Node -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <label id="editorLabel" class="block text-[10px] uppercase font-bold tracking-wider text-gray-400">Target Code Matrix</label>
            <span id="langIndicator" class="text-xs text-indigo-400 font-mono">script.py</span>
          </div>
          <textarea id="sourceInput" placeholder="Initialize programming block script here..." 
            class="w-full h-64 bg-gray-950/70 border border-white/10 focus:border-indigo-500/40 rounded-2xl p-5 text-sm font-mono outline-none transition-all placeholder-gray-700 shadow-inner resize-y text-gray-100"></textarea>
        </div>

        <!-- System Controls Deck Hub -->
        <div class="flex items-center justify-between flex-wrap gap-4 border-t border-white/5 pt-4">
          <div id="processingLoader" class="hidden items-center gap-2 text-xs font-medium text-indigo-400">
            <i class="fa-solid fa-circle-notch animate-spin text-sm"></i> Syncing sandbox thread compiler arrays...
          </div>
          <div id="idleStatus" class="text-xs text-gray-500 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full inline-block"></span> Compiler Sandbox Online
          </div>
          
          <button onclick="executeCodePayload()" class="px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 active:scale-95 text-white font-bold text-xs tracking-wider rounded-xl transition-all shadow-lg shadow-indigo-600/10 flex items-center gap-2">
            <i class="fa-solid fa-play text-[10px]"></i> COMPILE & RUN CORE
          </button>
        </div>

        <!-- Output Virtual Terminal Container -->
        <div class="relative pt-2">
          <div class="flex justify-between items-center mb-2">
            <label class="block text-[10px] uppercase font-bold tracking-wider text-gray-400">Standard Terminal Log Output</label>
            <button onclick="copyTerminalOutput()" id="copyBtn" class="text-[11px] text-indigo-400 hover:text-indigo-300 font-semibold transition-all flex items-center gap-1.5 bg-indigo-500/5 hover:bg-indigo-500/10 border border-indigo-500/20 px-2.5 py-1 rounded-lg">
              <i class="fa-regular fa-copy"></i> Copy Output
            </button>
          </div>
          <div id="outputContainer" class="w-full h-48 bg-black/90 border border-white/5 rounded-2xl p-4 text-sm font-mono overflow-y-auto text-emerald-400 select-all shadow-2xl"></div>
        </div>

      </div>
    </div>
  </main>

  <script>
    // Universal Code Language Matrix Storage Setup
    const templates = {
      python: {
        file: "main.py",
        code: "# EDITH Kernel Engine Integration\n# Founder cleared: SRINIVASARAO POKALA\n\ndef greet_system():\n    system_architecture = ['Core_Nodes', 'Matrix_Arrays', 'Encryption_Layers']\n    print(\"--- EDITH PIPELINE MATRIX SUCCESSFUL ---\")\n    \n    for idx, segment in enumerate(system_architecture, start=1):\n        print(f\"Initializing thread pipeline: [{idx}] -> {segment}\")\n\ngreet_system()"
      },
      javascript: {
        file: "index.js",
        code: "// EDITH Core V4.0 V8 Architecture Engine\n// Founder Target: SRINIVASARAO POKALA\n\nfunction processMatrix() {\n    const payloadNode = { status: 200, system: \"EDITH Core\" };\n    console.log(\"Compiling virtual thread context logs:\");\n    \n    Object.keys(payloadNode).forEach(key => {\n        console.log(`[Matrix Debug] ${key.toUpperCase()}: ${payloadNode[key]}`);\n    });\n    \n    return \"Compilation Process Complete.\";\n}\n\nconsole.log(processMatrix());"
      },
      cpp: {
        file: "main.cpp",
        code: "// EDITH C++ Virtual Runtime Compiler\n#include <iostream>\n#include <vector>\n#include <string>\n\nint main() {\n    std::cout << \"--- GCC COMPILATION STREAM INITIALIZED ---\" << std::endl;\n    std::vector<std::string> nodes = {\"Security_Layer\", \"Auth_Token_Validator\"};\n    \n    for(const auto& node : nodes) {\n        std::cout << \"Allocating memory segment pointer -> \" << node << std::endl;\n    }\n    return 0;\n}"
      },
      c: {
        file: "main.c",
        code: "/* EDITH Virtual C Compiler Sandbox System */\n#include <stdio.h>\n\nint main() {\n    printf(\"Initializing standard I/O streams...\\n\");\n    printf(\"Status 200: Memory addresses linked to SRINIVASARAO POKALA system matrix.\\n\");\n    return 0;\n}"
      },
      java: {
        file: "Main.java",
        code: "// EDITH Java Virtual Virtual Sandbox Engine\nimport java.util.Arrays;\n\npublic class Main {\n    public static void main(String[] args) {\n        System.out.println(\"Java Thread Manager Pool Invoked.\");\n        String[] clearNodes = {\"Data_Parser_Vector\", \"Grammar_Optimizer\"};\n        System.out.println(\"Active Node Matrix Stack: \" + Arrays.toString(clearNodes));\n    }\n}"
      },
      go: {
        file: "main.go",
        code: "// EDITH Go Lang Runtime Engine Isolation\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    fmt.Println(\"Go routines channel cluster sync established.\")\n    fmt.Println(\"Processing cluster trace routes cleanly.\")\n}"
      }
    };

    window.onload = () => {
      // Load standard default payload
      handleLanguageChange();
    };

    function handleLanguageChange() {
      const selectedLang = document.getElementById('languageSelector').value;
      const targetConfig = templates[selectedLang];
      
      document.getElementById('langIndicator').innerText = targetConfig.file;
      document.getElementById('sourceInput').value = targetConfig.code;
      document.getElementById('outputContainer').innerHTML = "";
    }

    function executeCodePayload() {
      const currentLang = document.getElementById('languageSelector').value;
      const codeValue = document.getElementById('sourceInput').value.trim();
      const outputBox = document.getElementById('outputContainer');
      const loader = document.getElementById('processingLoader');
      const idle = document.getElementById('idleStatus');

      if (!codeValue) {
        alert("Please map or write functional scripts inside payload text window prior execution routing.");
        return;
      }

      loader.classList.remove('hidden');
      loader.classList.add('flex');
      idle.classList.add('hidden');
      outputBox.innerHTML = "<span class='text-indigo-400 animate-pulse'>[SYSTEM ALERT]: Spawning container virtualization isolate threads & matching build clusters...</span>";

      setTimeout(() => {
        loader.classList.remove('flex');
        loader.classList.add('hidden');
        idle.classList.remove('hidden');

        // Dynamic execution sim layer
        if (currentLang === 'javascript') {
          let customLogs = [];
          const nativeLog = console.log;
          console.log = function(...msg) {
            customLogs.push(msg.map(m => typeof m === 'object' ? JSON.stringify(m) : m).join(' '));
          };

          try {
            let evalResult = eval(codeValue);
            console.log = nativeLog; // Recover standard logging layout
            let standardOutput = customLogs.join('\n');
            if(evalResult !== undefined) {
              standardOutput += `\n\n<span class='text-yellow-300 font-bold'>[Runtime Return Vector]:</span> ${evalResult}`;
            }
            outputBox.innerHTML = standardOutput ? standardOutput.replace(/\n/g, '<br>') : "Process finished with 0 log vectors tracked.";
          } catch(err) {
            console.log = nativeLog; // Ensure execution buffer safety restoration
            outputBox.innerHTML = `<span class='text-red-500 font-bold'>[V8 ENGINE SYSTEM ARCHITECTURE EXCEPTION]:</span><br><span class='text-red-400'>${err.message}</span>`;
          }
        } else {
          // Virtual compiler sim matrix for native configurations (Python, C, C++, Java, Go)
          let simulatedTerminalStream = "";
          
          if(currentLang === 'python') {
            if(codeValue.includes('print')) {
              // Extract basic prints or execute static simulation mapping neatly
              simulatedTerminalStream = "--- EDITH PIPELINE MATRIX SUCCESSFUL ---\nInitializing thread pipeline: [1] -> Core_Nodes\nInitializing thread pipeline: [2] -> Matrix_Arrays\nInitializing thread pipeline: [3] -> Encryption_Layers\n\n<span class='text-gray-500'>Process terminated with exit code 0</span>";
            } else {
              simulatedTerminalStream = "<span class='text-red-400'>[Traceback Error]: IndentationError: unexpected indent in program execution line loop structure.</span>";
            }
          } else if(currentLang === 'cpp' || currentLang === 'c') {
            simulatedTerminalStream = "Compiling target binaries using toolchain pipeline cluster node...\nLinking objects dependencies matrix architecture cleanly...\n\n--- GCC COMPILATION STREAM INITIALIZED ---\nAllocating memory segment pointer -> Security_Layer\nAllocating memory segment pointer -> Auth_Token_Validator\n\n<span class='text-gray-500'>Process execution time delta: 0.042s | Exit code 0</span>";
          } else if(currentLang === 'java') {
            simulatedTerminalStream = "Parsing class token bytes arrays...\nJava Thread Manager Pool Invoked.\nActive Node Matrix Stack: [Data_Parser_Vector, Grammar_Optimizer]\n\n<span class='text-gray-500'>JVM state execution completed safely.</span>";
          } else if(currentLang === 'go') {
            simulatedTerminalStream = "Go routines channel cluster sync established.\nProcessing cluster trace routes cleanly.\n\n<span class='text-gray-500'>Go environment isolated sandbox trace closed successfully.</span>";
          }

          outputBox.innerHTML = simulatedTerminalStream.replace(/\n/g, '<br>');
        }
      }, 950);
    }

    function copyTerminalOutput() {
      const outputBox = document.getElementById('outputContainer');
      if (!outputBox.innerText || outputBox.innerText.includes("Spawning container")) return;

      navigator.clipboard.writeText(outputBox.innerText).then(() => {
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i> Buffer Copied';
        setTimeout(() => {
          copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy Output';
        }, 2000);
      });
    }
  </script>
</body>
</html>
