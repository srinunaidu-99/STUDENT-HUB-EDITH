<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Compiler 🔥</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>

  <style>
    body {
      font-family: 'Fira Code', monospace;
      transition: background 0.2s ease, color 0.2s ease;
    }
    textarea {
      resize: none;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.3);
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen p-2 sm:p-4">

  <!-- Main Container full width for proper coding workspace -->
  <div class="w-full max-w-7xl mx-auto bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-xl p-4">
    
    <!-- Top Bar: Clean Action Row -->
    <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3 mb-4">
      <div class="flex items-center gap-4">
        <!-- Language Selector -->
        <select id="lang" onchange="updateTemplate()" class="bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm font-bold rounded-lg px-3 py-1.5 outline-none text-emerald-600 dark:text-emerald-400 cursor-pointer focus:border-emerald-500 transition-colors">
          <option value="py">Python 3</option>
          <option value="js">JavaScript (Node)</option>
          <option value="c">C (GCC)</option>
          <option value="cpp">C++ (G++)</option>
          <option value="java">Java 17</option>
        </select>

        <span id="editorLangLabel" class="text-xs font-bold uppercase tracking-wider text-slate-400">python</span>
      </div>

      <!-- Control Actions and Simple Mode Toggle Icon -->
      <div class="flex items-center gap-3">
        <button onclick="copyCode()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors text-sm" title="Copy Code">
          <i class="fa-solid fa-copy"></i>
        </button>
        <button onclick="clearEditor()" class="text-slate-400 hover:text-red-500 transition-colors text-sm" title="Clear Code">
          <i class="fa-solid fa-trash-can"></i>
        </button>
        
        <!-- Only The Theme Toggle Icon as Requested -->
        <button onclick="toggleTheme()" class="w-8 h-8 flex items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:scale-105 transition-all" title="Toggle Mode">
          <i id="themeIcon" class="fa-solid fa-sun text-amber-500 text-base"></i>
        </button>
      </div>
    </div>

    <!-- Workspace Layout Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      
      <!-- Source Code Input Block (Takes 2/3 space) -->
      <div class="lg:col-span-2 flex flex-col">
        <textarea id="code" class="w-full h-[500px] p-4 bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800/80 rounded-xl outline-none font-mono text-base md:text-lg font-medium leading-relaxed text-slate-900 dark:text-emerald-400 focus:border-emerald-500/50 transition-colors">print("Hello Srinu 🔥")</textarea>
        
        <!-- Run & AI Assistant CTA Grid -->
        <div class="grid grid-cols-3 gap-2 mt-3">
          <button onclick="runCode()" class="col-span-1 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-xl shadow-md active:scale-95 transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-play"></i> Run
          </button>
          <button onclick="askAI('explain')" class="py-3 bg-slate-100 dark:bg-slate-800 hover:bg-indigo-600 hover:text-white dark:hover:bg-indigo-600 transition-all font-semibold text-xs text-slate-600 dark:text-slate-300 rounded-xl">
            AI Explain
          </button>
          <button onclick="askAI('debug')" class="py-3 bg-slate-100 dark:bg-slate-800 hover:bg-amber-600 hover:text-white dark:hover:bg-amber-600 transition-all font-semibold text-xs text-slate-600 dark:text-slate-300 rounded-xl">
            AI Debug
          </button>
        </div>
      </div>

      <!-- Inputs & Execution Output Console (Takes 1/3 space) -->
      <div class="flex flex-col gap-3">
        <!-- STDIN Section -->
        <div class="flex flex-col h-40">
          <div class="text-[11px] font-bold tracking-wider text-slate-400 dark:text-slate-500 mb-1">STDIN (INPUT)</div>
          <textarea id="input" placeholder="Enter runtime inputs here..." class="w-full flex-1 p-3 bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800 rounded-xl outline-none font-mono text-sm text-slate-800 dark:text-slate-300 focus:border-slate-400 dark:focus:border-slate-700 transition-colors"></textarea>
        </div>

        <!-- STDOUT Terminal Display Section -->
        <div class="flex flex-col flex-1 min-h-[340px]">
          <div class="flex items-center justify-between mb-1">
            <div class="text-[11px] font-bold tracking-wider text-slate-400 dark:text-slate-500">STDOUT (CONSOLE MONITOR)</div>
            <button onclick="document.getElementById('output').innerText = '💡 Console cleared. Ready.';" class="text-[10px] text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 underline font-normal">Clear</button>
          </div>
          <pre id="output" class="w-full flex-1 p-4 bg-slate-950 border border-slate-800 rounded-xl overflow-auto font-mono text-base font-bold text-cyan-400 leading-relaxed whitespace-pre-wrap">💡 Console ready.</pre>
        </div>
      </div>

    </div>

  </div>

  <script>
    const templates = {
      py: `print("Hello Srinu 🔥")\n\n# Input taking sample:\n# name = input()\n# print("Welcome", name)`,
      js: `console.log("Hello Srinu 🔥");`,
      c: `#include <stdio.h>\n\nint main() {\n    printf("Hello Srinu 🔥\\n");\n    return 0;\n}`,
      cpp: `#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello Srinu 🔥" << endl;\n    return 0;\n}`,
      java: `public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello Srinu 🔥");\n    }\n}`
    };

    // Simple Live UI Theme Toggler
    function toggleTheme() {
      const htmlEl = document.documentElement;
      const themeIcon = document.getElementById('themeIcon');
      
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        themeIcon.className = "fa-solid fa-moon text-indigo-600";
        localStorage.setItem('mode', 'light');
      } else {
        htmlEl.classList.add('dark');
        themeIcon.className = "fa-solid fa-sun text-amber-500";
        localStorage.setItem('mode', 'dark');
      }
    }

    // Set fallback mode instantly on view load
    window.onload = () => {
      const savedMode = localStorage.getItem('mode');
      const htmlEl = document.documentElement;
      const themeIcon = document.getElementById('themeIcon');
      
      if (savedMode === 'light') {
        htmlEl.classList.remove('dark');
        themeIcon.className = "fa-solid fa-moon text-indigo-600";
      } else {
        htmlEl.classList.add('dark');
        themeIcon.className = "fa-solid fa-sun text-amber-500";
      }
    };

    function updateTemplate() {
      const lang = document.getElementById("lang").value;
      document.getElementById("code").value = templates[lang];
      document.getElementById("editorLangLabel").innerText = lang === 'py' ? 'python' : lang;
    }

    function copyCode() {
      const code = document.getElementById("code");
      code.select();
      document.execCommand("copy");
    }

    function clearEditor() {
      if(confirm("Clear everything in the editor?")) {
        document.getElementById("code").value = "";
      }
    }

    // High performance direct proxy pipeline trigger
    async function runCode() {
      const code = document.getElementById("code").value;
      const lang = document.getElementById("lang").value;
      const input = document.getElementById("input").value;
      const output = document.getElementById("output");

      output.innerText = "⏳ Executing...";
      output.style.color = ""; 

      try {
        const payloadParams = new URLSearchParams();
        payloadParams.append('code', code);
        payloadParams.append('language', lang); 
        payloadParams.append('input', input);

        const res = await fetch("https://api.codex.jaagrav.in", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: payloadParams
        });

        const data = await res.json();

        if (data.error) {
          output.innerText = "❌ Error:\n" + data.error;
          output.style.color = "#f87171"; 
        } else if (data.output && data.output.trim() !== "") {
          output.innerText = data.output;
          output.style.color = "#10b981"; 
        } else {
          output.innerText = "✅ Program finished with exit code: 0\n[No dynamic text printed to stream]";
          output.style.color = "#34d399"; 
        }
      } catch (err) {
        output.innerText = "⚠ Server/Network Error. Try again.";
        output.style.color = "#f87171";
      }
    }

    async function askAI(taskType) {
      const code = document.getElementById("code").value;
      const lang = document.getElementById("lang").value;
      const output = document.getElementById("output");

      if(!code.trim()) return;

      output.innerText = `🤖 AI Agent analyzing...`;
      output.style.color = "#818cf8"; 

      setTimeout(() => {
        if(taskType === 'explain') {
          output.innerText = `🤖 [AI Insight]\nThis program targets the execution matrix for "${lang}". It runs commands line-by-line, allocates system memory configurations variables, and streams the finished result safely straight to the terminal frame output console window.`;
        } else {
          output.innerText = `🤖 [AI Debugger]\nReviewing syntax loops... No immediate compilation failures detected inside memory. Keep track of accurate function types and make sure all standard library files are correctly loaded.`;
        }
        output.style.color = "";
      }, 1000);
    }
  </script>
</body>
</html>
