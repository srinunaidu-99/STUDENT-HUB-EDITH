<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Online Compiler ⚡</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>

  <style>
    body {
      font-family: 'Fira Code', monospace;
      transition: background 0.2s ease, color 0.2s ease;
    }
    textarea {
      resize: none;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.3);
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen p-2 sm:p-4">

  <!-- Main Grid Workspace Box -->
  <div class="w-full max-w-7xl mx-auto bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-xl p-4">
    
    <!-- Action Bar Grid Header -->
    <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3 mb-4">
      <div class="flex items-center gap-4">
        <!-- Language Engine Selector Elements -->
        <select id="lang" onchange="updateTemplate()" class="bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm font-bold rounded-lg px-3 py-1.5 outline-none text-emerald-600 dark:text-emerald-400 cursor-pointer focus:border-emerald-500 transition-colors">
          <option value="python">Python 3</option>
          <option value="javascript">JavaScript (Node)</option>
          <option value="c">C (GCC)</option>
          <option value="cpp">C++ (G++)</option>
          <option value="java">Java 17</option>
        </select>

        <span id="editorLangLabel" class="text-xs font-bold uppercase tracking-wider text-slate-400">python</span>
      </div>

      <!-- Theme Controls Frame Stack -->
      <div class="flex items-center gap-3">
        <button onclick="copyCode()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors text-sm" title="Copy Code">
          <i class="fa-solid fa-copy"></i>
        </button>
        <button onclick="clearEditor()" class="text-slate-400 hover:text-red-500 transition-colors text-sm" title="Clear Code">
          <i class="fa-solid fa-trash-can"></i>
        </button>
        
        <!-- Only Pure Minimal Theme Change Icon Toggle -->
        <button onclick="toggleTheme()" class="w-8 h-8 flex items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:scale-105 transition-all" title="Toggle Mode">
          <i id="themeIcon" class="fa-solid fa-sun text-amber-500 text-base"></i>
        </button>
      </div>
    </div>

    <!-- Live Split Workspace View Layout Matrix -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      
      <!-- Source Area Frame Element Panel -->
      <div class="lg:col-span-2 flex flex-col">
        <textarea id="code" class="w-full h-[520px] p-4 bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800/80 rounded-xl outline-none font-mono text-base md:text-lg font-medium leading-relaxed text-slate-900 dark:text-emerald-400 focus:border-emerald-500/50 transition-colors">print("Hello Srinu 🔥")</textarea>
        
        <!-- Run Control Console Trigger Grid row -->
        <div class="mt-3">
          <button onclick="runCode()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-xl shadow-md active:scale-[0.99] transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-play"></i> RUN CODE (EXECUTE)
          </button>
        </div>
      </div>

      <!-- System Terminal Stream Frame Block panel -->
      <div class="flex flex-col gap-3">
        <!-- Input Buffer Console Area -->
        <div class="flex flex-col h-40">
          <div class="text-[11px] font-bold tracking-wider text-slate-400 dark:text-slate-500 mb-1">STDIN (INPUT PANELS)</div>
          <textarea id="input" placeholder="Provide raw input values line by line here..." class="w-full flex-1 p-3 bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800 rounded-xl outline-none font-mono text-sm text-slate-800 dark:text-slate-300 focus:border-slate-400 dark:focus:border-slate-700 transition-colors"></textarea>
        </div>

        <!-- Terminal Shell Monitor Box Display -->
        <div class="flex flex-col flex-1 min-h-[360px]">
          <div class="flex items-center justify-between mb-1">
            <div class="text-[11px] font-bold tracking-wider text-slate-400 dark:text-slate-500">STDOUT (COMPILER TERMINAL MONITOR)</div>
            <button onclick="clearConsole()" class="text-[10px] text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 underline font-normal">Clear</button>
          </div>
          <pre id="output" class="w-full flex-1 p-4 bg-slate-950 border border-slate-800 rounded-xl overflow-auto font-mono text-base font-bold text-cyan-400 leading-relaxed whitespace-pre-wrap">✨ System Terminal Ready.</pre>
        </div>
      </div>

    </div>

  </div>

  <script>
    // Piston API Version Target Map Configuration
    const runtimeConfig = {
      python: { version: "3.10.0", ext: "py" },
      javascript: { version: "18.15.0", ext: "js" },
      c: { version: "10.2.0", ext: "c" },
      cpp: { version: "10.2.0", ext: "cpp" },
      java: { version: "15.0.2", ext: "java" }
    };

    const templates = {
      python: `import sys\n\nprint("Hello Srinu 🔥")\n\n# Input Test Setup:\n# num = input("Enter a value: ")\n# print("You entered:", num)`,
      javascript: `console.log("Hello Srinu 🔥");\n\n// Input setup via FS read streams inside node environment line parameters`,
      c: `#include <stdio.h>\n\nint main() {\n    printf("Hello Srinu 🔥\\n");\n    return 0;\n}`,
      cpp: `#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello Srinu 🔥" << endl;\n    return 0;\n}`,
      java: `public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello Srinu 🔥");\n    }\n}`
    };

    function toggleTheme() {
      const htmlEl = document.documentElement;
      const themeIcon = document.getElementById('themeIcon');
      
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        themeIcon.className = "fa-solid fa-moon text-indigo-600";
        localStorage.setItem('mode', 'light');
      } else {
        htmlEl.classList.add('dark');
        themeIcon.className = "fa-solid fa-sun text-amber-500";
        localStorage.setItem('mode', 'dark');
      }
    }

    window.onload = () => {
      const savedMode = localStorage.getItem('mode');
      const htmlEl = document.documentElement;
      const themeIcon = document.getElementById('themeIcon');
      
      if (savedMode === 'light') {
        htmlEl.classList.remove('dark');
        themeIcon.className = "fa-solid fa-moon text-indigo-600";
      } else {
        htmlEl.classList.add('dark');
        themeIcon.className = "fa-solid fa-sun text-amber-500";
      }
    };

    function updateTemplate() {
      const lang = document.getElementById("lang").value;
      document.getElementById("code").value = templates[lang];
      document.getElementById("editorLangLabel").innerText = lang;
    }

    function copyCode() {
      const code = document.getElementById("code");
      code.select();
      document.execCommand("copy");
    }

    function clearEditor() {
      if(confirm("Clear everything inside code engine workspace?")) {
        document.getElementById("code").value = "";
      }
    }

    function clearConsole() {
      const output = document.getElementById('output');
      output.innerText = "✨ System Terminal Ready.";
      output.style.color = "";
    }

    // 100% Real Live Production Engine Execution Channel (Piston Engine Network)
    async function runCode() {
      const code = document.getElementById("code").value;
      const lang = document.getElementById("lang").value;
      const input = document.getElementById("input").value;
      const output = document.getElementById("output");

      output.innerText = "⏳ Requesting secure sandbox environment container...\n⏳ Compiling logic vectors...";
      output.style.color = "#a1a1aa"; 

      try {
        const payload = {
          language: lang,
          version: runtimeConfig[lang].version,
          files: [
            {
              name: `main.${runtimeConfig[lang].ext}`,
              content: code
            }
          ],
          stdin: input
        };

        const res = await fetch("https://emkc.org/api/v2/piston/execute", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.run) {
          const runResult = data.run;
          
          if (runResult.stderr && runResult.stderr.trim() !== "") {
            output.innerText = `❌ Terminal Runtime Error Matrix:\n\n${runResult.stderr}`;
            output.style.color = "#f87171"; // Error Crimson red
          } else {
            // Direct pure standard output stream injection 
            output.innerText = runResult.output || "✨ Code execution loop closed (Exit Code 0).";
            output.style.color = "#34d399"; // Neon clear emerald green
          }
        } else {
          output.innerText = "❌ Engine Error: Unable to process code block container stream pipeline layers.";
          output.style.color = "#f87171";
        }
      } catch (err) {
        output.innerText = "⚠ Critical Network Exception: Connection to Piston nodes timed out. Verify your internet connection.";
        output.style.color = "#f87171";
      }
    }
  </script>
</body>
</html>
