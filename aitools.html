<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Online Compiler ⚡</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>

  <style>
    body {
      font-family: 'Fira Code', monospace;
      transition: background 0.2s ease, color 0.2s ease;
    }
    textarea {
      resize: none;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.3);
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen p-2 sm:p-4">

  <div class="w-full max-w-7xl mx-auto bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-xl p-4">
    
    <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3 mb-4">
      <div class="flex items-center gap-4">
        <select id="lang" onchange="updateTemplate()" class="bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm font-bold rounded-lg px-3 py-1.5 outline-none text-emerald-600 dark:text-emerald-400 cursor-pointer focus:border-emerald-500 transition-colors">
          <option value="python">Python 3 (Instant Local)</option>
          <option value="javascript">JavaScript (Instant Local)</option>
          <option value="c">C (Cloud)</option>
          <option value="cpp">C++ (Cloud)</option>
          <option value="java">Java (Cloud)</option>
        </select>
        <span id="editorLangLabel" class="text-xs font-bold uppercase tracking-wider text-slate-400">python</span>
      </div>

      <div class="flex items-center gap-4">
        <button onclick="copyCode()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors text-base" title="Copy Code">
          <i class="fa-solid fa-copy"></i>
        </button>
        <button onclick="clearEditor()" class="text-slate-400 hover:text-red-500 transition-colors text-base" title="Clear Code">
          <i class="fa-solid fa-trash-can"></i>
        </button>
        <button onclick="toggleTheme()" class="w-8 h-8 flex items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:scale-105 transition-all" title="Toggle Mode">
          <i id="themeIcon" class="fa-solid fa-sun text-amber-500 text-base"></i>
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      
      <div class="lg:col-span-2 flex flex-col">
        <textarea id="code" class="w-full h-[520px] p-4 bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800/80 rounded-xl outline-none font-mono text-base md:text-lg font-medium leading-relaxed text-slate-900 dark:text-emerald-400 focus:border-emerald-500/50 transition-colors">print("Hello Srinu 🔥")</textarea>
        
        <div class="mt-3">
          <button onclick="runCode()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-xl shadow-md active:scale-[0.99] transition-all flex items-center justify-center gap-2 tracking-wider">
            <i class="fa-solid fa-play"></i> RUN CODE
          </button>
        </div>
      </div>

      <div class="flex flex-col gap-3">
        <div class="flex flex-col h-40">
          <div class="text-[11px] font-bold tracking-wider text-slate-400 dark:text-slate-500 mb-1">STDIN (INPUT)</div>
          <textarea id="input" placeholder="Inputs for Python/Cloud functions go here..." class="w-full flex-1 p-3 bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800 rounded-xl outline-none font-mono text-sm text-slate-800 dark:text-slate-300 focus:border-slate-400 dark:focus:border-slate-700 transition-colors"></textarea>
        </div>

        <div class="flex flex-col flex-1 min-h-[360px]">
          <div class="flex items-center justify-between mb-1">
            <div class="text-[11px] font-bold tracking-wider text-slate-400 dark:text-slate-500">STDOUT (TERMINAL MONITOR)</div>
            <button onclick="clearConsole()" class="text-[10px] text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 underline font-normal">Clear</button>
          </div>
          <pre id="output" class="w-full flex-1 p-4 bg-slate-950 border border-slate-800 rounded-xl overflow-auto font-mono text-base font-bold text-cyan-400 leading-relaxed whitespace-pre-wrap">✨ Terminal ready.</pre>
        </div>
      </div>

    </div>

  </div>

  <script>
    let pyodideInstance = null;

    // Python ఎన్విరాన్‌మెంట్ బ్యాక్‌గ్రౌండ్‌లో లోడ్ అవుతుంది
    async function initPyodide() {
      if (!pyodideInstance) {
        pyodideInstance = await loadPyodide();
      }
    }
    initPyodide();

    const templates = {
      python: `print("Hello Srinu 🔥")\n\n# Local Input Test:\nname = "Srinu"\nprint("Welcome back,", name)`,
      javascript: `console.log("Hello Srinu 🔥");\n\nconst arr = [1, 2, 3, 4];\nconsole.log("Sum:", arr.reduce((a, b) => a + b, 0));`,
      c: `#include <stdio.h>\n\nint main() {\n    printf("Hello Srinu 🔥\\n");\n    return 0;\n}`,
      cpp: `#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello Srinu 🔥" << endl;\n    return 0;\n}`,
      java: `public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello Srinu 🔥");\n    }\n}`
    };

    // DASHBOARD LIVE SYNC
    window.onload = () => { applySavedTheme(); };
    window.addEventListener('storage', (e) => { if (e.key === 'mode') applySavedTheme(); });

    function applySavedTheme() {
      const savedMode = localStorage.getItem('mode');
      const htmlEl = document.documentElement;
      const themeIcon = document.getElementById('themeIcon');
      if (savedMode === 'light') {
        htmlEl.classList.remove('dark');
        themeIcon.className = "fa-solid fa-moon text-indigo-600";
      } else {
        htmlEl.classList.add('dark');
        themeIcon.className = "fa-solid fa-sun text-amber-500";
      }
    }

    function toggleTheme() {
      const htmlEl = document.documentElement;
      const themeIcon = document.getElementById('themeIcon');
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        themeIcon.className = "fa-solid fa-moon text-indigo-600";
        localStorage.setItem('mode', 'light');
      } else {
        htmlEl.classList.add('dark');
        themeIcon.className = "fa-solid fa-sun text-amber-500";
        localStorage.setItem('mode', 'dark');
      }
    }

    function updateTemplate() {
      const lang = document.getElementById("lang").value;
      document.getElementById("code").value = templates[lang];
      document.getElementById("editorLangLabel").innerText = lang;
    }

    function copyCode() {
      const code = document.getElementById("code");
      code.select();
      document.execCommand("copy");
    }

    function clearEditor() {
      if(confirm("Clear current code?")) document.getElementById("code").value = "";
    }

    function clearConsole() {
      const output = document.getElementById('output');
      output.innerText = "✨ Terminal ready.";
      output.style.color = "";
    }

    // MAIN ENGINE EXECUTION
    async function runCode() {
      const code = document.getElementById("code").value;
      const lang = document.getElementById("lang").value;
      const output = document.getElementById("output");

      output.innerText = "⏳ Executing...";
      output.style.color = "#a1a1aa";

      // 1. INSTANT LOCAL JAVASCRIPT EXECUTION
      if (lang === "javascript") {
        try {
          let logs = [];
          const originalLog = console.log;
          console.log = (...args) => { logs.push(args.join(" ")); };
          
          eval(code); 
          
          console.log = originalLog;
          output.innerText = logs.join("\n") || "✅ Executed successfully with no console logs.";
          output.style.color = "#34d399";
        } catch (err) {
          output.innerText = `❌ JavaScript Error:\n\n${err.message}`;
          output.style.color = "#f87171";
        }
        return;
      }

      // 2. INSTANT LOCAL PYTHON EXECUTION (NO API NEEDED)
      if (lang === "python") {
        try {
          if (!pyodideInstance) {
            output.innerText = "⏳ Initializing Core Python Engine Runtime (First time takes 2-3 seconds)...";
            await initPyodide();
          }
          
          // Capturing standard out stream line records
          pyodideInstance.runPython(`
            import sys
            import io
            sys.stdout = io.StringIO()
          `);
          
          await pyodideInstance.runPythonAsync(code);
          
          let stdout = pyodideInstance.runPython("sys.stdout.getvalue()");
          output.innerText = stdout || "✅ Program executed successfully (No printed text).";
          output.style.color = "#34d399";
        } catch (err) {
          output.innerText = `❌ Python Runtime Error:\n\n${err.message}`;
          output.style.color = "#f87171";
        }
        return;
      }

      // 3. CLOUD BACKUP FOR C, C++, JAVA
      const cloudLangMap = { c: "c", cpp: "cpp", java: "java" };
      const cloudExtMap = { c: "c", cpp: "cpp", java: "java" };
      const input = document.getElementById("input").value;

      try {
        const payload = {
          language: cloudLangMap[lang],
          version: "*",
          files: [{ name: `main.${cloudExtMap[lang]}`, content: code }],
          stdin: input
        };

        const res = await fetch("https://emkc.org/api/v2/piston/execute", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.run) {
          if (data.run.stderr) {
            output.innerText = `❌ Compilation/Runtime Error:\n\n${data.run.stderr}`;
            output.style.color = "#f87171";
          } else {
            output.innerText = data.run.output || "✅ Execution finished successfully.";
            output.style.color = "#34d399";
          }
        } else {
          // If fallback API stalls, use alternative backup compiler gateway
          runCodeFallbackGlot(code, lang, input);
        }
      } catch (err) {
        runCodeFallbackGlot(code, lang, input);
      }
    }

    // 4. SECONDARY REINFORCED STABLE BACKUP FOR C/C++/JAVA (Glot API Node Router)
    async function runCodeFallbackGlot(code, lang, input) {
      const output = document.getElementById("output");
      try {
        const langMap = { c: "c", cpp: "cpp", java: "java" };
        const res = await fetch(`https://run.glot.io/languages/${langMap[lang]}/latest`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            files: [{ name: lang === "java" ? "Main.java" : `main.${lang}`, content: code }],
            stdin: input
          })
        });
        const data = await res.json();
        if(data.stdout) {
          output.innerText = data.stdout;
          output.style.color = "#34d399";
        } else if(data.stderr || data.error) {
          output.innerText = data.stderr || data.error;
          output.style.color = "#f87171";
        } else {
          output.innerText = "✅ Done (Process completed).";
          output.style.color = "#34d399";
        }
      } catch(e) {
        output.innerText = "❌ Connection Fault: Both Primary and Secondary Cloud Nodes are busy. Python/JS will work flawlessly offline.";
        output.style.color = "#f87171";
      }
    }
  </script>
</body>
</html>
