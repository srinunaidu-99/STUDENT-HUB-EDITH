<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Srinu Compiler 🔥</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: monospace;
}
textarea {
  resize: none;
}
</style>
</head>

<body class="p-5">

<h1 class="text-2xl font-bold mb-4">⚡ Online Compiler - Srinu Edition</h1>

<!-- Language -->
<select id="lang" class="bg-black p-2 mb-3">
  <option value="python">Python</option>
  <option value="js">JavaScript</option>
  <option value="c">C</option>
  <option value="cpp">C++</option>
  <option value="java">Java</option>
</select>

<!-- Code -->
<textarea id="code" class="w-full h-52 p-3 bg-black border mb-3">
print("Hello Srinu 🔥")
</textarea>

<!-- Input -->
<textarea id="input" placeholder="Custom Input..." class="w-full h-20 p-3 bg-black border mb-3"></textarea>

<!-- Button -->
<button onclick="runCode()" class="bg-green-600 px-5 py-2 rounded">
▶ Run Code
</button>

<!-- Output -->
<pre id="output" class="bg-black mt-4 p-3 h-40 overflow-auto"></pre>

<script>
async function runCode() {
  const code = document.getElementById("code").value;
  const lang = document.getElementById("lang").value;
  const input = document.getElementById("input").value;
  const output = document.getElementById("output");

  output.innerText = "⏳ Running...";

  try {
    const res = await fetch("https://api.codex.jaagrav.in", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        code: code,
        language: lang,
        input: input
      })
    });

    const data = await res.json();

    if (data.error) {
      output.innerText = "❌ Error:\n" + data.error;
    } else {
      output.innerText = data.output || "✅ No Output";
    }

  } catch (err) {
    output.innerText = "⚠ Network Error";
  }
}
</script>

</body>
</html>
