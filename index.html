<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDITH - Intelligence Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #030712 70%);
            overflow: hidden;
        }

        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.2); border-radius: 10px; }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 25px 2px rgba(99, 102, 241, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 0 40px 8px rgba(99, 102, 241, 0.6); }
        }
        .edith-orb { animation: pulseGlow 4s ease-in-out infinite; background: linear-gradient(135deg, #6366f1, #a855f7); }

        .glass-panel { background: rgba(10, 11, 23, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.06); }
        .ai-bubble { background: rgba(23, 24, 51, 0.6); border: 1px solid rgba(99, 102, 241, 0.25); border-radius: 20px 20px 20px 4px; }
        .user-bubble { background: linear-gradient(135deg, #4f46e5, #3730a3); border-radius: 20px 20px 4px 20px; }

        .typing-dot { animation: typingBounce 1.4s infinite ease-in-out both; width: 6px; height: 6px; background-color: #a5b4fc; border-radius: 50%; display: inline-block; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>

<body class="text-gray-100 min-h-screen flex items-center justify-center p-0 sm:p-4">

<div class="w-full max-w-5xl h-screen sm:h-[92vh] flex flex-col glass-panel sm:rounded-3xl shadow-2xl relative overflow-hidden">
    
    <div class="p-4 border-b border-white/5 flex justify-between items-center bg-gray-950/20 px-6">
        <div class="flex items-center gap-3.5">
            <div class="edith-orb w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold tracking-wider text-sm">E</div>
            <div>
                <h1 class="text-lg font-bold tracking-tight text-white">EDITH <span class="text-xs font-semibold text-indigo-400 border border-indigo-500/30 px-1.5 py-0.5 rounded-md ml-1.5 bg-indigo-500/10">V3.2</span></h1>
                <p class="text-[10px] uppercase tracking-widest text-indigo-400 font-bold flex items-center gap-1.5 mt-0.5">
                    <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full inline-block animate-pulse"></span>
                    Operator: <span id="displayUserName">Student</span>
                </p>
            </div>
        </div>
        <div class="hidden sm:flex items-center gap-4 text-right">
            <div class="text-[11px] font-medium text-gray-400">
                <span class="text-gray-500 uppercase block text-[9px] tracking-wider font-bold">Status</span>
                <span class="text-emerald-400 font-mono">CONNECTED</span>
            </div>
        </div>
    </div>

    <div id="chatArea" class="flex-1 overflow-y-auto p-6 space-y-6 chat-container">
        <div id="welcomeScreen" class="flex flex-col justify-center items-center mt-24 text-center px-4">
            <div class="edith-orb w-20 h-20 rounded-3xl flex items-center justify-center text-3xl text-white mb-6">
                <i class="fa-solid fa-brain"></i>
            </div>
            <h2 class="text-2xl sm:text-3xl font-bold mb-2 tracking-tight text-white">How can I assist you today?</h2>
            <p class="text-gray-400 text-sm max-w-sm font-light leading-relaxed">System ready for biometric mapping and neural queries.</p>
        </div>
    </div>

    <div class="p-4 sm:p-6 bg-gray-950/40 border-t border-white/5 backdrop-blur-md">
        <div class="flex gap-3 items-center relative">
            <input type="text" id="msg" placeholder="Ask EDITH anything..." 
                class="w-full bg-gray-900/80 border border-white/10 focus:border-indigo-500/50 rounded-2xl pl-5 pr-16 py-4 outline-none transition-all text-sm text-gray-100 shadow-inner"
                onkeypress="if(event.key==='Enter')sendMsg()" />
            <button onclick="sendMsg()" class="absolute right-2 w-10 h-10 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl flex items-center justify-center transition-all">
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </div>
    </div>
</div>

<script>
// ✅ RENDER BACKEND URL UPDATED
const API_BASE = "https://student-hub-edith-backend.onrender.com";

const chatArea = document.getElementById("chatArea");
const welcomeScreen = document.getElementById("welcomeScreen");

window.onload = () => {
    const token = localStorage.getItem("token");
    const name = localStorage.getItem("userName");
    if (!token) { window.location.href = "login.html"; return; }
    if (name) { document.getElementById("displayUserName").innerText = name; }
};

function cleanAndParseMarkdown(text) {
    return marked.parse(text);
}

function addMessage(text, isUser) {
    if (welcomeScreen) welcomeScreen.style.display = "none";
    const div = document.createElement("div");
    div.className = `flex ${isUser ? "justify-end" : "justify-start"} w-full`;
    div.innerHTML = `
        <div class="p-4 px-5 max-w-[85%] text-sm leading-relaxed ${isUser ? "user-bubble" : "ai-bubble"}">
            ${isUser ? text : cleanAndParseMarkdown(text)}
        </div>
    `;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div.querySelector("div");
}

function showTypingIndicator() {
    const div = document.createElement("div");
    div.id = "edithTypingIndicator";
    div.className = "flex justify-start";
    div.innerHTML = `<div class="p-4 px-5 ai-bubble flex gap-1.5"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
}

async function sendMsg() {
    const input = document.getElementById("msg");
    const message = input.value.trim();
    const token = localStorage.getItem("token");
    if (!message) return;

    addMessage(message, true);
    input.value = "";
    showTypingIndicator();

    try {
        const res = await fetch(`${API_BASE}/api/chat`, {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}` 
            },
            body: JSON.stringify({ message: message })
        });

        document.getElementById("edithTypingIndicator")?.remove();

        if (!res.ok) {
            addMessage("❌ Connection Error. Please try again.", false);
            return;
        }

        const data = await res.json();
        addMessage(data.reply, false);
    } catch (err) {
        document.getElementById("edithTypingIndicator")?.remove();
        addMessage("❌ Server is offline. Please wait 60 seconds for Render to wake up.", false);
    }
}
</script>

</body>
</html>
