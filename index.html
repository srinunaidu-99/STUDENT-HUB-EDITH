<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Assistant</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom Subtle Scrollbar */
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .dark .chat-scroll::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }
        html:not(.dark) .chat-scroll::-webkit-scrollbar-thumb {
            background: #e4e4e7;
            border-radius: 4px;
        }

        /* Code Block Wrapper Style */
        .code-block-container {
            position: relative;
            margin: 12px 0;
        }
        pre {
            background: #18181b !important;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
        }
        html:not(.dark) pre {
            background: #f4f4f5 !important;
        }
        code {
            color: #f4f4f5;
            font-size: 0.875rem;
        }
        html:not(.dark) code {
            color: #18181b;
        }

        /* Typing Dots Animation */
        .dot { animation: wave 1.3s infinite ease-in-out; width: 6px; height: 6px; background-color: #a1a1aa; border-radius: 50%; display: inline-block; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes wave { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
    </style>
</head>

<body class="w-screen h-screen flex dark:bg-[#09090b] bg-slate-50 transition-colors duration-200">

    <div id="sidebarOverlay" onclick="toggleSidebar(false)" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-40 lg:hidden"></div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 -translate-x-full lg:translate-x-0 lg:relative z-50 flex flex-col h-full dark:bg-[#121214] bg-white border-r dark:border-zinc-800 border-slate-200 transition-transform duration-300 ease-in-out">
        <div class="p-4">
            <button onclick="createNewChat()" class="w-full h-10 flex items-center justify-center gap-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 active:scale-[0.98] rounded-lg shadow transition-all">
                <i class="fa-solid fa-plus text-xs"></i> New Chat
            </button>
        </div>

        <div class="px-4 py-2 border-b dark:border-zinc-800 border-slate-100 flex justify-between items-center text-xs font-medium dark:text-zinc-500 text-slate-400">
            <span>Recent Chats</span>
            <span id="chatCounter" class="font-mono">0</span>
        </div>

        <div id="chatHistoryList" class="flex-1 overflow-y-auto p-2 space-y-1 chat-scroll">
            <div class="text-center py-8 text-xs text-zinc-400">Loading history...</div>
        </div>

        <div class="p-4 border-t dark:border-zinc-800 border-slate-200 flex items-center justify-between dark:bg-zinc-900/40 bg-slate-50">
            <div class="flex items-center gap-3 overflow-hidden">
                <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-semibold" id="userBadge">OP</div>
                <div class="overflow-hidden">
                    <span class="block text-sm font-medium dark:text-zinc-200 text-slate-700 truncate" id="userNameFooter">Operator</span>
                </div>
            </div>
            <button onclick="logoutSession()" class="text-zinc-400 hover:text-red-500 transition-colors text-sm p-1.5" title="Logout">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col h-full overflow-hidden w-full">
        
        <header class="h-14 border-b dark:border-zinc-800 border-slate-200 flex justify-between items-center px-4 dark:bg-[#121214] bg-white shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar(true)" class="lg:hidden w-9 h-9 border dark:border-zinc-800 border-slate-200 rounded-lg flex items-center justify-center dark:text-zinc-300 text-slate-600 bg-transparent shadow-sm">
                    <i class="fa-solid fa-bars text-sm"></i>
                </button>
                <h1 class="text-sm font-semibold dark:text-white text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-comment-dots text-blue-500"></i> AI Assistant
                </h1>
            </div>
            <div class="text-xs font-medium text-emerald-500 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Connected
            </div>
        </header>

        <main id="chatWindow" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 chat-scroll dark:bg-[#09090b] bg-slate-50/50"></main>

        <footer class="p-3 md:p-4 dark:bg-[#121214] bg-white border-t dark:border-zinc-800 border-slate-200 shrink-0">
            <div class="max-w-3xl mx-auto w-full">
                <div class="flex items-center gap-2 mb-2 px-1">
                    <label class="text-xs dark:text-zinc-400 text-slate-500 hover:dark:text-zinc-200 hover:text-slate-700 cursor-pointer flex items-center gap-1.5 font-medium transition-colors">
                        <i class="fa-solid fa-paperclip text-xs"></i> Attach Files
                        <input type="file" id="fileAttachment" multiple class="hidden" onchange="handleFileSelect()" />
                    </label>
                    <span id="fileBadgeLabel" class="text-xs text-blue-500 font-medium"></span>
                </div>

                <div class="flex items-center gap-2 relative bg-slate-100 dark:bg-zinc-900 border dark:border-zinc-800 border-slate-200 rounded-xl px-3 py-1.5 shadow-sm">
                    <input type="text" id="userInputText" placeholder="Ask a question..." 
                        class="w-full bg-transparent outline-none py-1.5 pr-20 text-sm dark:text-zinc-100 text-slate-900 placeholder-slate-400 dark:placeholder-zinc-600 font-normal"
                        onkeypress="if(event.key==='Enter')sendMessage()" />

                    <div class="absolute right-2 flex items-center gap-1">
                        <button onclick="toggleSpeech()" id="speechBtn" title="Voice Input"
                            class="w-8 h-8 text-slate-400 dark:text-zinc-500 hover:text-slate-600 dark:hover:text-zinc-300 rounded-lg flex items-center justify-center transition-all">
                            <i class="fa-solid fa-microphone text-sm"></i>
                        </button>
                        <button onclick="sendMessage()" class="w-8 h-8 bg-blue-600 hover:bg-blue-700 text-white rounded-lg flex items-center justify-center transition-all shadow-sm">
                            <i class="fa-solid fa-paper-plane text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>
        </footer>

    </div>
</div>

<script>
const API_URL = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
    ? "http://localhost:5000"
    : "https://student-hub-edith-backend.onrender.com";

const chatWindow = document.getElementById("chatWindow");
const chatHistoryList = document.getElementById("chatHistoryList");

let currentSessionId = null; 
let cachedSessionsList = []; 
let voiceRecognitionInstance = null;
let isVoiceRecording = false;

// Dashboard Integrated Synchronous Initialization 
function syncDashboardTheme() {
    const savedTheme = localStorage.getItem('edith-theme') || 'dark';
    document.documentElement.classList.toggle('dark', savedTheme === 'dark');
}
syncDashboardTheme();

// Voice System Initialization
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechLib = window.SpeechRecognition || window.webkitSpeechRecognition;
    voiceRecognitionInstance = new SpeechLib();
    voiceRecognitionInstance.continuous = false;
    voiceRecognitionInstance.lang = 'en-US';

    voiceRecognitionInstance.onstart = () => {
        isVoiceRecording = true;
        document.getElementById("speechBtn").classList.add("text-red-500");
    };
    voiceRecognitionInstance.onend = () => {
        isVoiceRecording = false;
        document.getElementById("speechBtn").classList.remove("text-red-500");
    };
    voiceRecognitionInstance.onresult = (e) => {
        document.getElementById("userInputText").value = e.results[0][0].transcript;
    };
}

function toggleSpeech() {
    if (!voiceRecognitionInstance) return alert("Speech recognition not supported on this device browser profile.");
    if (isVoiceRecording) voiceRecognitionInstance.stop(); else voiceRecognitionInstance.start();
}

window.onload = () => {
    const userToken = localStorage.getItem("token");
    const accountName = localStorage.getItem("userName") || "Operator User";

    if (!userToken) {
        window.location.href = "login.html";
        return;
    }

    document.getElementById("userNameFooter").textContent = accountName;
    document.getElementById("userBadge").textContent = accountName.substring(0, 2).toUpperCase();

    marked.setOptions({ breaks: true, gfm: true });
    loadChatSessions();
};

async function apiCall(endpoint, config = {}) {
    const userToken = localStorage.getItem("token");
    const headers = { ...(config.headers || {}), "Authorization": `Bearer ${userToken}` };
    
    if (!(config.body instanceof FormData) && !headers["Content-Type"]) {
        headers["Content-Type"] = "application/json";
    }

    const response = await fetch(`${API_URL}${endpoint}`, { ...config, headers });
    if (response.status === 401) {
        logoutSession();
        return null;
    }
    return response;
}

function logoutSession() {
    localStorage.clear();
    window.location.href = "login.html";
}

async function loadChatSessions() {
    try {
        const response = await apiCall("/api/chat/sessions");
        if (!response) return;
        cachedSessionsList = await response.json();
        renderSidebarList(cachedSessionsList);
    } catch (err) {
        chatHistoryList.innerHTML = `<div class="text-center py-4 text-xs text-red-500">Error loading recent tabs</div>`;
    }
}

function renderSidebarList(sessions) {
    chatHistoryList.innerHTML = "";
    document.getElementById("chatCounter").textContent = sessions.length;

    if (sessions.length === 0) {
        chatHistoryList.innerHTML = `<div class="text-center py-8 text-xs text-zinc-400">No active chats</div>`;
        return;
    }

    sessions.forEach(session => {
        const isActiveSession = session._id === currentSessionId;
        const itemContainer = document.createElement("div");
        itemContainer.className = `group w-full flex items-center justify-between px-3 py-2.5 my-0.5 text-sm rounded-lg cursor-pointer transition-all ${
            isActiveSession 
            ? 'bg-blue-50 dark:bg-blue-950/30 text-blue-600 dark:text-blue-400 font-medium' 
            : 'text-slate-600 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-zinc-900'
        }`;
        
        itemContainer.onclick = () => selectSession(session._id);
        itemContainer.innerHTML = `
            <span class="truncate flex items-center gap-2">
                <i class="fa-regular fa-message text-xs opacity-60"></i>
                <span class="truncate">${session.title || 'Untitled Conversation'}</span>
            </span>
            <button onclick="deleteSession(event, '${session._id}')" class="p-1 rounded text-zinc-400 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100">
                <i class="fa-regular fa-trash-can text-xs"></i>
            </button>
        `;
        chatHistoryList.appendChild(itemContainer);
    });
}

async function createNewChat() {
    try {
        const response = await apiCall("/api/chat/sessions", {
            method: "POST",
            body: JSON.stringify({ title: `Chat ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}` })
        });
        if (!response) return;
        const sessionData = await response.json();
        currentSessionId = sessionData._id;
        await loadChatSessions();
        loadActiveMessages();
    } catch (err) { console.error(err); }
}

function selectSession(id) {
    if (currentSessionId === id) return;
    currentSessionId = id;
    renderSidebarList(cachedSessionsList);
    loadActiveMessages();
    toggleSidebar(false);
}

async function deleteSession(event, id) {
    event.stopPropagation();
    if (!confirm("Are you sure you want to delete this chat history?")) return;
    try {
        const response = await apiCall(`/api/chat/sessions/${id}`, { method: "DELETE" });
        if (!response) return;
        if (currentSessionId === id) { currentSessionId = null; chatWindow.innerHTML = ""; }
        loadChatSessions();
    } catch (err) { console.error(err); }
}

async function loadActiveMessages() {
    if (!currentSessionId) return;
    chatWindow.innerHTML = `<div class="flex items-center justify-center h-full text-sm text-zinc-400">Loading messages...</div>`;

    try {
        const response = await apiCall(`/api/chat/sessions/${currentSessionId}/messages`);
        if (!response) return;
        const messages = await response.json();
        chatWindow.innerHTML = "";
        messages.forEach(msg => insertMessageBubble(msg.role, msg.content));
        scrollToBottom();
    } catch (err) { chatWindow.innerHTML = `<div class="flex items-center justify-center h-full text-sm text-red-500">Failed to sync message logs.</div>`; }
}

function insertMessageBubble(role, content) {
    const outerFlexRow = document.createElement("div");
    outerFlexRow.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} w-full`;

    const bubbleBox = document.createElement("div");
    bubbleBox.className = `max-w-[85%] md:max-w-2xl rounded-2xl px-4 py-3 text-sm md:text-base shadow-sm leading-relaxed ${
        role === 'user' 
        ? 'bg-blue-600 text-white font-normal' 
        : 'dark:bg-[#18181b] bg-white border dark:border-zinc-800 border-slate-200 dark:text-zinc-200 text-slate-800'
    }`;

    if (role === 'user') {
        bubbleBox.textContent = content;
    } else {
        bubbleBox.innerHTML = marked.parse(content);
        attachCodeBlockCopyLogic(bubbleBox);
    }

    outerFlexRow.appendChild(bubbleBox);
    chatWindow.appendChild(outerFlexRow);
    scrollToBottom();
}

function attachCodeBlockCopyLogic(container) {
    container.querySelectorAll("pre").forEach(pre => {
        const wrapper = document.createElement("div");
        wrapper.className = "code-block-container";
        const btn = document.createElement("button");
        btn.className = "absolute top-2 right-2 bg-zinc-800 border border-zinc-700 text-zinc-400 text-xs px-2.5 py-1 rounded hover:text-white transition-colors";
        btn.innerHTML = `<i class="fa-regular fa-copy mr-1"></i> Copy`;
        
        btn.onclick = () => {
            navigator.clipboard.writeText(pre.querySelector("code")?.innerText || pre.innerText);
            btn.innerHTML = `<i class="fa-solid fa-check text-green-500 mr-1"></i> Copied`;
            setTimeout(() => { btn.innerHTML = `<i class="fa-regular fa-copy mr-1"></i> Copy`; }, 2000);
        };
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);
        wrapper.appendChild(btn);
    });
}

async function sendMessage() {
    const input = document.getElementById("userInputText");
    const textPrompt = input.value.trim();
    const fileSelector = document.getElementById("fileAttachment");

    if (!textPrompt && fileSelector.files.length === 0) return;
    if (!currentSessionId) await createNewChatSession();

    input.value = "";
    if (textPrompt) insertMessageBubble('user', textPrompt);
    displayTypingIndicator();

    try {
        let response;
        if (fileSelector.files.length > 0) {
            const formData = new FormData();
            formData.append("prompt", textPrompt || "Analyze selected content attachments.");
            formData.append("compress", false);
            for (let i = 0; i < fileSelector.files.length; i++) formData.append("files", fileSelector.files[i]);
            response = await apiCall(`/api/chat/sessions/${currentSessionId}/upload`, { method: "POST", body: formData });
        } else {
            response = await apiCall(`/api/chat/sessions/${currentSessionId}/messages`, {
                method: "POST",
                body: JSON.stringify({ content: textPrompt, compress: false })
            });
        }

        hideTypingIndicator();
        clearFileSelector();
        if (!response) return;
        const data = await response.json();
        insertMessageBubble('assistant', data.reply);
    } catch (err) {
        hideTypingIndicator();
        insertMessageBubble('assistant', "An error occurred while connecting to the core chat servers.");
    }
}

function handleFileSelect() {
    const totalFiles = document.getElementById("fileAttachment").files.length;
    document.getElementById("fileBadgeLabel").textContent = totalFiles > 0 ? `(${totalFiles} files selected)` : "";
}

function clearFileSelector() {
    document.getElementById("fileAttachment").value = "";
    document.getElementById("fileBadgeLabel").textContent = "";
}

function displayTypingIndicator() {
    hideTypingIndicator();
    const ind = document.createElement("div");
    ind.id = "typingIndicatorBox";
    ind.className = "flex justify-start w-full";
    ind.innerHTML = `
        <div class="dark:bg-[#18181b] bg-white border dark:border-zinc-800 border-slate-200 rounded-2xl px-4 py-3.5 flex items-center gap-1">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>`;
    chatWindow.appendChild(ind);
    scrollToBottom();
}

function hideTypingIndicator() {
    const el = document.getElementById("typingIndicatorBox");
    if (el) el.remove();
}

function scrollToBottom() { chatWindow.scrollTop = chatWindow.scrollHeight; }

function toggleSidebar(open) {
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebarOverlay");
    if (open) {
        sidebar.classList.remove("-translate-x-full");
        overlay.classList.remove("hidden");
    } else {
        sidebar.classList.add("-translate-x-full");
        overlay.classList.add("hidden");
    }
}
</script>
</body>

</html>
