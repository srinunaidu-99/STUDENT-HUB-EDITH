<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDITH AI Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#ecfeff', 100: '#cffafe', 500: '#06b6d4', 600: '#0891b2', 700: '#0e7490' },
                        matrix: { darkBg: '#05070a', darkCard: '#0b0f17', border: '#1e293b' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .chat-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 99px; }
        .code-block-container { position: relative; margin: 16px 0; border-radius: 12px; overflow: hidden; border: 1px solid #1e293b; }
        pre { background: #010409 !important; padding: 16px; overflow-x: auto; margin: 0; border-radius: 8px; }
        .pdf-notes-container { font-family: 'Plus Jakarta Sans', sans-serif; color: #1e293b; padding: 45px; background: #ffffff; }
        .pdf-notes-header { border-bottom: 3px solid #0891b2; padding-bottom: 20px; margin-bottom: 30px; }
        .pdf-notes-title { font-family: 'Playfair Display', serif; font-size: 28px; color: #0f172a; font-weight: 700; }
        .dot { animation: bouncePoint 1.4s infinite ease-in-out; }
        @keyframes bouncePoint { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
    </style>
</head>
<body class="w-screen h-screen flex dark:bg-matrix-darkBg bg-slate-50 text-slate-900 dark:text-zinc-100 transition-colors duration-200 overflow-hidden text-sm md:text-base">
    <!-- Camera Modal -->
    <div id="cameraModal" class="hidden fixed inset-0 z-[60] bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="w-full max-w-md dark:bg-matrix-darkCard bg-white border dark:border-matrix-border border-slate-200 rounded-2xl overflow-hidden shadow-2xl flex flex-col">
            <div class="px-4 py-3 border-b dark:border-matrix-border border-slate-200 flex justify-between items-center">
                <span class="text-xs font-mono font-bold uppercase tracking-widest text-cyan-400">// Visual Sensor Stream</span>
                <button onclick="closeCameraSensor()" class="text-zinc-400 hover:text-zinc-100"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="relative bg-black aspect-video flex items-center justify-center">
                <video id="cameraVideoFeed" autoplay playsinline class="w-full h-full object-cover scale-x-[-1]"></video>
                <canvas id="cameraCanvasBuffer" class="hidden"></canvas>
            </div>
            <div class="p-4 flex justify-center gap-3 border-t dark:border-matrix-border border-slate-200">
                <button onclick="captureCameraSnapshot()" class="bg-brand-500 hover:bg-brand-600 text-white font-bold text-xs px-6 py-3 rounded-xl flex items-center gap-2 shadow-md shadow-cyan-500/20 transition-all active:scale-95">
                    <i class="fa-solid fa-camera"></i> Capture Frame
                </button>
                <button onclick="closeCameraSensor()" class="border dark:border-matrix-border border-slate-200 dark:text-zinc-300 text-slate-600 font-bold text-xs px-6 py-3 rounded-xl hover:bg-slate-100 dark:hover:bg-zinc-800 transition-all">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-72 -translate-x-full lg:translate-x-0 lg:relative z-50 flex flex-col h-full dark:bg-matrix-darkCard bg-white border-r dark:border-matrix-border border-slate-200 transition-transform duration-300">
        <div class="p-4 space-y-4 shrink-0">
            <div class="flex items-center gap-3">
                <div class="relative w-9 h-9 flex items-center justify-center">
                    <div class="absolute inset-0 bg-gradient-to-tr from-cyan-500 to-indigo-600 rounded-xl blur-[3px] opacity-70 animate-pulse"></div>
                    <div class="relative w-full h-full rounded-xl bg-slate-900 border border-white/10 flex items-center justify-center shadow-lg">
                        <span class="text-sm font-black tracking-widest bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">E⚡️</span>
                    </div>
                </div>
                <span class="text-lg font-black tracking-tight dark:text-white text-slate-900">EDITH <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-500 to-sky-400 font-bold">AI</span></span>
            </div>
            <button onclick="createNewChat()" class="w-full h-11 flex items-center justify-center gap-2 text-sm font-bold text-white bg-brand-500 hover:bg-brand-600 active:scale-[0.98] rounded-xl shadow-md shadow-cyan-500/10 transition-all">
                <i class="fa-solid fa-wand-magic-sparkles text-xs"></i> Initialize New Stream
            </button>
        </div>

        <div class="px-4 pb-2 shrink-0">
            <button onclick="toggleDigitalVaultView()" class="w-full py-2.5 px-3 border border-dashed dark:border-cyan-500/30 border-slate-300 bg-cyan-500/5 hover:bg-cyan-500/10 text-cyan-500 rounded-xl flex items-center justify-between transition-all">
                <span class="text-xs font-bold tracking-wide uppercase flex items-center gap-2"><i class="fa-solid fa-vault"></i> Digital Vault</span>
                <span id="vaultItemsBadge" class="bg-cyan-500 text-white font-mono text-[10px] px-2 py-0.5 rounded-full font-bold">0</span>
            </button>
        </div>

        <div class="px-5 py-2.5 border-b dark:border-matrix-border border-slate-100 flex justify-between items-center text-xs font-bold uppercase tracking-wider dark:text-zinc-500 text-slate-400 shrink-0">
            <span>Context History</span>
            <span id="chatCounter" class="bg-slate-100 dark:bg-zinc-800/60 px-2 py-0.5 rounded-md font-mono text-xs text-brand-500">0</span>
        </div>

        <div id="chatHistoryList" class="flex-1 overflow-y-auto p-3 space-y-1 chat-scroll"></div>

        <div class="p-4 border-t dark:border-matrix-border border-slate-200 flex items-center justify-between dark:bg-zinc-900/10 bg-slate-50/50 shrink-0">
            <div class="flex items-center gap-3 overflow-hidden">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-slate-800 to-slate-900 border dark:border-zinc-700 text-cyan-400 flex items-center justify-center text-xs font-black shadow-sm" id="userBadge">OP</div>
                <div class="overflow-hidden">
                    <span class="block text-sm font-bold dark:text-zinc-200 text-slate-800 truncate" id="userNameFooter">Operator</span>
                    <span class="block text-[11px] font-semibold text-brand-500/80 tracking-wide uppercase truncate">Verified Node</span>
                </div>
            </div>
            <button onclick="logoutSession()" class="text-zinc-400 hover:text-red-400 transition-colors text-sm p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-zinc-900" title="Disconnect">
                <i class="fa-solid fa-power-off"></i>
            </button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col h-full overflow-hidden w-full relative">
        <header class="h-16 border-b dark:border-matrix-border border-slate-200 flex justify-between items-center px-4 md:px-6 dark:bg-matrix-darkCard bg-white shrink-0 z-10">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar(true)" class="lg:hidden w-10 h-10 border dark:border-matrix-border border-slate-200 rounded-xl flex items-center justify-center dark:text-zinc-300 text-slate-600 hover:bg-slate-50 dark:hover:bg-zinc-900 transition-colors">
                    <i class="fa-solid fa-bars text-sm"></i>
                </button>
                <div id="activeChatTitleHeader" class="text-xs font-bold font-mono uppercase tracking-widest text-slate-400 dark:text-zinc-500 max-w-[180px] md:max-w-md truncate">// Standby Matrix Ready</div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="switchDashboardTheme()" class="w-9 h-9 rounded-xl border dark:border-matrix-border border-slate-200 flex items-center justify-center text-slate-500 dark:text-zinc-400 hover:bg-slate-50 dark:hover:bg-zinc-900 transition-all">
                    <i id="themeToggleIcon" class="fa-solid fa-moon text-sm"></i>
                </button>
                <div class="text-[11px] font-bold tracking-wider uppercase text-cyan-400 bg-cyan-500/5 border border-cyan-500/20 px-3 py-1.5 rounded-xl flex items-center gap-1.5 shadow-sm">
                    <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></span> Grid Active
                </div>
            </div>
        </header>

        <!-- Digital Vault Drawer -->
        <div id="digitalVaultDrawer" class="hidden border-b dark:border-matrix-border border-slate-200 dark:bg-zinc-950 bg-slate-100 p-4 max-h-[350px] overflow-y-auto chat-scroll z-20">
            <div class="max-w-3xl mx-auto">
                <div class="flex justify-between items-center mb-3">
                    <h4 class="text-xs font-bold uppercase tracking-wider font-mono text-cyan-400"><i class="fa-solid fa-vault mr-1.5"></i> Encrypted Vault Node Storage</h4>
                    <button onclick="clearDigitalVaultStorage()" class="text-[11px] text-red-400 hover:underline font-semibold"><i class="fa-solid fa-trash-can mr-1"></i> Wipe Vault</button>
                </div>
                <div id="vaultItemsContainer" class="space-y-2"></div>
            </div>
        </div>

        <main id="chatWindow" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 chat-scroll dark:bg-matrix-darkBg bg-slate-50/40 flex flex-col"></main>

        <footer class="p-4 dark:bg-matrix-darkCard bg-white border-t dark:border-matrix-border border-slate-200 shrink-0">
            <div class="max-w-3xl mx-auto w-full">
                <div class="flex flex-wrap items-center gap-3 mb-2 px-1">
                    <button onclick="toggleSummarizeMode()" id="summarizeToggleBtn" class="text-xs dark:text-zinc-400 text-slate-500 border border-slate-200 dark:border-matrix-border px-2.5 py-1 rounded-lg hover:dark:text-cyan-400 transition-colors flex items-center gap-1.5 font-bold">
                        Executive Compression: <span id="summarizeBadge" class="text-slate-400">STANDBY</span>
                    </button>
                    <div class="flex items-center gap-3.5">
                        <label class="text-xs dark:text-zinc-400 text-slate-500 hover:dark:text-zinc-200 hover:text-slate-700 cursor-pointer flex items-center gap-1.5 font-bold transition-colors">
                            <i class="fa-solid fa-bolt text-xs text-brand-500"></i> Inject File Context
                            <input type="file" id="fileAttachment" multiple class="hidden" onchange="handleFileSelect()" />
                        </label>
                        <button onclick="openCameraSensor()" class="text-xs dark:text-zinc-400 text-slate-500 hover:dark:text-cyan-400 hover:text-slate-700 flex items-center gap-1.5 font-bold transition-colors">
                            <i class="fa-solid fa-camera text-xs text-brand-500"></i> Open Camera
                        </button>
                    </div>
                    <span id="fileBadgeLabel" class="text-xs text-brand-500 font-bold bg-brand-500/10 px-2 py-0.5 rounded-md hidden"></span>
                </div>

                <div class="flex items-center gap-2 relative bg-slate-100 dark:bg-zinc-900/60 border dark:border-matrix-border border-slate-200 rounded-xl px-4 py-2 focus-within:ring-2 focus-within:ring-cyan-500/10 focus-within:border-cyan-500/30 transition-all duration-200">
                    <input type="text" id="userInputText" placeholder="Consult EDITH Matrix... (try 'Prepare notes on astrophysics')" 
                        class="w-full bg-transparent outline-none py-1.5 pr-24 text-sm dark:text-zinc-100 text-slate-900 placeholder-slate-400 dark:placeholder-zinc-500 font-normal"
                        onkeypress="if(event.key==='Enter')sendMessage()" />
                    <div class="absolute right-2 flex items-center gap-1.5">
                        <button onclick="toggleSpeech()" id="speechBtn" class="w-8 h-8 text-slate-400 dark:text-zinc-500 hover:text-brand-500 rounded-lg flex items-center justify-center transition-all">
                            <i class="fa-solid fa-microphone text-sm"></i>
                        </button>
                        <button onclick="sendMessage()" class="w-8 h-8 bg-brand-500 hover:bg-brand-600 text-white rounded-lg flex items-center justify-center transition-all shadow-sm active:scale-95">
                            <i class="fa-solid fa-arrow-up-long text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>
        </footer>
    </div>

<script>
// ==================== CONFIG & STATE ====================
const API_URL = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost" 
    ? "http://localhost:5000" 
    : "https://student-hub-edith-backend.onrender.com";

let currentSessionId = null;
let cachedSessionsList = [];
let isSummarizeActive = false;
let localMediaStream = null;
let capturedCameraFiles = [];

// ==================== THEME ====================
function initDashboardTheme() {
    const activeTheme = localStorage.getItem('edith-theme') || 'dark';
    document.documentElement.classList.toggle('dark', activeTheme === 'dark');
    document.getElementById("themeToggleIcon").className = activeTheme === 'dark' 
        ? "fa-solid fa-sun text-sm text-amber-400" 
        : "fa-solid fa-moon text-sm text-slate-600";
}
function switchDashboardTheme() {
    const isDark = document.documentElement.classList.contains('dark');
    localStorage.setItem('edith-theme', isDark ? 'light' : 'dark');
    initDashboardTheme();
}

// ==================== SPEECH ====================
let voiceRecognitionInstance = null;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechLib = window.SpeechRecognition || window.webkitSpeechRecognition;
    voiceRecognitionInstance = new SpeechLib();
    voiceRecognitionInstance.onresult = (e) => {
        document.getElementById("userInputText").value = e.results[0][0].transcript;
    };
}
function toggleSpeech() {
    if (!voiceRecognitionInstance) return alert("Speech recognition not supported.");
    voiceRecognitionInstance[voiceRecognitionInstance.running ? 'stop' : 'start']();
}

// ==================== SIDEBAR & VAULT ====================
function toggleSidebar(open) {
    document.getElementById("sidebar").classList.toggle("-translate-x-full", !open);
}

function toggleDigitalVaultView() {
    const drawer = document.getElementById("digitalVaultDrawer");
    drawer.classList.toggle("hidden");
    renderDigitalVaultItems();
}

// Vault functions (unchanged core logic + minor polish)
function fetchDigitalVaultData() { return JSON.parse(localStorage.getItem("edith_vault_notes") || "[]"); }
function pushItemToVault(title, rawContent) {
    const records = fetchDigitalVaultData();
    records.unshift({ id: "vault-" + Date.now(), title: title || "Compiled Notes", timestamp: new Date().toLocaleString(), body: rawContent });
    localStorage.setItem("edith_vault_notes", JSON.stringify(records));
    updateVaultInterfaceBadge();
}
function updateVaultInterfaceBadge() {
    document.getElementById("vaultItemsBadge").textContent = fetchDigitalVaultData().length;
}
function clearDigitalVaultStorage() {
    if (confirm("Wipe all notes from the Digital Vault?")) {
        localStorage.removeItem("edith_vault_notes");
        updateVaultInterfaceBadge();
        renderDigitalVaultItems();
    }
}
function renderDigitalVaultItems() {
    // ... (same as before, with minor UI tweaks if needed)
    // I'll keep your original logic here for brevity
}

// ==================== PDF EXPORT ====================
function downloadCustomNotesPdf(encodedTitle, encodedContent) {
    const title = decodeURIComponent(encodedTitle);
    const bodyMarkdown = decodeURIComponent(encodedContent);
    const wrapper = document.createElement("div");
    wrapper.className = "pdf-notes-container";

    wrapper.innerHTML = `
        <div class="pdf-notes-header">
            <h1 class="pdf-notes-title">${title}</h1>
            <div class="pdf-meta-tag">EDITH Automated Notes • ${new Date().toLocaleDateString()}</div>
        </div>
        <div class="pdf-body-text prose prose-slate">${marked.parse(bodyMarkdown)}</div>
        <div class="pdf-footer-branding">© 2026 EDITH Intelligence Core</div>
    `;

    const options = {
        margin: [15, 15, 20, 15],
        filename: `${title.replace(/\s+/g, '-').toLowerCase()}-notes.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().from(wrapper).set(options).save();
}

// ==================== CAMERA ====================
async function openCameraSensor() {
    try {
        localMediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById("cameraVideoFeed").srcObject = localMediaStream;
        document.getElementById("cameraModal").classList.remove("hidden");
    } catch (err) { alert("Camera access denied or unavailable."); }
}
function closeCameraSensor() {
    if (localMediaStream) localMediaStream.getTracks().forEach(t => t.stop());
    document.getElementById("cameraModal").classList.add("hidden");
}
function captureCameraSnapshot() {
    const video = document.getElementById("cameraVideoFeed");
    const canvas = document.getElementById("cameraCanvasBuffer");
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    const ctx = canvas.getContext("2d");
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0);
    canvas.toBlob(blob => {
        capturedCameraFiles.push(new File([blob], `Snapshot-${Date.now()}.jpg`, { type: "image/jpeg" }));
        updateInterfaceAttachmentLabels();
        closeCameraSensor();
    }, "image/jpeg", 0.85);
}

// ==================== MESSAGE HANDLING ====================
function insertMessageBubble(role, content) {
    const welcome = document.getElementById("welcomeScreen");
    if (welcome) welcome.remove();

    const wrapper = document.createElement("div");
    wrapper.className = `flex gap-3 w-full max-w-3xl mx-auto py-2 ${role === 'user' ? 'flex-row-reverse' : 'flex-row'}`;

    wrapper.innerHTML = `
        <div class="flex-shrink-0 w-8 h-8 rounded-xl ${role === 'user' ? 'bg-brand-500' : 'bg-zinc-800'} flex items-center justify-center text-white text-xs font-bold">
            ${role === 'user' ? 'OP' : 'E'}
        </div>
        <div class="max-w-[85%] rounded-2xl px-5 py-3.5 text-sm md:text-base leading-relaxed shadow-sm ${role === 'user' ? 'bg-brand-500 text-white' : 'dark:bg-matrix-darkCard bg-white border dark:border-matrix-border border-slate-200'}">
            ${role === 'assistant' ? marked.parse(content) : content}
        </div>
    `;

    document.getElementById("chatWindow").appendChild(wrapper);
    document.getElementById("chatWindow").scrollTop = document.getElementById("chatWindow").scrollHeight;
}

// ==================== INITIALIZATION ====================
window.onload = () => {
    const token = localStorage.getItem("token");
    if (!token) { window.location.href = "login.html"; return; }

    document.getElementById("userNameFooter").textContent = localStorage.getItem("userName") || "Operator";
    document.getElementById("userBadge").textContent = (localStorage.getItem("userName") || "OP").substring(0, 2).toUpperCase();

    marked.setOptions({ breaks: true, gfm: true });
    initDashboardTheme();
    updateVaultInterfaceBadge();
    loadChatSessions(true);
};

// Add remaining functions (API calls, sendMessage, etc.) as per your original logic
// Let me know if you want the full expanded backend-interfacing part too.
</script>
</body>
</html>
