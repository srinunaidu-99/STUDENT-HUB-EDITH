<!DOCTYPE html>
<html lang="en" class="dark">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EDITH - Intelligence Hub</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>

<script>
tailwind.config = { darkMode: 'class' }
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap');

html,body{
font-family:'Geist',sans-serif;
height:100%;
overflow:hidden;
}

/* 🌌 Animated Gradient Background */
body{
background: radial-gradient(circle at 20% 20%, #0f172a, #020617);
}

/* ✨ Glass UI */
.glass{
background: rgba(255,255,255,0.04);
backdrop-filter: blur(20px);
border:1px solid rgba(255,255,255,0.06);
}

/* 🧠 Glow Effect */
.glow{
box-shadow: 0 0 20px rgba(16,185,129,0.15);
}

/* 💬 Messages */
.ai-bubble{
background: rgba(24,24,27,0.7);
backdrop-filter: blur(10px);
border:1px solid rgba(255,255,255,0.05);
}

.user-bubble{
background: rgba(39,39,42,0.9);
border:1px solid rgba(255,255,255,0.08);
}

/* 🚀 Hover Lift */
.ai-bubble:hover,.user-bubble:hover{
transform: translateY(-2px);
transition:0.2s;
}

/* 🎤 Mic Pulse */
@keyframes pulse{
0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}
70%{box-shadow:0 0 0 10px rgba(239,68,68,0)}
}
.mic-active{
animation:pulse 1.2s infinite;
background:#ef4444 !important;
color:#fff !important;
}

/* 🌀 Smooth Fade */
.fade{
animation:fade .3s ease;
}
@keyframes fade{
from{opacity:0;transform:translateY(5px)}
to{opacity:1}
}

/* 📜 Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#10b98133;border-radius:10px}

</style>
</head>

<body class="text-zinc-300 flex items-center justify-center p-2">

<div class="w-full max-w-[1400px] h-[95vh] flex rounded-xl overflow-hidden glass glow">

<!-- SIDEBAR -->
<aside class="w-64 glass border-r border-zinc-800 hidden lg:flex flex-col">

<div class="p-4">
<button onclick="createNewChatSession()" class="w-full py-2 text-xs bg-emerald-500/10 hover:bg-emerald-500/20 rounded">
➕ New Chat
</button>
</div>

<div id="historyLogContainer" class="flex-1 overflow-y-auto px-2"></div>

</aside>

<!-- MAIN -->
<div class="flex-1 flex flex-col">

<!-- HEADER -->
<div class="flex items-center justify-between p-4 border-b border-zinc-800 glass">

<div class="flex items-center gap-3">

<!-- ⚠️ LOGO NOT CHANGED -->
<div class="w-7 h-7">
<svg viewBox="0 0 100 100">
<circle cx="50" cy="50" r="44" stroke="#10b981" stroke-width="4" fill="none"/>
<polygon points="50,22 75,37 75,65 50,80 25,65 25,37" fill="none" stroke="#10b981" stroke-width="5"/>
</svg>
</div>

<h1 class="text-sm">EDITH CORE</h1>
</div>

<button onclick="toggleTheme()" class="text-xs">🌗</button>

</div>

<!-- CHAT -->
<div id="chatArea" class="flex-1 overflow-y-auto p-6 space-y-4"></div>

<!-- INPUT -->
<div class="p-4 glass border-t border-zinc-800">

<div class="relative">

<input id="msg" placeholder="Type command..."
class="w-full bg-zinc-900/60 border border-zinc-800 rounded px-4 py-3 pr-24 outline-none"/>

<div class="absolute right-2 top-2 flex gap-2">

<button onclick="toggleVoice()" id="micBtn"
class="w-8 h-8 rounded bg-zinc-800 flex items-center justify-center">
🎤
</button>

<button onclick="sendMsg()"
class="w-8 h-8 rounded bg-emerald-500 flex items-center justify-center">
➤
</button>

</div>
</div>
</div>

</div>
</div>

<script>
const chatArea=document.getElementById("chatArea")

function appendMessage(text,isUser){
const div=document.createElement("div")
div.className="flex "+(isUser?"justify-end":"justify-start")+" fade"

div.innerHTML=`
<div class="max-w-[70%] px-4 py-3 text-sm rounded-lg ${isUser?"user-bubble":"ai-bubble"}">
${isUser?text:marked.parse(text)}
</div>
`

chatArea.appendChild(div)
chatArea.scrollTop=chatArea.scrollHeight
}

function sendMsg(){
const input=document.getElementById("msg")
const msg=input.value.trim()
if(!msg)return

appendMessage(msg,true)
input.value=""

setTimeout(()=>{
appendMessage("✨ AI Response upgraded UI working bro!",false)
},800)
}

/* 🎤 Voice */
let rec
let recording=false

if('webkitSpeechRecognition'in window){
rec=new webkitSpeechRecognition()
rec.onstart=()=>{
recording=true
micBtn.classList.add("mic-active")
}
rec.onend=()=>{
recording=false
micBtn.classList.remove("mic-active")
}
rec.onresult=(e)=>{
msg.value=e.results[0][0].transcript
}
}

function toggleVoice(){
if(!rec)return alert("No mic support")
recording?rec.stop():rec.start()
}

/* 🌗 Theme */
function toggleTheme(){
document.documentElement.classList.toggle("dark")
}

/* 🧠 New Chat */
function createNewChatSession(){
chatArea.innerHTML=""
}
</script>

</body>
</html>
