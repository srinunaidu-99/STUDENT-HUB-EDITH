<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDITH AI | Intelligence Core</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #05070a; color: #e4e4e7; }
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #27272a; border-radius: 99px; }
        .dot { width: 6px; height: 6px; background: #06b6d4; border-radius: 50%; display: inline-block; animation: bounce 1.4s infinite; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body class="w-screen h-screen flex overflow-hidden">

    <aside class="w-72 border-r border-zinc-800 flex flex-col bg-[#0b0f17]">
        <div class="p-6 font-black text-xl tracking-tighter">EDITH <span class="text-cyan-500">AI</span></div>
        <div id="chatHistoryList" class="flex-1 overflow-y-auto p-4 space-y-2 chat-scroll"></div>
        <div class="p-4 border-t border-zinc-800 text-xs text-zinc-500 font-mono">STATUS: NEURAL LINK ESTABLISHED</div>
    </aside>

    <main class="flex-1 flex flex-col h-full bg-[#05070a]">
        <div id="chatWindow" class="flex-1 overflow-y-auto p-8 space-y-8 chat-scroll"></div>
        <footer class="p-6">
            <div class="max-w-3xl mx-auto flex gap-3 bg-zinc-900 p-2 rounded-2xl border border-zinc-800 shadow-xl">
                <input type="text" id="userInput" placeholder="Querying the Matrix..." 
                       class="flex-1 bg-transparent px-4 outline-none text-sm" onkeypress="if(event.key==='Enter') handleSend()">
                <button onclick="handleSend()" class="bg-cyan-600 hover:bg-cyan-500 px-6 py-3 rounded-xl font-bold text-sm transition-all">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>
        </footer>
    </main>

    <script>
        const API_BASE = "https://student-hub-edith-backend.onrender.com";
        let sessionId = null;

        async function handleSend() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            renderBubble('user', message);
            input.value = '';

            const loader = createLoader();
            
            try {
                const response = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ message, sessionId })
                });

                const data = await response.json();
                loader.remove();
                
                if (data.response) {
                    renderBubble('assistant', data.response);
                    sessionId = data.sessionId || sessionId;
                }
            } catch (err) {
                loader.remove();
                renderBubble('assistant', "Neural Bridge Error: Unable to synchronize with the core.");
            }
        }

        function renderBubble(role, content) {
            const window = document.getElementById('chatWindow');
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `
                <div class="max-w-[70%] rounded-2xl px-5 py-3 ${role === 'user' ? 'bg-cyan-600' : 'bg-zinc-800'} text-sm leading-relaxed shadow-lg">
                    ${marked.parse(content)}
                </div>
            `;
            window.appendChild(div);
            window.scrollTop = window.scrollHeight;
        }

        function createLoader() {
            const div = document.createElement('div');
            div.className = 'flex gap-2 p-4';
            div.innerHTML = '<span class="dot"></span><span class="dot" style="animation-delay:0.2s"></span><span class="dot" style="animation-delay:0.4s"></span>';
            document.getElementById('chatWindow').appendChild(div);
            return div;
        }

        window.onload = () => {
            if (!localStorage.getItem('token')) window.location.href = 'login.html';
        };
    </script>
</body>
</html>
