<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EDITH AI</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

    <!-- Markdown Styling -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                radial-gradient(circle at top,
                    #1e1b4b 0%,
                    #020617 55%);
            color: white;
            overflow: hidden;
        }

        /* SCROLLBAR */

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        /* MESSAGE ANIMATION */

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-msg {
            animation: slideIn 0.25s ease;
        }

        /* AI BUBBLE */

        .ai-bubble {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px 18px 18px 6px;
            color: #e5e7eb;
        }

        /* USER BUBBLE */

        .user-bubble {
            background: linear-gradient(135deg,
                    #4f46e5,
                    #4338ca);
            border-radius: 18px 18px 6px 18px;
            color: white;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.25);
        }

        /* MARKDOWN */

        .markdown-body-content {
            color: #e5e7eb;
            background: transparent !important;
            font-size: 15px;
            line-height: 1.8;
        }

        .markdown-body-content h1,
        .markdown-body-content h2,
        .markdown-body-content h3 {
            font-weight: 700;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .markdown-body-content p {
            margin: 12px 0;
        }

        .markdown-body-content ul {
            padding-left: 20px;
        }

        .markdown-body-content li {
            margin: 8px 0;
        }

        .markdown-body-content pre {
            background: #020617 !important;
            padding: 16px;
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .markdown-body-content code {
            color: #a5b4fc;
        }

        /* INPUT */

        textarea {
            scrollbar-width: none;
        }

        textarea::-webkit-scrollbar {
            display: none;
        }

        /* TYPING DOTS */

        .typing-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #a5b4fc;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        /* MIC ACTIVE */

        .mic-active {
            background: #ef4444 !important;
            color: white !important;
            border-color: #ef4444 !important;
        }

        /* ORB */

        @keyframes pulseGlow {

            0%,
            100% {
                transform: scale(1);
                box-shadow:
                    0 0 30px rgba(99, 102, 241, 0.5);
            }

            50% {
                transform: scale(1.05);
                box-shadow:
                    0 0 50px rgba(99, 102, 241, 0.8);
            }
        }

        .edith-orb {
            animation: pulseGlow 4s infinite ease-in-out;
            background: linear-gradient(135deg,
                    #6366f1,
                    #a855f7);
        }
    </style>
</head>

<body>

    <!-- MAIN -->

    <div class="w-full h-screen flex flex-col">

        <!-- HEADER -->

        <div
            class="h-16 border-b border-white/5 flex items-center justify-between px-6 bg-black/20 backdrop-blur-xl">

            <div class="flex items-center gap-4">

                <div
                    class="edith-orb w-11 h-11 rounded-2xl flex items-center justify-center font-bold text-lg">
                    E
                </div>

                <div>
                    <h1 class="font-bold text-lg tracking-tight">
                        EDITH AI
                    </h1>

                    <p class="text-xs text-indigo-300">
                        Advanced Intelligence Assistant
                    </p>
                </div>

            </div>

            <div class="hidden sm:flex items-center gap-6 text-xs">

                <div>
                    <span class="text-gray-500 block">
                        STATUS
                    </span>

                    <span class="text-emerald-400">
                        ONLINE
                    </span>
                </div>

                <div>
                    <span class="text-gray-500 block">
                        LATENCY
                    </span>

                    <span class="text-indigo-400">
                        14ms
                    </span>
                </div>

            </div>

        </div>

        <!-- CHAT AREA -->

        <div id="chatArea"
            class="flex-1 overflow-y-auto px-4 sm:px-8 py-6 space-y-4 chat-container">

            <!-- WELCOME -->

            <div id="welcomeScreen"
                class="h-full flex flex-col items-center justify-center text-center">

                <div
                    class="edith-orb w-24 h-24 rounded-3xl flex items-center justify-center text-4xl mb-6">
                    <i class="fa-solid fa-brain"></i>
                </div>

                <h1 class="text-4xl font-bold mb-3">
                    Welcome to EDITH
                </h1>

                <p class="text-gray-400 max-w-md leading-relaxed">
                    Ask anything, generate code,
                    analyze documents,
                    create notes,
                    brainstorm ideas,
                    and chat naturally.
                </p>

            </div>

        </div>

        <!-- INPUT -->

        <div
            class="sticky bottom-0 w-full p-4 bg-[#0b1120]/80 backdrop-blur-xl border-t border-white/5">

            <div class="relative max-w-4xl mx-auto">

                <textarea id="msg" rows="1"
                    placeholder="Message EDITH..."
                    class="w-full resize-none overflow-hidden bg-[#111827]
                    border border-white/10 rounded-2xl py-4 pl-5 pr-36
                    text-sm outline-none focus:border-indigo-500
                    transition-all text-white placeholder-gray-500"></textarea>

                <div
                    class="absolute right-3 bottom-3 flex items-center gap-2">

                    <!-- MIC -->

                    <button onclick="toggleVoiceInput()"
                        id="micBtn"
                        class="w-10 h-10 rounded-xl bg-white/5
                        hover:bg-white/10 border border-white/10
                        transition-all">

                        <i class="fa-solid fa-microphone"></i>

                    </button>

                    <!-- SEND -->

                    <button onclick="sendMsg()"
                        class="w-10 h-10 rounded-xl
                        bg-indigo-600 hover:bg-indigo-500
                        transition-all text-white">

                        <i class="fa-solid fa-arrow-up"></i>

                    </button>

                </div>

            </div>

        </div>

    </div>

    <script>

        // =========================
        // CONFIG
        // =========================

        const API_BASE =
            window.location.hostname === "127.0.0.1"
                ? "http://localhost:5000"
                : "https://student-hub-edith-backend.onrender.com";

        const chatArea =
            document.getElementById("chatArea");

        const textarea =
            document.getElementById("msg");

        const welcomeScreen =
            document.getElementById("welcomeScreen");

        // =========================
        // AUTO RESIZE
        // =========================

        textarea.addEventListener("input", () => {
            textarea.style.height = "auto";
            textarea.style.height =
                textarea.scrollHeight + "px";
        });

        // =========================
        // ENTER SEND
        // =========================

        textarea.addEventListener("keydown", (e) => {

            if (
                e.key === "Enter" &&
                !e.shiftKey
            ) {
                e.preventDefault();
                sendMsg();
            }

        });

        // =========================
        // SPEECH
        // =========================

        let recognition;
        let isRecording = false;

        if (
            'webkitSpeechRecognition' in window ||
            'SpeechRecognition' in window
        ) {

            const SpeechRecognition =
                window.SpeechRecognition ||
                window.webkitSpeechRecognition;

            recognition =
                new SpeechRecognition();

            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = "en-US";

            recognition.onstart = () => {

                isRecording = true;

                document
                    .getElementById("micBtn")
                    .classList.add("mic-active");

                textarea.placeholder =
                    "Listening...";

            };

            recognition.onend = () => {

                isRecording = false;

                document
                    .getElementById("micBtn")
                    .classList.remove("mic-active");

                textarea.placeholder =
                    "Message EDITH...";

            };

            recognition.onresult = (event) => {

                const text =
                    event.results[0][0].transcript;

                textarea.value = text;

            };

        }

        function toggleVoiceInput() {

            if (!recognition) {
                alert("Voice not supported.");
                return;
            }

            if (isRecording) {
                recognition.stop();
            } else {
                recognition.start();
            }

        }

        // =========================
        // ESCAPE HTML
        // =========================

        function escapeHtml(text) {

            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

        }

        // =========================
        // ADD MESSAGE
        // =========================

        function addMessage(
            text,
            isUser = false
        ) {

            if (welcomeScreen) {
                welcomeScreen.style.display = "none";
            }

            const wrapper =
                document.createElement("div");

            wrapper.className =
                `w-full flex ${isUser
                    ? "justify-end"
                    : "justify-start"
                } animate-msg`;

            if (isUser) {

                wrapper.innerHTML = `
                    <div class="user-bubble p-4 px-5 max-w-[75%] text-sm leading-relaxed">
                        ${escapeHtml(text)}
                    </div>
                `;

            } else {

                wrapper.innerHTML = `
                    <div class="flex gap-3 items-start max-w-[80%]">

                        <div class="w-9 h-9 rounded-xl
                            bg-indigo-600
                            flex items-center justify-center
                            text-white shrink-0">
                            <i class="fa-solid fa-brain"></i>
                        </div>

                        <div class="ai-bubble p-4 px-5">
                            <div class="markdown-body-content">
                                ${marked.parse(text)}
                            </div>
                        </div>

                    </div>
                `;

            }

            chatArea.appendChild(wrapper);

            chatArea.scrollTop =
                chatArea.scrollHeight;

            return wrapper;

        }

        // =========================
        // TYPING
        // =========================

        function showTypingIndicator() {

            const div =
                document.createElement("div");

            div.id = "typingIndicator";

            div.className =
                "flex justify-start animate-msg";

            div.innerHTML = `
                <div class="flex gap-3 items-start">

                    <div class="w-9 h-9 rounded-xl
                        bg-indigo-600
                        flex items-center justify-center
                        text-white">
                        <i class="fa-solid fa-brain"></i>
                    </div>

                    <div class="ai-bubble px-5 py-4 flex gap-1.5">

                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>

                    </div>

                </div>
            `;

            chatArea.appendChild(div);

            chatArea.scrollTop =
                chatArea.scrollHeight;

        }

        function removeTypingIndicator() {

            const el =
                document.getElementById(
                    "typingIndicator"
                );

            if (el) el.remove();

        }

        // =========================
        // SEND MESSAGE
        // =========================

        async function sendMsg() {

            const message =
                textarea.value.trim();

            if (!message) return;

            // USER MSG

            addMessage(message, true);

            textarea.value = "";
            textarea.style.height = "auto";

            // TYPING

            showTypingIndicator();

            try {

                const response =
                    await fetch(
                        `${API_BASE}/api/chat`,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/json"
                            },
                            body: JSON.stringify({
                                message
                            })
                        }
                    );

                removeTypingIndicator();

                if (!response.ok) {

                    addMessage(
                        "❌ Server Error",
                        false
                    );

                    return;

                }

                // STREAM

                const reader =
                    response.body.getReader();

                const decoder =
                    new TextDecoder();

                // CREATE EMPTY AI MESSAGE

                const aiWrapper =
                    addMessage("", false);

                const markdownEl =
                    aiWrapper.querySelector(
                        ".markdown-body-content"
                    );

                let fullText = "";

                while (true) {

                    const {
                        done,
                        value
                    } = await reader.read();

                    if (done) break;

                    fullText +=
                        decoder.decode(value);

                    markdownEl.innerHTML =
                        marked.parse(fullText);

                    chatArea.scrollTop =
                        chatArea.scrollHeight;

                }

            } catch (err) {

                console.error(err);

                removeTypingIndicator();

                addMessage(
                    "❌ Connection Failed",
                    false
                );

            }

        }

    </script>

</body>

</html>
