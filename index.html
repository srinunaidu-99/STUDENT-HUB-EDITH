<script>
const API_URL = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
    ? "http://localhost:5000"
    : "https://student-hub-edith-backend.onrender.com";

const chatWindow = document.getElementById("chatWindow");
const chatHistoryList = document.getElementById("chatHistoryList");
const activeChatTitleHeader = document.getElementById("activeChatTitleHeader");

let currentSessionId = null; 
let cachedSessionsList = []; 
let voiceRecognitionInstance = null;
let isVoiceRecording = false;
let isSummarizeActive = false;
let localMediaStream = null;
let capturedCameraFiles = []; 

function initDashboardTheme() {
    const activeTheme = localStorage.getItem('edith-theme') || 'dark';
    document.documentElement.classList.toggle('dark', activeTheme === 'dark');
    const themeToggleIcon = document.getElementById("themeToggleIcon");
    themeToggleIcon.className = activeTheme === 'dark' ? "fa-solid fa-sun text-sm text-amber-400" : "fa-solid fa-moon text-sm text-slate-600";
}

function switchDashboardTheme() {
    localStorage.setItem('edith-theme', document.documentElement.classList.contains('dark') ? 'light' : 'dark');
    initDashboardTheme();
}
initDashboardTheme();

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechLib = window.SpeechRecognition || window.webkitSpeechRecognition;
    voiceRecognitionInstance = new SpeechLib();
    voiceRecognitionInstance.onstart = () => { isVoiceRecording = true; document.getElementById("speechBtn").classList.add("text-cyan-400", "animate-pulse"); };
    voiceRecognitionInstance.onend = () => { isVoiceRecording = false; document.getElementById("speechBtn").classList.remove("text-cyan-400", "animate-pulse"); };
    voiceRecognitionInstance.onresult = (e) => { document.getElementById("userInputText").value = e.results[0][0].transcript; };
}

function toggleSpeech() { if (!voiceRecognitionInstance) return alert("Biometric speech streaming is unsupported by this browser environment."); isVoiceRecording ? voiceRecognitionInstance.stop() : voiceRecognitionInstance.start(); }
function toggleSidebar(open) { document.getElementById("sidebar").classList.toggle("-translate-x-full", !open); document.getElementById("sidebarOverlay").classList.toggle("hidden", !open); }

function toggleSummarizeMode() {
    isSummarizeActive = !isSummarizeActive;
    const badge = document.getElementById("summarizeBadge");
    badge.textContent = isSummarizeActive ? "ENGAGED" : "STANDBY";
    badge.className = isSummarizeActive ? "text-cyan-400 font-bold" : "text-slate-400";
}

/* Digital Vault Architecture Subsystems */
function toggleDigitalVaultView(forceShow = null) {
    const drawer = document.getElementById("digitalVaultDrawer");
    if (forceShow !== null) {
        forceShow ? drawer.classList.remove("hidden") : drawer.classList.add("hidden");
    } else {
        drawer.classList.toggle("hidden");
    }
    renderDigitalVaultItems();
}

function fetchDigitalVaultData() {
    return JSON.parse(localStorage.getItem("edith_vault_notes") || "[]");
}

function pushItemToVault(title, rawContent) {
    const records = fetchDigitalVaultData();
    records.unshift({
        id: "vault-" + Date.now(),
        title: title || "Compiled Core Notes Directive",
        timestamp: new Date().toLocaleString(),
        body: rawContent
    });
    localStorage.setItem("edith_vault_notes", JSON.stringify(records));
    updateVaultInterfaceBadge();
}

function updateVaultInterfaceBadge() {
    const records = fetchDigitalVaultData();
    document.getElementById("vaultItemsBadge").textContent = records.length;
}

function clearDigitalVaultStorage() {
    if(confirm("Wipe all compiled assets from the Digital Vault terminal?")) {
        localStorage.removeItem("edith_vault_notes");
        updateVaultInterfaceBadge();
        renderDigitalVaultItems();
    }
}

function renderDigitalVaultItems() {
    const container = document.getElementById("vaultItemsContainer");
    const items = fetchDigitalVaultData();
    container.innerHTML = "";
    
    if(items.length === 0) {
        container.innerHTML = `<div class='text-xs font-mono text-zinc-500 py-3 text-center'>// Vault isolation clean. No notes locked.</div>`;
        return;
    }
    
    items.forEach(item => {
        const row = document.createElement("div");
        row.className = "p-3 bg-white dark:bg-zinc-900 border dark:border-matrix-border border-slate-200 rounded-xl flex items-center justify-between gap-4";
        row.innerHTML = `
            <div class="overflow-hidden">
                <h5 class="text-xs font-bold text-slate-800 dark:text-zinc-200 truncate">${item.title}</h5>
                <span class="text-[10px] text-zinc-500 font-mono">${item.timestamp}</span>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button onclick="downloadCustomNotesPdf(\`${encodeURIComponent(item.title)}\`, \`${encodeURIComponent(item.body)}\`)" class="px-2.5 py-1 text-[11px] font-bold bg-cyan-500/10 hover:bg-cyan-500 text-cyan-400 hover:text-white rounded-md transition-all">Export PDF</button>
            </div>
        `;
        container.appendChild(row);
    });
}

/* Beautiful Paper-Style Academic PDF Framework Engine */
function downloadCustomNotesPdf(encodedTitle, encodedContent) {
    const title = decodeURIComponent(encodedTitle);
    const bodyMarkdown = decodeURIComponent(encodedContent);
    
    const wrapper = document.createElement("div");
    wrapper.className = "pdf-notes-container";
    
    let contentHtml = marked.parse(bodyMarkdown);
    
    wrapper.innerHTML = `
        <div class="pdf-notes-header">
            <h1 class="pdf-notes-title">${title}</h1>
            <div class="pdf-meta-tag">EDITH Automated Syllabus Notes Framework &bull; Chrono Dynamic Generation</div>
        </div>
        <div class="pdf-body-text">
            ${contentHtml}
        </div>
        <div class="pdf-footer-branding">
            &copy; 2026 EDITH Intelligence Core &bull; Confidential Distributed Data Nodes
        </div>
    `;

    wrapper.querySelectorAll("h1, h2, h3").forEach(header => {
        header.style.color = "#0891b2";
        header.style.fontFamily = "'Playfair Display', serif";
        header.style.marginTop = "24px";
        header.style.marginBottom = "12px";
        header.style.fontWeight = "bold";
    });
    
    wrapper.querySelectorAll("p").forEach(p => {
        p.style.marginBottom = "14px";
        p.style.fontSize = "14px";
        p.style.lineHeight = "1.7";
        p.style.color = "#334155";
    });

    const options = {
        margin: [15, 15, 20, 15],
        filename: `${title.replace(/\s+/g, '-').toLowerCase()}-notes.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, letterRendering: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
    };

    html2pdf().from(wrapper).set(options).save();
}

/* Native Camera Handling Subroutines */
async function openCameraSensor() {
    try {
        localMediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        const videoFeed = document.getElementById("cameraVideoFeed");
        videoFeed.srcObject = localMediaStream;
        document.getElementById("cameraModal").classList.remove("hidden");
    } catch(err) {
        alert("Unable to map optical nodes. Ensure camera access permissions are enabled.");
    }
}

function closeCameraSensor() {
    if (localMediaStream) {
        localMediaStream.getTracks().forEach(track => track.stop());
    }
    document.getElementById("cameraModal").classList.add("hidden");
}

function captureCameraSnapshot() {
    const video = document.getElementById("cameraVideoFeed");
    const canvas = document.getElementById("cameraCanvasBuffer");
    const ctx = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    canvas.toBlob((blob) => {
        const frameFile = new File([blob], `Snapshot-${Date.now()}.jpg`, { type: "image/jpeg" });
        capturedCameraFiles.push(frameFile);
        updateInterfaceAttachmentLabels();
        closeCameraSensor();
    }, "image/jpeg", 0.85);
}

window.onload = () => {
    const userToken = localStorage.getItem("token");
    const accountName = localStorage.getItem("userName") || "Operator";
    if (!userToken) { window.location.href = "login.html"; return; }

    document.getElementById("userNameFooter").textContent = accountName;
    document.getElementById("userBadge").textContent = accountName.substring(0, 2).toUpperCase();
    marked.setOptions({ breaks: true, gfm: true });
    updateVaultInterfaceBadge();
    loadChatSessions(true);
};

async function apiCall(endpoint, config = {}) {
    const userToken = localStorage.getItem("token");
    const headers = { ...(config.headers || {}), "Authorization": `Bearer ${userToken}` };
    if (!(config.body instanceof FormData) && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
    
    const response = await fetch(`${API_URL}${endpoint}`, { ...config, headers });
    if (response.status === 401) { logoutSession(); return null; }
    return response;
}

function logoutSession() { localStorage.clear(); window.location.href = "login.html"; }

async function loadChatSessions(autoLoadFirst = false) {
    try {
        const response = await apiCall("/api/history");
        if (!response) return;
        cachedSessionsList = await response.json();
        renderSidebarList(cachedSessionsList);
        if (autoLoadFirst && cachedSessionsList.length > 0) selectSession(cachedSessionsList[0]._id);
        else if (cachedSessionsList.length === 0) showEmptyStateWelcome();
    } catch (err) { showEmptyStateWelcome(); }
}

function renderSidebarList(sessions) {
    chatHistoryList.innerHTML = "";
    document.getElementById("chatCounter").textContent = sessions.length;
    if (sessions.length === 0) {
        chatHistoryList.innerHTML = '<div class="text-center py-8 text-xs text-zinc-500 font-mono">// No history nodes linked.</div>';
        return;
    }
    sessions.forEach(session => {
        const isActive = session._id === currentSessionId;
        let title = session.messages && session.messages[0] ? session.messages[0].content : 'Untitled Chat';
        if (title.length > 22) title = title.substring(0, 22) + "...";
        if(isActive) activeChatTitleHeader.textContent = `// ${title.toUpperCase()}`;
        
        const div = document.createElement("div");
        div.className = "group w-full flex items-center justify-between px-3 py-2.5 my-0.5 text-sm rounded-xl cursor-pointer transition-all " + (isActive ? 'bg-cyan-500/10 text-cyan-400 font-semibold border border-cyan-500/20' : 'text-zinc-400 hover:bg-zinc-900/40 hover:text-zinc-200');
        div.onclick = () => selectSession(session._id);
        div.innerHTML = '<span class="truncate flex items-center gap-2.5"><i class="fa-solid fa-terminal text-xs opacity-60"></i><span class="truncate">' + title + '</span></span><button onclick="deleteSession(event, \'' + session._id + '\')" class="p-1 text-zinc-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity"><i class="fa-regular fa-trash-can text-xs"></i></button>';
        chatHistoryList.appendChild(div);
    });
}

function createNewChat() { currentSessionId = null; chatWindow.innerHTML = ""; activeChatTitleHeader.textContent = "// Standby Matrix Ready"; showEmptyStateWelcome(); }
function selectSession(id) { currentSessionId = id; renderSidebarList(cachedSessionsList); loadActiveMessages(); toggleSidebar(false); }

async function deleteSession(event, id) {
    event.stopPropagation();
    if (!confirm("Are you sure you want to terminate this context timeline?")) return;
    try {
        await apiCall("/api/chat/" + id, { method: "DELETE" });
        if (currentSessionId === id) createNewChat();
        loadChatSessions(true);
    } catch (err) {}
}

function loadActiveMessages() {
    if (!currentSessionId) return;
    const session = cachedSessionsList.find(s => s._id === currentSessionId);
    chatWindow.innerHTML = "";
    if (session && session.messages) session.messages.forEach(msg => insertMessageBubble(msg.role, msg.content));
    chatWindow.scrollTop = chatWindow.scrollHeight;
}

function showEmptyStateWelcome() {
    const name = localStorage.getItem("userName") || "Operator";
    chatWindow.innerHTML = `
        <div id="welcomeScreen" class="flex flex-col items-center justify-center flex-1 max-w-lg mx-auto text-center space-y-6 my-auto p-6">
            <div class="relative w-16 h-16 flex items-center justify-center">
                <div class="absolute inset-0 bg-cyan-500/20 rounded-2xl blur-md animate-pulse"></div>
                <div class="relative w-full h-full rounded-2xl bg-zinc-900 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-2xl">
                    <i class="fa-solid fa-brain"></i>
                </div>
            </div>
            <div class="space-y-2">
                <h3 class="text-xl font-extrabold tracking-tight dark:text-white text-slate-900">Systems Online. Greetings, ${name}.</h3>
                <p class="text-sm dark:text-zinc-400 text-slate-500 max-w-xs mx-auto">EDITH core matrix is standing by. Choose a processing directive or transmit a query.</p>
            </div>
            <div class="grid grid-cols-2 gap-3 w-full max-w-sm pt-2">
                <div onclick="document.getElementById('userInputText').value='Prepare notes on Quantum Mechanics Architecture'; document.getElementById('userInputText').focus();" class="p-3 border dark:border-zinc-800 bg-zinc-900/30 rounded-xl text-left cursor-pointer hover:border-cyan-500/40 transition-all">
                    <h5 class="text-xs font-bold text-cyan-400 mb-1">Prepare Notes</h5>
                    <p class="text-[11px] text-zinc-500 truncate">Auto-Vault & Live Export</p>
                </div>
                <div onclick="document.getElementById('userInputText').value='Analyze structural discrepancies inside...'; document.getElementById('userInputText').focus();" class="p-3 border dark:border-zinc-800 bg-zinc-900/30 rounded-xl text-left cursor-pointer hover:border-cyan-500/40 transition-all">
                    <h5 class="text-xs font-bold text-cyan-400 mb-1">Code Refactoring</h5>
                    <p class="text-[11px] text-zinc-500 truncate">Examine algorithm layers</p>
                </div>
            </div>
        </div>`;
}

function insertMessageBubble(role, content) {
    const welcome = document.getElementById("welcomeScreen"); if(welcome) welcome.remove();
    const wrapper = document.createElement("div");
    wrapper.className = "flex gap-3 w-full max-w-3xl mx-auto py-2 " + (role === 'user' ? 'flex-row-reverse' : 'flex-row');
    
    const bubble = document.createElement("div");
    bubble.className = "rounded-2xl px-4 py-3 text-sm md:text-base leading-relaxed break-words shadow-sm max-w-[85%] " + (role === 'user' ? 'bg-brand-500 text-white ml-auto' : 'dark:bg-matrix-darkCard bg-white border dark:border-matrix-border border-slate-200 prose-content');
    
    if (role === 'user') bubble.textContent = content;
    else {
        bubble.innerHTML = marked.parse(content);
        attachCodeBlockCopyLogic(bubble);
        injectDownloadActionTrigger(bubble, content);
    }
    wrapper.appendChild(bubble); chatWindow.appendChild(wrapper);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return bubble;
}

function attachCodeBlockCopyLogic(container) {
    container.querySelectorAll("pre").forEach(pre => {
        if(pre.parentNode.classList.contains("code-block-container")) return;
        const wrapper = document.createElement("div"); wrapper.className = "code-block-container";
        const btn = document.createElement("button"); btn.className = "absolute top-2.5 right-2.5 bg-zinc-900/80 border border-zinc-800 text-zinc-400 text-xs px-2.5 py-1.5 rounded-lg backdrop-blur-sm";
        btn.innerHTML = "<i class='fa-regular fa-copy mr-1'></i> Copy"; 
        btn.onclick = () => { navigator.clipboard.writeText(pre.innerText); btn.innerHTML = "Copied!"; setTimeout(() => btn.innerHTML="<i class='fa-regular fa-copy mr-1'></i> Copy", 2000); };
        pre.parentNode.insertBefore(wrapper, pre); wrapper.appendChild(pre); wrapper.appendChild(btn);
    });
}

function injectDownloadActionTrigger(container, rawMarkdownContent) {
    if (container.querySelector(".download-pdf-trigger")) return;
    const btn = document.createElement("button"); 
    btn.className = "download-pdf-trigger"; 
    btn.innerHTML = '<i class="fa-solid fa-file-pdf"></i> Download Notes Report';
    btn.onclick = () => {
        downloadCustomNotesPdf("EDITH Synthesized Notes", rawMarkdownContent);
    };
    container.appendChild(btn);
}

async function sendMessage() {
    const input = document.getElementById("userInputText"), fileSelector = document.getElementById("fileAttachment"), text = input.value.trim();
    if (!text && fileSelector.files.length === 0 && capturedCameraFiles.length === 0) return;
    
    input.value = "";
    if (text) insertMessageBubble('user', text);
    
    // Exact Intercept matching logic for "notes" and "prepare notes"
    const parsedInput = text.toLowerCase();
    const isNotesDirective = parsedInput.includes("notes") || parsedInput.includes("prepare notes") || parsedInput.includes("give me notes");

    const bubble = insertMessageBubble('assistant', "<div class='flex items-center gap-1.5 py-1 text-zinc-400 font-mono text-xs'><div class='dot'></div><div class='dot'></div><div class='dot'></div><span class='ml-2'>Accessing Deep EDITH Matrix Core...</span></div>");
    try {
        const formData = new FormData();
        formData.append("message", text);
        formData.append("isSummarize", isSummarizeActive);
        if (currentSessionId) formData.append("sessionId", currentSessionId);
        
        for (let i = 0; i < fileSelector.files.length; i++) formData.append("files", fileSelector.files[i]);
        for (let j = 0; j < capturedCameraFiles.length; j++) formData.append("files", capturedCameraFiles[j]);

        const response = await apiCall("/api/chat", { method: "POST", body: formData });
        const incomingId = response.headers.get("X-Session-Id");
        if (incomingId && !currentSessionId) currentSessionId = incomingId;

        const reader = response.body.getReader(), decoder = new TextDecoder("utf-8");
        let chunkedText = "";
        while (true) {
            const { done, value } = await reader.read(); if (done) break;
            chunkedText += decoder.decode(value, { stream: true });
            bubble.innerHTML = marked.parse(chunkedText);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
        bubble.innerHTML = marked.parse(chunkedText); 
        attachCodeBlockCopyLogic(bubble); 
        injectDownloadActionTrigger(bubble, chunkedText);
        clearFileSelector(); 
        loadChatSessions(false);

        // Execute unified automated pipeline if notes criteria met
        if (isNotesDirective) {
            const noteHeading = "Notes Asset: " + text.replace(/prepare notes on|give me notes on|notes/gi, "").trim() || "Syllabus Notes Extract";
            pushItemToVault(noteHeading, chunkedText);
            
            // Pop open the dashboard storage vault visually to guide user focus
            toggleDigitalVaultView(true);
            
            // Instantly deploy premium PDF compiler execution
            setTimeout(() => {
                downloadCustomNotesPdf(noteHeading, chunkedText);
            }, 600);
        }

    } catch (err) { bubble.innerHTML = "<span class='text-red-400 font-mono text-xs'>// Critical pipeline exception: Connection dropped.</span>"; }
}

function handleFileSelect() { updateInterfaceAttachmentLabels(); }

function updateInterfaceAttachmentLabels() {
    const fileSelector = document.getElementById("fileAttachment");
    const lbl = document.getElementById("fileBadgeLabel");
    const totalCount = fileSelector.files.length + capturedCameraFiles.length;
    lbl.textContent = "(" + totalCount + " Loaded)"; 
    lbl.classList.toggle("hidden", totalCount === 0);
}

function clearFileSelector() { 
    document.getElementById("fileAttachment").value = ""; 
    capturedCameraFiles = [];
    document.getElementById("fileBadgeLabel").classList.add("hidden"); 
}
</script>
