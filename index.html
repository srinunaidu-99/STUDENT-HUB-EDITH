<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace Chat Interface</title>
    <style>
        :root {
            --bg-primary: #1e1e2e;
            --bg-sidebar: #181825;
            --text-main: #cdd6f4;
            --accent: #89b4fa;
            --border-color: #313244;
            --bubble-user: #313244;
            --bubble-ai: #45475a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background: var(--bg-primary); color: var(--text-main); }
        
        /* Layout Structure */
        #sidebar { width: 280px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 15px; }
        #main-chat { flex: 1; display: flex; flex-direction: column; height: 100vh; }
        
        /* Sidebar Components */
        .btn-new-chat { background: var(--accent); color: #11111b; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 20px; transition: opacity 0.2s; }
        .btn-new-chat:hover { opacity: 0.9; }
        #history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .history-item { padding: 10px; border-radius: 6px; background: #11111b; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; font-size: 14px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .history-item:hover, .history-item.active { border-color: var(--accent); background: #313244; }
        
        /* Chat Stream Components */
        #chatArea { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        .bubble { max-width: 75%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; word-wrap: break-word; font-size: 15px; }
        .user-msg { background: var(--bubble-user); align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background: var(--bubble-ai); align-self: flex-start; border-bottom-left-radius: 2px; }
        
        /* Input Controls Area */
        #input-container { padding: 20px; background: var(--bg-sidebar); border-top: 1px solid var(--border-color); }
        .input-wrapper { display: flex; gap: 10px; align-items: center; position: relative; }
        #msg { flex: 1; padding: 14px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-main); font-size: 15px; outline: none; }
        #msg:focus { border-color: var(--accent); }
        .btn-action { background: #313244; border: 1px solid var(--border-color); color: var(--text-main); padding: 12px 18px; border-radius: 8px; cursor: pointer; font-weight: 500; }
        .btn-action:hover { background: #45475a; }
        #btn-send { background: var(--accent); color: #11111b; font-weight: bold; }
        #fileCount { font-size: 12px; color: var(--accent); margin-top: 5px; display: block; }
        .typing-loader { display: none; align-self: flex-start; background: var(--bubble-ai); padding: 12px; border-radius: 12px; font-size: 13px; font-style: italic; opacity: 0.7; }
    </style>
</head>
<body>

    <!-- SIDEBAR ENGINE COMPONENT -->
    <div id="sidebar">
        <button class="btn-new-chat" onclick="startNewSession()">+ New Chat Session</button>
        <h4 style="margin-bottom: 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.5;">Recent Conversations</h4>
        <div id="history-list">
            <!-- Dynamic UI injection nodes -->
        </div>
    </div>

    <!-- MAIN CHAT INTERACTION ENGINE -->
    <div id="main-chat">
        <div id="chatArea">
            <div class="bubble ai-msg">Hello! How can I assist you with your workspace tasks today?</div>
        </div>
        
        <!-- Typing indicator lock -->
        <div id="typingIndicator" class="typing-loader">AI Engine is compiling blocks...</div>

        <div id="input-container">
            <div class="input-wrapper">
                <input type="file" id="fileInput" multiple style="display: none;" onchange="updateFileIndicator()">
                <button class="btn-action" onclick="document.getElementById('fileInput').click()">📎 Attach</button>
                <input type="text" id="msg" placeholder="Type your message here... (Press Enter to send)" onkeydown="if(event.key === 'Enter') sendMsg()">
                <button id="btn-send" class="btn-action" onclick="sendMsg()">Send</button>
            </div>
            <span id="fileCount"></span>
        </div>
    </div>

    <!-- MAIN LOGIC ENGINE SCRIPT -->
    <script>
        // CONFIGURATIONS & RUNTIME STATE INSTANCES
        const API_BASE = window.location.origin; // Dynamically binds to your hosting port setup
        let currentActiveSessionId = ""; 
        let isSummarize = false;
        let globallyCachedHistoryTree = [];

        const chatArea = document.getElementById("chatArea");
        const historyList = document.getElementById("history-list");

        // ONLOAD INITIALIZATION LOOP
        window.addEventListener("DOMContentLoaded", () => {
            silentReloadChatHistory();
        });

        // TRIGGER NEW CONVERSATION PROCESS
        function startNewSession() {
            currentActiveSessionId = ""; // Session key pointer cleared out securely
            chatArea.innerHTML = `<div class="bubble ai-msg">Started a completely new session. Drop your prompt below!</div>`;
            
            // Remove active highlight from sidebar elements
            document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
            console.log("State clean: Ready for standalone injection thread.");
        }

        // CHAT TRANSMISSION LOGIC
        async function sendMsg() {
            const input = document.getElementById("msg");
            const fileInput = document.getElementById("fileInput");
            const message = input.value.trim();
            const token = localStorage.getItem("token") || "mock_token_if_none";

            if (!message && fileInput.files.length === 0) return;

            // Immediate user response update UI
            addMessage(message || "Analyzing documents...", true);
            input.value = "";

            const formData = new FormData();
            formData.append("message", message);
            formData.append("isSummarize", isSummarize);
            
            // CRITICAL ENGINE FIX: Validates state clean properties properly before matching payloads
            if (currentActiveSessionId && currentActiveSessionId !== "null" && currentActiveSessionId !== "") {
                formData.append("sessionId", currentActiveSessionId); 
            }

            for (let file of fileInput.files) {
                formData.append("files", file);
            }

            showTypingIndicator();

            try {
                const res = await fetch(`${API_BASE}/api/chat`, {
                    method: "POST",
                    headers: { Authorization: `Bearer ${token}` },
                    body: formData
                });

                removeTypingIndicator();

                if (!res.ok) {
                    const err = await res.text();
                    addMessage("❌ Connection dropped: " + err, false);
                    return;
                }

                // SESSION MATCH ENGINE: Extract and map transaction keys directly
                const responseSessionIdHeader = res.headers.get("x-session-id") || res.headers.get("X-Session-Id");
                if (responseSessionIdHeader && (!currentActiveSessionId || currentActiveSessionId === "null")) {
                    currentActiveSessionId = responseSessionIdHeader;
                }

                // READ READABLE STREAM CHUNKS LAYER
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                const aiBubble = addMessage("", false);
                let aiText = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    aiText += decoder.decode(value, { stream: true });
                    aiBubble.innerHTML = cleanAndParseMarkdown(aiText);
                    chatArea.scrollTop = chatArea.scrollHeight;
                }

                // SILENT MATRIX UPDATE: Reloads history node array cleanly without UI interruption
                await silentReloadChatHistory();

            } catch (err) {
                console.error(err);
                removeTypingIndicator();
                addMessage("❌ Matrix Connection Interrupted (Server Failure)", false);
            }

            // Input elements reset cycle completion
            fileInput.value = "";
            document.getElementById("fileCount").innerText = "";
        }

        // FETCH CONVERSATIONS WITHOUT RE-RENDERING RUNTIME PANEL VIEW
        async function silentReloadChatHistory() {
            const token = localStorage.getItem("token") || "mock_token_if_none";
            try {
                const response = await fetch(`${API_BASE}/api/history`, {
                    method: "GET",
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (response.ok) {
                    globallyCachedHistoryTree = await response.json();
                    renderSidebarHistoryList(globallyCachedHistoryTree);
                }
            } catch (err) {
                console.error("Sidebar sync delay error:", err);
            }
        }

        // RENDER SIDEBAR COMPONENT MAP
        function renderSidebarHistoryList(sessions) {
            historyList.innerHTML = "";
            if (!sessions || sessions.length === 0) {
                historyList.innerHTML = `<div style='font-size:12px; opacity:0.4; text-align:center; padding:20px;'>No logs recorded</div>`;
                return;
            }

            sessions.forEach(session => {
                const div = document.createElement("div");
                div.className = `history-item ${currentActiveSessionId === session.id ? 'active' : ''}`;
                div.innerText = session.title || session.firstMessage || `Session Thread ID ${session.id.substring(0,6)}`;
                div.onclick = () => loadHistoricalChatStream(session.id);
                historyList.appendChild(div);
            });
        }

        // SWITCH VIEWPORT VIA EXPLICIT SIDEBAR CLICKS
        async function loadHistoricalChatStream(sessionId) {
            currentActiveSessionId = sessionId;
            const token = localStorage.getItem("token") || "mock_token_if_none";
            
            chatArea.innerHTML = "<div class='bubble ai-msg'>Fetching historical trace data...</div>";
            
            // Re-render highlight instant visual feedback loop
            renderSidebarHistoryList(globallyCachedHistoryTree);

            try {
                const res = await fetch(`${API_BASE}/api/chat/${sessionId}`, {
                    method: "GET",
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (res.ok) {
                    const logs = await res.json();
                    chatArea.innerHTML = ""; // wiping loader out safely
                    
                    if(logs.messages && logs.messages.length > 0) {
                        logs.messages.forEach(m => {
                            addMessage(m.text, m.sender === "user" || m.role === "user");
                        });
                    } else {
                        chatArea.innerHTML = "<div class='bubble ai-msg'>Conversation history trace records structurally unpopulated.</div>";
                    }
                }
            } catch (e) {
                console.error(e);
                chatArea.innerHTML = "<div class='bubble ai-msg'>❌ System mapping failed during history lookup context pull.</div>";
            }
        }

        // TEXT INJECTION CORE DOM BUBBLE STRUCT
        function addMessage(text, isUser) {
            const bubble = document.createElement("div");
            bubble.className = `bubble ${isUser ? "user-msg" : "ai-msg"}`;
            bubble.innerHTML = isUser ? escapeHTML(text) : cleanAndParseMarkdown(text);
            chatArea.appendChild(bubble);
            chatArea.scrollTop = chatArea.scrollHeight;
            return bubble;
        }

        // INTERNAL REGEX MARKDOWN PARSER LAYER
        function cleanAndParseMarkdown(raw) {
            let processed = escapeHTML(raw);
            processed = processed.replace(/\*\*([\s\S]*?)\*\*/g, '<strong>$1</strong>');
            processed = processed.replace(/\*([\s\S]*?)\*/g, '<em>$1</em>');
            processed = processed.replace(/`([^`]+)`/g, '<code>$1</code>');
            processed = processed.replace(/\n/g, '<br>');
            return processed;
        }

        function escapeHTML(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // INPUT UTILITY HANDLERS
        function updateFileIndicator() {
            const files = document.getElementById("fileInput").files;
            document.getElementById("fileCount").innerText = files.length > 0 ? `📎 Packed ready: ${files.length} attachment file(s)` : "";
        }

        function showTypingIndicator() { document.getElementById("typingIndicator").style.display = "block"; chatArea.scrollTop = chatArea.scrollHeight; }
        function removeTypingIndicator() { document.getElementById("typingIndicator").style.display = "none"; }
    </script>
</body>
</html>
