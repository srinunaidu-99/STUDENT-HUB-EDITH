<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDITH - Intelligence Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #030712 70%);
            overflow: hidden;
        }

        /* Custom Scrollbar */
        .chat-container::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.2);
            border-radius: 10px;
        }
        .chat-container::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.4);
        }

        /* Core Orb Animations */
        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 25px 2px rgba(99, 102, 241, 0.4), 0 0 50px 10px rgba(168, 85, 247, 0.2);
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 0 40px 8px rgba(99, 102, 241, 0.6), 0 0 70px 20px rgba(168, 85, 247, 0.4);
            }
        }
        .edith-orb {
            animation: pulseGlow 4s ease-in-out infinite;
            background: linear-gradient(135deg, #6366f1, #a855f7);
        }

        /* Smooth slide in for incoming messages */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.99);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-msg {
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Mic Pulsing Effect when recording */
        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .mic-active {
            animation: micPulse 1.5s infinite;
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #f87171 !important;
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(10, 11, 23, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .ai-bubble {
            background: rgba(23, 24, 51, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.25);
            color: #f3f4f6;
        }
        .user-bubble {
            background: linear-gradient(135deg, #4f46e5, #3730a3);
            color: white;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.25);
        }

        /* Code Block Copy Enhancement Wrapper */
        .code-block-wrapper {
            position: relative;
            margin: 12px 0;
            width: 100%;
        }
        pre {
            background: #020617 !important;
            padding: 2.2rem 1rem 1rem 1rem;
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 100%;
            font-family: 'JetBrains Mono', monospace;
        }
        code {
            color: #a5b4fc;
            font-size: 0.875rem;
        }
        .copy-code-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 10;
        }
        .copy-code-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        /* Typing Dots Animation */
        .typing-dot {
            animation: typingBounce 1.4s infinite ease-in-out both;
            width: 6px;
            height: 6px;
            background-color: #a5b4fc;
            border-radius: 50%;
            display: inline-block;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>

<script>
// SESSION FRAME MANAGEMENT PLATFORM ENGINE LOGIC
let chatThreads = [];
let activeThreadId = null;
let currentAbortController = null;
let lastUserPromptBackup = ""; 

function initLocalStorageData() {
    const cached = localStorage.getItem("edith_chat_sessions");
    if (cached) {
        try {
            chatThreads = JSON.parse(cached);
        } catch(e) {
            chatThreads = [];
        }
    }
    if (chatThreads.length === 0) {
        createNewChat();
    } else {
        activeThreadId = chatThreads[0].id;
        renderSidebarItems();
        reloadActiveChatViewport();
    }
}

function saveStateToDisk() {
    localStorage.setItem("edith_chat_sessions", JSON.stringify(chatThreads));
}

function createNewChat() {
    const newId = "thread_" + Date.now();
    const newLog = {
        id: newId,
        title: "New Operation Frame",
        model: document.getElementById("modelSelector").value,
        messages: []
    };
    chatThreads.unshift(newLog);
    activeThreadId = newId;
    saveStateToDisk();
    renderSidebarItems();
    reloadActiveChatViewport();
}

function selectChatThread(id) {
    activeThreadId = id;
    reloadActiveChatViewport();
    renderSidebarItems();
    // Auto dismiss sidebar view frame matrices on compact layouts
    const sidebar = document.getElementById('sidebar');
    if (!sidebar.classList.contains('-translate-x-full')) {
        toggleSidebar();
    }
}

function renameChatThread(id, event) {
    event.stopPropagation();
    const thread = chatThreads.find(t => t.id === id);
    if (!thread) return;
    const currentName = thread.title;
    const validationStr = prompt("Update operational structural identity moniker:", currentName);
    if (validationStr && validationStr.trim() !== "") {
        thread.title = validationStr.trim();
        saveStateToDisk();
        renderSidebarItems();
    }
}

function deleteChatThread(id, event) {
    event.stopPropagation();
    if (!confirm("Are you sure you want to permanently delete this chat thread?")) return;
    
    chatThreads = chatThreads.filter(t => t.id !== id);
    saveStateToDisk();
    
    if (chatThreads.length === 0) {
        createNewChat();
    } else {
        if (activeThreadId === id) {
            activeThreadId = chatThreads[0].id;
        }
        renderSidebarItems();
        reloadActiveChatViewport();
    }
}

function switchModel(val) {
    if (activeThreadId) {
        const curThread = chatThreads.find(t => t.id === activeThreadId);
        if (curThread) {
            curThread.model = val;
            saveStateToDisk();
        }
    }
}

function renderSidebarItems() {
    const container = document.getElementById("historyContainer");
    container.innerHTML = `<div class="text-[10px] uppercase font-bold tracking-widest text-gray-500 px-3 mb-2">Operation Records</div>`;
    
    chatThreads.forEach(thread => {
        const isActive = thread.id === activeThreadId;
        const btn = document.createElement("div");
        btn.className = `w-full text-left px-3 py-2.5 rounded-xl text-xs font-medium flex items-center justify-between gap-1 cursor-pointer transition-all ${
            isActive 
            ? "bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 shadow-sm" 
            : "hover:bg-white/5 text-gray-400 hover:text-gray-200"
        }`;
        btn.setAttribute("onclick", `selectChatThread('${thread.id}')`);
        
        btn.innerHTML = `
            <div class="flex items-center gap-2 truncate flex-1">
                <i class="fa-regular ${isActive ? 'fa-comment-dots text-indigo-400' : 'fa-message'}"></i>
                <span class="truncate pr-1">${escapeHtml(thread.title)}</span>
            </div>
            <div class="flex items-center gap-1 opacity-50 hover:opacity-100 transition-opacity">
                <button onclick="renameChatThread('${thread.id}', event)" class="p-1 hover:text-indigo-400" title="Rename"><i class="fa-solid fa-pen text-[9px]"></i></button>
                <button onclick="deleteChatThread('${thread.id}', event)" class="p-1 hover:text-red-400" title="Delete"><i class="fa-solid fa-trash-can text-[9px]"></i></button>
            </div>
        `;
        container.appendChild(btn);
    });
}

function reloadActiveChatViewport() {
    const chatArea = document.getElementById("chatArea");
    const welcomeScreen = document.getElementById("welcomeScreen");
    const targetThread = chatThreads.find(t => t.id === activeThreadId);
    
    // Purge elements inside viewspace arrays
    const nodes = chatArea.children;
    for (let i = nodes.length - 1; i >= 0; i--) {
        if (nodes[i].id !== "welcomeScreen") {
            nodes[i].remove();
        }
    }
    
    if (!targetThread || targetThread.messages.length === 0) {
        welcomeScreen.style.display = "flex";
        document.getElementById("regenerateControlBox").classList.add("hidden");
        return;
    }
    
    welcomeScreen.style.display = "none";
    document.getElementById("modelSelector").value = targetThread.model || "edith-core";
    
    targetThread.messages.forEach(msg => {
        renderMessageBubble(msg.text, msg.isUser, false);
    });
    
    // Show/Hide execution state rollbacks controls
    if (targetThread.messages.length > 0 && !targetThread.messages[targetThread.messages.length - 1].isUser) {
        document.getElementById("regenerateControlBox").classList.remove("hidden");
    } else {
        document.getElementById("regenerateControlBox").classList.add("hidden");
    }
    chatArea.scrollTop = chatArea.scrollHeight;
}

function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    if (sidebar.classList.contains('-translate-x-full')) {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
    } else {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
    }
}

// BACKEND API PIPELINE CONFIGURATION
const API_BASE = window.location.hostname === "127.0.0.1"
    ? "http://localhost:5000"
    : "https://student-hub-edith-backend.onrender.com";

const chatArea = document.getElementById("chatArea");
const welcomeScreen = document.getElementById("welcomeScreen");
let isSummarize = false;

// Audio Configuration (Web Speech API Integration)
let recognition;
let isRecording = false;

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    recognition.onstart = () => {
        isRecording = true;
        document.getElementById("micBtn").classList.add("mic-active");
        document.getElementById("msg").placeholder = "Listening intelligently...";
    };

    recognition.onend = () => {
        isRecording = false;
        document.getElementById("micBtn").classList.remove("mic-active");
        document.getElementById("msg").placeholder = "Ask EDITH anything...";
    };

    recognition.onresult = (event) => {
        const speechToText = event.results[0][0].transcript;
        document.getElementById("msg").value = speechToText;
    };

    recognition.onerror = (err) => {
        console.error("Speech Architecture Fault:", err);
        isRecording = false;
        document.getElementById("micBtn").classList.remove("mic-active");
    };
}

function toggleVoiceInput() {
    if (!recognition) {
        alert("Voice recognition is not supported natively in this browser window configuration.");
        return;
    }
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
        } catch(e) {
            console.warn("Recognition structure is already active contextually.", e);
        }
    }
}

window.onload = () => {
    const token = localStorage.getItem("token");
    const name = localStorage.getItem("userName");

    if (!token) {
        window.location.href = "login.html";
        return;
    }
    if (name) {
        document.getElementById("displayUserName").innerText = name;
        document.getElementById("sidebarUserName").innerText = name;
        document.getElementById("avatarUserInitial").innerText = name.charAt(0).toUpperCase();
    }
    initLocalStorageData();
};

function toggleSummarize() {
    isSummarize = !isSummarize;
    const statusText = document.getElementById("sumStatus");
    const dotElement = document.getElementById("sumDot");
    const btn = document.getElementById("sumBtn");

    if (isSummarize) {
        statusText.innerText = "ON";
        statusText.className = "font-bold text-indigo-400";
        dotElement.className = "w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse";
        btn.classList.add("border-indigo-500/40", "bg-indigo-500/5");
    } else {
        statusText.innerText = "OFF";
        statusText.className = "font-bold text-gray-400";
        dotElement.className = "w-1.5 h-1.5 rounded-full bg-gray-400";
        btn.classList.remove("border-indigo-500/40", "bg-indigo-500/5");
    }
}

function updateFileStatus() {
    const files = document.getElementById("fileInput").files;
    document.getElementById("fileCount").innerText = files.length > 0 
        ? `•  ${files.length} ready` 
        : "";
}

function cleanAndParseMarkdown(text) {
    let rawHtml = marked.parse(text);
    const container = document.createElement('div');
    container.innerHTML = rawHtml;

    const preBlocks = container.querySelectorAll('pre');
    preBlocks.forEach((pre) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper';
        
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-code-btn';
        copyBtn.innerHTML = '<i class="fa-regular fa-copy mr-1"></i> Copy';
        
        copyBtn.onclick = () => {
            const codeText = pre.querySelector('code')?.innerText || pre.innerText;
            navigator.clipboard.writeText(codeText).then(() => {
                copyBtn.innerHTML = '<i class="fa-solid fa-check text-emerald-400 mr-1"></i> Copied';
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fa-regular fa-copy mr-1"></i> Copy';
                }, 2000);
            });
        };

        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);
        wrapper.appendChild(copyBtn);
    });

    return container.innerHTML;
}

// ASYMMETRIC LOG STRUCTURE INTERFACE BUBBLE COMPONENT ENGINE
function renderMessageBubble(text, isUser, shouldAppendToStorage = true) {
    if (welcomeScreen && welcomeScreen.style.display !== "none") {
        welcomeScreen.style.display = "none";
    }

    const div = document.createElement("div");
    div.className = `flex gap-3 items-start animate-msg w-full ${isUser ? "justify-end" : "justify-start"}`;

    const userInitial = document.getElementById("avatarUserInitial").innerText || "U";

    const avatarHtml = isUser 
        ? `<div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold font-mono text-[10px] order-2 shadow-sm shrink-0">${userInitial}</div>`
        : `<div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white order-1 shadow shadow-indigo-500/20 shrink-0"><i class="fa-solid fa-brain text-[10px]"></i></div>`;

    const messagePayload = `
        <div class="${isUser ? "order-1" : "order-2"} p-4 px-5 max-w-[80%] md:max-w-[75%] text-sm leading-relaxed shadow-sm relative ${isUser ? "user-bubble" : "ai-bubble break-words overflow-hidden"}>
            <div class="message-content-payload">${isUser ? escapeHtml(text) : cleanAndParseMarkdown(text)}</div>
        </div>
    `;

    div.innerHTML = isUser ? (messagePayload + avatarHtml) : (avatarHtml + messagePayload);
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;

    if (shouldAppendToStorage && activeThreadId) {
        const curThread = chatThreads.find(t => t.id === activeThreadId);
        if (curThread) {
            curThread.messages.push({ isUser, text });
            if (isUser && curThread.messages.length === 1) {
                curThread.title = text.length > 24 ? text.substring(0, 24) + "..." : text;
                renderSidebarItems();
            }
            saveStateToDisk();
        }
    }

    return div.querySelector(".message-content-payload");
}

function showTypingIndicator() {
    const div = document.createElement("div");
    div.id = "edithTypingIndicator";
    div.className = "flex justify-start items-start gap-3 animate-msg";
    div.innerHTML = `
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow shrink-0"><i class="fa-solid fa-brain text-[10px]"></i></div>
        <div class="p-4 px-5 ai-bubble flex items-center gap-1.5 shadow-sm">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
        </div>
    `;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTypingIndicator() {
    const indicator = document.getElementById("edithTypingIndicator");
    if (indicator) indicator.remove();
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function abortStreaming() {
    if (currentAbortController) {
        currentAbortController.abort();
        removeTypingIndicator();
        document.getElementById("runtimeControls").classList.add("hidden");
    }
}

async function regenerateLastResponse() {
    if (!activeThreadId) return;
    const curThread = chatThreads.find(t => t.id === activeThreadId);
    if (!curThread || curThread.messages.length === 0) return;

    const lastMsg = curThread.messages[curThread.messages.length - 1];
    if (!lastMsg.isUser) {
        curThread.messages.pop();
        saveStateToDisk();
    }

    if (curThread.messages.length > 0) {
        const lastUserMsg = curThread.messages[curThread.messages.length - 1];
        if (lastUserMsg.isUser) {
            lastUserPromptBackup = lastUserMsg.text;
            reloadActiveChatViewport();
            await executeStreamPipeline(lastUserPromptBackup);
        }
    }
}

async function sendMsg() {
    const input = document.getElementById("msg");
    const fileInput = document.getElementById("fileInput");
    const message = input.value.trim();

    if (!message && fileInput.files.length === 0) return;

    lastUserPromptBackup = message; 
    renderMessageBubble(message || "Analyzing documents...", true);
    input.value = "";

    const cachedFiles = Array.from(fileInput.files);
    fileInput.value = "";
    document.getElementById("fileCount").innerText = "";

    await executeStreamPipeline(message, cachedFiles);
}

// ASYNC HIGH-PERFORMANCE DATA STREAM DISPATCH PIPELINE
async function executeStreamPipeline(textMsg, filesList = []) {
    const token = localStorage.getItem("token");
    const selectedModel = document.getElementById("modelSelector").value;

    const formData = new FormData();
    formData.append("message", textMsg);
    formData.append("isSummarize", isSummarize);
    formData.append("model", selectedModel);

    for (let file of filesList) {
        formData.append("files", file);
    }

    showTypingIndicator();
    document.getElementById("runtimeControls").classList.remove("hidden");
    document.getElementById("regenerateControlBox").classList.add("hidden");

    currentAbortController = new AbortController();

    try {
        const res = await fetch(`${API_BASE}/api/chat`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
            body: formData,
            signal: currentAbortController.signal
        });

        removeTypingIndicator();

        if (!res.ok) {
            const err = await res.text();
            renderMessageBubble("❌ " + err, false);
            document.getElementById("runtimeControls").classList.add("hidden");
            return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        
        const aiBubbleElement = renderMessageBubble("", false, false);
        let aiText = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            aiText += decoder.decode(value, { stream: true });
            aiBubbleElement.innerHTML = cleanAndParseMarkdown(aiText);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        if (activeThreadId) {
            const curThread = chatThreads.find(t => t.id === activeThreadId);
            if (curThread) {
                curThread.messages.push({ isUser: false, text: aiText });
                saveStateToDisk();
            }
        }

    } catch (err) {
        removeTypingIndicator();
        if (err.name === 'AbortError') {
            renderMessageBubble("⚡ Core Processing Pipeline Aborted By Operator Stack.", false);
        } else {
            console.error(err);
            renderMessageBubble("❌ Matrix Connection Interrupted (Server Failure)", false);
        }
    } finaly {
        document.getElementById("runtimeControls").classList.add("hidden");
        document.getElementById("regenerateControlBox").classList.remove("hidden");
        currentAbortController = null;
    }
}
</script>
