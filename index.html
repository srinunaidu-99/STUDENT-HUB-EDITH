<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDITH - Intelligence Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap');

        body {
            font-family: 'Geist', sans-serif;
            background-color: #09090b;
            overflow: hidden;
        }

        /* --- PRECISE MINIMALIST SCROLLBAR --- */
        .chat-container::-webkit-scrollbar, .sidebar-scroll::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        .chat-container::-webkit-scrollbar-track, .sidebar-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-container::-webkit-scrollbar-thumb, .sidebar-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
        }
        .chat-container::-webkit-scrollbar-thumb:hover, .sidebar-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(16, 185, 129, 0.4);
        }

        /* --- QUANTUM EMERALD ORB EFFECT --- */
        @keyframes matrixPulse {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.3));
            }
            50% {
                transform: scale(1.02);
                filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.5));
            }
        }
        .edith-orb {
            animation: matrixPulse 4s ease-in-out infinite;
            background: #10b981;
        }

        /* --- MICRO-TRANSITION SLIDE --- */
        @keyframes microSlide {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-msg {
            animation: microSlide 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Mic Pulsing Effect */
        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.3); }
            70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .mic-active {
            animation: micPulse 1.2s infinite;
            background-color: #ef4444 !important;
            color: #ffffff !important;
            border-color: #ef4444 !important;
        }

        /* --- EXTREMELY CLEAN FLAT MONOCHROME INTERFACE --- */
        .main-board {
            background: #09090b;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .ai-bubble {
            background: #18181b;
            border: 1px solid rgba(255, 255, 255, 0.03);
            color: #e4e4e7;
            border-radius: 8px;
        }
        .user-bubble {
            background: #27272a;
            color: #fafafa;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
        }

        /* --- SIDEBAR REFINEMENTS --- */
        .history-active {
            background: rgba(255, 255, 255, 0.03) !important;
            color: #10b981 !important;
            font-weight: 500 !important;
            border-right: 2px solid #10b981 !important;
            border-radius: 4px 0px 0px 4px !important;
        }

        /* Standalone Code Blocks styling */
        .code-block-wrapper {
            position: relative;
            margin: 14px 0;
            width: 100%;
        }
        pre {
            background: #040405 !important;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.02);
            max-width: 100%;
        }
        code {
            font-family: 'Geist Mono', monospace;
            color: #a1a1aa;
            font-size: 0.8rem;
            white-space: pre;
        }
        .copy-code-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #18181b;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            color: #71717a;
            cursor: pointer;
            transition: all 0.15s;
            z-index: 10;
        }
        .copy-code-btn:hover {
            background: rgba(16, 185, 129, 0.08);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.2);
        }

        /* --- TYPING MICRO INDICATOR --- */
        .typing-dot {
            animation: typingBounce 1.2s infinite ease-in-out both;
            width: 4px;
            height: 4px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0.4); opacity: 0.3; }
            40% { transform: scale(1.1); opacity: 1; }
        }

        .delete-chat-btn {
            opacity: 0;
            transition: all 0.1s ease;
        }
        .history-item-wrapper:hover .delete-chat-btn {
            opacity: 0.6;
        }
        .history-item-wrapper:hover .delete-chat-btn:hover {
            opacity: 1;
            color: #f43f5e;
        }
    </style>
</head>

<body class="text-zinc-400 min-h-screen flex items-center justify-center p-0 sm:p-4">

<div class="w-full max-w-[1400px] h-screen sm:h-[94vh] flex main-board sm:rounded-xl shadow-2xl relative overflow-hidden">
    
    <!-- LEFT NAVIGATION DESK -->
    <aside id="sidebarPanel" class="w-60 bg-[#0c0c0e] flex flex-col h-full hidden lg:flex border-r border-zinc-900 transition-all z-30">
        
        <div class="p-3 flex flex-col gap-1.5">
            <button onclick="createNewChatSession()" class="w-full flex items-center justify-between px-3 py-2 text-xs text-zinc-200 hover:bg-zinc-900 rounded-md transition-all font-medium bg-zinc-900/40 border border-zinc-800">
                <span class="flex items-center gap-2">
                    <i class="fa-regular fa-square-plus text-zinc-400 text-sm"></i> New Stream
                </span>
                <kbd class="text-[9px] bg-zinc-800 text-zinc-500 px-1 rounded border border-zinc-700 font-mono">N</kbd>
            </button>
            <div class="w-full relative mt-0.5">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-zinc-600 text-xs"></i>
                <input type="text" id="searchChatsInput" oninput="filterSidebarChats()" placeholder="Search node indexes..." class="w-full bg-transparent border border-zinc-900 focus:border-zinc-800 text-xs rounded-md pl-8 pr-3 py-1.5 outline-none text-zinc-300 placeholder-zinc-700">
            </div>
        </div>

        <div class="px-3 pt-2 pb-1 flex justify-between items-center">
            <span class="text-[9px] font-medium text-zinc-600 tracking-widest block uppercase">Registry Entries</span>
            <span class="text-[9px] font-mono text-zinc-700" id="sessionCounter">0/0</span>
        </div>

        <div id="historyLogContainer" class="flex-1 overflow-y-auto pl-2 pr-0 pb-4 space-y-0.5 sidebar-scroll">
            <div class="text-center py-8 text-[11px] text-zinc-700 font-mono tracking-tight">Syncing system tree...</div>
        </div>

        <!-- AUTHENTICATION FOOTER NODE -->
        <div class="p-3 border-t border-zinc-900 bg-[#09090b] flex items-center justify-between px-4">
            <div class="flex items-center gap-2.5">
                <div class="w-6 h-6 rounded bg-zinc-900 border border-zinc-800 flex items-center justify-center text-[10px] font-medium text-zinc-400 font-mono" id="profileBadge">
                    OP
                </div>
                <div>
                    <span class="block text-xs font-normal text-zinc-300 truncate max-w-[100px]" id="displayUserFooterName">Root</span>
                    <span class="block text-[8px] text-zinc-600 uppercase font-mono tracking-tighter">Secure Link</span>
                </div>
            </div>
            <button onclick="localStorage.clear(); window.location.href='login.html';" title="Terminate Session" class="text-zinc-600 hover:text-zinc-400 transition-all text-xs p-1">
                <i class="fa-solid fa-power-off"></i>
            </button>
        </div>
    </aside>

    <!-- RIGHT CORE INTERFACE LAYER -->
    <div class="flex-1 flex flex-col h-full relative overflow-hidden bg-transparent">
        
        <!-- STATUS MATRIX CONTROLLER -->
        <div class="p-3 border-b border-zinc-900 flex justify-between items-center bg-[#0c0c0e] px-6">
            <div class="flex items-center gap-3">
                <button onclick="toggleMobileSidebar()" class="lg:hidden w-7 h-7 border border-zinc-800 bg-transparent rounded-md flex items-center justify-center text-zinc-400">
                    <i class="fa-solid fa-bars text-xs"></i>
                </button>

                <div class="edith-orb w-5 h-5 rounded flex items-center justify-center text-slate-950 font-bold text-[10px]">
                    
                </div>
                <div>
                    <h1 class="text-xs font-medium tracking-tight text-zinc-200 flex items-center gap-2">
                        EDITH CORE <span class="text-[8px] font-mono text-zinc-500 border border-zinc-800 px-1 py-0.2 rounded bg-zinc-900">v3.2.0-STABLE</span>
                    </h1>
                </div>
            </div>
            
            <div class="flex items-center gap-4 text-right font-mono text-[10px]">
                <div>
                    <span class="text-zinc-600 block text-[8px] uppercase tracking-wider">Net Latency</span>
                    <span class="text-emerald-500">14ms</span>
                </div>
                <div class="w-px h-4 bg-zinc-800"></div>
                <div>
                    <span class="text-zinc-600 block text-[8px] uppercase tracking-wider">Cluster IO</span>
                    <span class="text-zinc-400">2.4%</span>
                </div>
            </div>
        </div>

        <!-- STREAM DISCHARGE CONTAINER -->
        <div id="chatArea" class="flex-1 overflow-y-auto p-6 space-y-4 bg-[#09090b] chat-container"></div>

        <!-- INPUT SEQUENCE PANEL -->
        <div class="p-4 bg-[#0c0c0e] border-t border-zinc-900">
            <div class="flex flex-wrap gap-1.5 mb-2.5 px-0.5">
                <button onclick="toggleSummarize()" id="sumBtn" class="px-2.5 py-1 rounded border border-zinc-900 hover:border-zinc-800 bg-transparent text-[9px] font-mono transition-all flex items-center gap-2 text-zinc-500">
                    <span class="w-1 h-1 rounded-full bg-zinc-700" id="sumDot"></span>
                    COMPRESS LOG DATA: <span id="sumStatus" class="font-medium text-zinc-600">OFF</span>
                </button>

                <label class="px-2.5 py-1 rounded border border-zinc-900 hover:border-zinc-800 bg-transparent text-[9px] font-mono cursor-pointer transition-all flex items-center gap-1.5 text-zinc-500">
                    <i class="fa-solid fa-paperclip text-zinc-600"></i> ATTACH MATRIX
                    <input type="file" id="fileInput" multiple class="hidden" onchange="updateFileStatus()" />
                </label>
                <span id="fileCount" class="text-[9px] text-emerald-500 self-center font-mono"></span>
            </div>

            <div class="flex gap-2 items-center relative">
                <input type="text" id="msg" placeholder="Execute terminal command prompt sequencers..." 
                    class="w-full bg-[#141416] border border-zinc-900 focus:border-zinc-800 rounded-md pl-4 pr-20 py-2.5 outline-none transition-all text-xs font-mono placeholder-zinc-700 text-zinc-200"
                    onkeypress="if(event.key==='Enter')sendMsg()" />

                <div class="absolute right-1 flex items-center gap-0.5">
                    <button onclick="toggleVoiceInput()" id="micBtn" title="Voice Decryptor"
                        class="w-7 h-7 bg-transparent hover:bg-zinc-900 border border-zinc-900 text-zinc-500 rounded flex items-center justify-center transition-all">
                        <i class="fa-solid fa-microphone text-[10px]"></i>
                    </button>
                    
                    <button onclick="sendMsg()" class="w-7 h-7 bg-zinc-200 hover:bg-white active:scale-95 text-zinc-950 rounded flex items-center justify-center transition-all">
                        <i class="fa-solid fa-arrow-up text-xs"></i>
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
const API_BASE = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
    ? "http://localhost:5000"
    : "https://student-hub-edith-backend.onrender.com";

const chatArea = document.getElementById("chatArea");
const historyLogContainer = document.getElementById("historyLogContainer");
let isSummarize = false;
let currentActiveSessionId = null; 
let globallyCachedHistoryTree = []; 

let recognition;
let isRecording = false;

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    recognition.onstart = () => {
        isRecording = true;
        document.getElementById("micBtn").classList.add("mic-active");
        document.getElementById("msg").placeholder = "Streaming audio input sequence...";
    };

    recognition.onend = () => {
        isRecording = false;
        document.getElementById("micBtn").classList.remove("mic-active");
        document.getElementById("msg").placeholder = "Execute terminal command prompt sequencers...";
    };

    recognition.onresult = (event) => {
        document.getElementById("msg").value = event.results[0][0].transcript;
    };
}

function toggleVoiceInput() {
    if (!recognition) {
        alert("Audio matrix layer unsupported on this node browser config.");
        return;
    }
    if (isRecording) recognition.stop();
    else recognition.start();
}

window.onload = () => {
    const token = localStorage.getItem("token");
    const name = localStorage.getItem("userName") || "Root";

    if (!token) {
        window.location.href = "login.html";
        return;
    }
    
    document.getElementById("displayUserFooterName").innerText = name;
    document.getElementById("profileBadge").innerText = name.substring(0, 2).toUpperCase();
    
    renderBlankWelcomeInterface();
    loadChatHistory(true); 
};

function renderBlankWelcomeInterface() {
    chatArea.innerHTML = `
        <div id="welcomeScreen" class="flex flex-col justify-center items-center mt-24 text-center px-4 animate-msg">
            <div class="w-8 h-8 rounded bg-zinc-900 border border-zinc-800 flex items-center justify-center text-xs text-emerald-500 mb-3 font-mono">
                &gt;_
            </div>
            <h2 class="text-xs font-mono font-medium mb-1 text-zinc-200">Awaiting Pipeline Instructions</h2>
            <p class="text-zinc-600 text-[11px] max-w-xs font-normal leading-relaxed">System terminal calibrated. Ready to process multi-tenant raw data assets and standalone logic execution.</p>
        </div>
    `;
}

async function loadChatHistory(autoLoadFirstSession = false) {
    const token = localStorage.getItem("token");
    if(!token) return;

    try {
        const response = await fetch(`${API_BASE}/api/history`, {
            method: "GET",
            headers: { 
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            }
        });

        if (response.ok) {
            globallyCachedHistoryTree = await response.json();
            renderSidebarHistoryList(globallyCachedHistoryTree);
            
            if (autoLoadFirstSession && globallyCachedHistoryTree.length > 0) {
                loadSelectedSessionStream(globallyCachedHistoryTree[0]._id);
            }
        } else {
            historyLogContainer.innerHTML = `<div class="text-center py-8 text-[10px] font-mono text-zinc-700">Log entries empty</div>`;
        }
    } catch (err) {
        console.error("History sync error:", err);
        historyLogContainer.innerHTML = `<div class="text-center py-6 text-[10px] font-mono text-red-900/60">Registry Sync Fault</div>`;
    }
}

function renderSidebarHistoryList(historyArray) {
    const counter = document.getElementById("sessionCounter");
    if (!historyArray || historyArray.length === 0) {
        historyLogContainer.innerHTML = `<div class="text-center py-8 text-[10px] font-mono text-zinc-700">Log entries empty</div>`;
        if(counter) counter.innerText = "0/0";
        return;
    }
    historyLogContainer.innerHTML = "";
    if(counter) counter.innerText = `${historyArray.length}/${historyArray.length}`;
    
    historyArray.forEach((session) => {
        if (!session) return;
        const id = session._id;
        let displayTitle = "Blank Layer Sequence";
        
        if (session.messages && session.messages.length > 0 && session.messages[0]) {
            displayTitle = session.messages[0].content || "Empty Segment Object";
        } else if (session.title) {
            displayTitle = session.title;
        }
        
        if (displayTitle.length > 24) {
            displayTitle = displayTitle.substring(0, 24) + "...";
        }

        const itemWrapper = document.createElement("div");
        itemWrapper.className = "flex items-center justify-between w-full relative group history-item-wrapper rounded-l-md transition-all pr-1 hover:bg-zinc-900/40";

        const btn = document.createElement("button");
        btn.id = `sidebar-session-${id}`;
        btn.onclick = () => loadSelectedSessionStream(id);
        
        const activeClass = (String(id) === String(currentActiveSessionId)) ? 'history-active' : '';
        btn.className = `flex-1 text-left px-3 py-1.5 text-[11px] tracking-tight font-normal transition-all overflow-hidden text-ellipsis whitespace-nowrap block truncate text-zinc-500 rounded-l-md ${activeClass}`;
        btn.innerText = displayTitle;

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-chat-btn text-zinc-700 p-1 text-[10px] rounded transition-all ml-1";
        deleteBtn.innerHTML = `<i class="fa-regular fa-trash-can"></i>`;
        deleteBtn.onclick = (e) => {
            e.stopPropagation(); 
            deleteChatSessionFromServer(id);
        };

        itemWrapper.appendChild(btn);
        itemWrapper.appendChild(deleteBtn);
        historyLogContainer.appendChild(itemWrapper);
    });
}

async function deleteChatSessionFromServer(sessionId) {
    if (!confirm("Confirm hard purge on this memory segment?")) return;
    
    const token = localStorage.getItem("token");
    try {
        const res = await fetch(`${API_BASE}/api/chat/${sessionId}`, {
            method: "DELETE",
            headers: { "Authorization": `Bearer ${token}` }
        });

        if (res.ok) {
            if (String(currentActiveSessionId) === String(sessionId)) {
                currentActiveSessionId = null;
                renderBlankWelcomeInterface();
            }
            await silentRefreshHistoryTree();
        } else {
            alert("Matrix layer deletion denied by core.");
        }
    } catch (err) {
        console.error("Purge failure:", err);
        alert("Pipeline network dropped during segment wipe.");
    }
}

function loadSelectedSessionStream(sessionId) {
    if (!sessionId) return;
    currentActiveSessionId = sessionId;
    
    const blocks = historyLogContainer.querySelectorAll("button");
    blocks.forEach(b => b.classList.remove("history-active"));
    
    const targetedActiveBtn = document.getElementById(`sidebar-session-${sessionId}`);
    if (targetedActiveBtn) targetedActiveBtn.classList.add("history-active");

    const targetedSession = globallyCachedHistoryTree.find(s => String(s._id) === String(sessionId));
    chatArea.innerHTML = "";

    if (targetedSession && Array.isArray(targetedSession.messages)) {
        if (targetedSession.messages.length === 0) {
            renderBlankWelcomeInterface();
            return;
        }
        targetedSession.messages.forEach(msg => {
            if(msg && msg.content) {
                appendMessageToUI(msg.content, String(msg.role).toLowerCase() === "user");
            }
        });
        chatArea.scrollTop = chatArea.scrollHeight;
    }
}

function createNewChatSession() {
    currentActiveSessionId = null; 
    const blocks = historyLogContainer.querySelectorAll("button");
    blocks.forEach(b => b.classList.remove("history-active"));
    renderBlankWelcomeInterface();
    document.getElementById("msg").focus();
}

function filterSidebarChats() {
    const query = document.getElementById("searchChatsInput").value.toLowerCase();
    const filtered = globallyCachedHistoryTree.filter(s => {
        const title = s.messages?.[0]?.content || s.title || "";
        return title.toLowerCase().includes(query);
    });
    renderSidebarHistoryList(filtered);
}

async function sendMsg() {
    const input = document.getElementById("msg");
    const fileInput = document.getElementById("fileInput");
    const message = input.value.trim();
    const token = localStorage.getItem("token");

    if (!message && fileInput.files.length === 0) return;

    appendMessageToUI(message || "Processing stream vector...", true);
    input.value = "";

    const formData = new FormData();
    formData.append("message", message);
    formData.append("isSummarize", isSummarize);
    if (currentActiveSessionId) formData.append("sessionId", currentActiveSessionId);

    for (let file of fileInput.files) {
        formData.append("files", file);
    }

    showTypingIndicator();

    try {
        const res = await fetch(`${API_BASE}/api/chat`, {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}` },
            body: formData
        });

        removeTypingIndicator();

        if (!res.ok) {
            appendMessageToUI("❌ Core interface logic failure response.", false);
            return;
        }

        const incomingSessionId = res.headers.get("X-Session-Id");
        if (incomingSessionId && !currentActiveSessionId) {
            currentActiveSessionId = incomingSessionId;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        const aiBubble = appendMessageToUI("", false);
        let accumulatedText = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value, { stream: true });
            accumulatedText += chunk;
            
            aiBubble.innerHTML = cleanAndParseMarkdown(accumulatedText);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        await silentRefreshHistoryTree();

        if (isSummarize) {
            isSummarize = false;
            updateSummarizeUI();
        }

    } catch (err) {
        removeTypingIndicator();
        appendMessageToUI("❌ Disconnect within pipeline stream routing.", false);
    }

    fileInput.value = "";
    document.getElementById("fileCount").innerText = "";
}

async function silentRefreshHistoryTree() {
    const token = localStorage.getItem("token");
    try {
        const response = await fetch(`${API_BASE}/api/history`, {
            method: "GET",
            headers: { "Authorization": `Bearer ${token}` }
        });
        if (response.ok) {
            globallyCachedHistoryTree = await response.json();
            renderSidebarHistoryList(globallyCachedHistoryTree);
            
            if (currentActiveSessionId) {
                const activeBtn = document.getElementById(`sidebar-session-${currentActiveSessionId}`);
                if (activeBtn) activeBtn.classList.add("history-active");
            }
        }
    } catch (e) {}
}

function appendMessageToUI(text, isUser) {
    const internalWelcome = document.getElementById("welcomeScreen");
    if (internalWelcome) internalWelcome.remove();

    const div = document.createElement("div");
    div.className = `flex ${isUser ? "justify-end" : "justify-start"} animate-msg w-full`;

    div.innerHTML = `
        <div class="p-3 px-3.5 max-w-[85%] text-xs leading-relaxed ${isUser ? "user-bubble" : "ai-bubble break-words overflow-hidden"}">
            ${isUser ? escapeHtml(text) : cleanAndParseMarkdown(text)}
        </div>
    `;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div.querySelector("div");
}

function cleanAndParseMarkdown(text) {
    if (!text) return "";
    let rawHtml = marked.parse(text);
    const container = document.createElement('div');
    container.innerHTML = rawHtml;

    container.querySelectorAll('pre').forEach((pre) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper';
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-code-btn';
        copyBtn.innerHTML = 'Copy';
        
        copyBtn.onclick = () => {
            navigator.clipboard.writeText(pre.querySelector('code')?.innerText || pre.innerText).then(() => {
                copyBtn.innerHTML = 'Copied';
                setTimeout(() => { copyBtn.innerHTML = 'Copy'; }, 2000);
            });
        };
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);
        wrapper.appendChild(copyBtn);
    });
    return container.innerHTML;
}

function showTypingIndicator() {
    const div = document.createElement("div");
    div.id = "edithTypingIndicator";
    div.className = "flex justify-start animate-msg";
    div.innerHTML = `<div class="p-2.5 px-3.5 ai-bubble flex items-center gap-1"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTypingIndicator() {
    const ind = document.getElementById("edithTypingIndicator");
    if (ind) ind.remove();
}

function toggleSummarize() { isSummarize = !isSummarize; updateSummarizeUI(); }
function updateSummarizeUI() {
    const statusText = document.getElementById("sumStatus");
    const dotElement = document.getElementById("sumDot");
    const btn = document.getElementById("sumBtn");
    statusText.innerText = isSummarize ? "ON" : "OFF";
    statusText.className = isSummarize ? "font-medium text-emerald-500" : "font-medium text-zinc-600";
    dotElement.className = isSummarize ? "w-1 h-1 rounded-full bg-emerald-500" : "w-1 h-1 rounded-full bg-zinc-700";
    if (isSummarize) btn.classList.add("border-zinc-800", "bg-zinc-900/30"); else btn.classList.remove("border-zinc-800", "bg-zinc-900/30");
}

function updateFileStatus() {
    const files = document.getElementById("fileInput").files;
    document.getElementById("fileCount").innerText = files.length > 0 ? `[+${files.length} ASSETS]` : "";
}

function toggleMobileSidebar() {
    const sidebar = document.getElementById("sidebarPanel");
    sidebar.classList.toggle("hidden");
    if (!sidebar.classList.contains("hidden")) {
        sidebar.classList.add("fixed", "inset-y-0", "left-0", "w-60", "z-50", "bg-[#0c0c0e]");
    }
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
</script>

</body>
</html>
