<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDITH - Intelligence Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #030712 70%);
            overflow: hidden;
            height: 100vh;
        }

        .chat-container::-webkit-scrollbar, .history-container::-webkit-scrollbar { width: 4px; }
        .chat-container::-webkit-scrollbar-thumb, .history-container::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.2); border-radius: 10px; }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px 2px rgba(99, 102, 241, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px 5px rgba(168, 85, 247, 0.4); }
        }
        .edith-orb { animation: pulseGlow 4s ease-in-out infinite; background: linear-gradient(135deg, #6366f1, #a855f7); }

        .glass-panel { background: rgba(10, 11, 23, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .ai-bubble { background: rgba(23, 24, 51, 0.6); border: 1px solid rgba(99, 102, 241, 0.2); color: #f3f4f6; border-radius: 18px 18px 18px 4px; position: relative; }
        .user-bubble { background: linear-gradient(135deg, #4f46e5, #3730a3); color: white; border-radius: 18px 18px 4px 18px; }
        
        .history-item { transition: all 0.2s; border-left: 2px solid transparent; }
        .history-item:hover { background: rgba(99, 102, 241, 0.1); border-left: 2px solid #6366f1; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-msg { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>

<body class="text-gray-100 flex items-center justify-center">

<div class="w-full h-full flex flex-row overflow-hidden">
    
    <div class="flex-1 flex flex-col relative h-full">
        <div class="p-4 border-b border-white/5 flex justify-between items-center bg-gray-950/40 px-6 backdrop-blur-md">
            <div class="flex items-center gap-3">
                <div class="edith-orb w-9 h-9 rounded-lg flex items-center justify-center text-white font-bold shadow-lg">E</div>
                <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-white to-indigo-300 bg-clip-text text-transparent">EDITH <span class="text-[10px] text-indigo-400 font-mono tracking-tighter">OS V3.5</span></h1>
            </div>
            
            <div class="flex items-center gap-3">
                <div id="voiceStatus" class="hidden text-[10px] text-indigo-400 font-mono animate-pulse mr-2">VOICE FEED ACTIVE</div>
                <button onclick="newChat()" class="px-4 py-1.5 bg-indigo-600/20 hover:bg-indigo-600/40 border border-indigo-500/30 rounded-full text-xs font-bold transition-all flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> NEW SESSION
                </button>
            </div>
        </div>

        <div id="chatArea" class="flex-1 overflow-y-auto p-6 space-y-6 chat-container pb-32">
            <div id="welcomeScreen" class="flex flex-col justify-center items-center mt-32 text-center">
                <div class="edith-orb w-16 h-16 rounded-2xl flex items-center justify-center text-2xl text-white mb-6">
                    <i class="fa-solid fa-terminal"></i>
                </div>
                <h2 class="text-xl font-bold mb-2">Interface Initialized</h2>
                <p class="text-gray-500 text-xs tracking-widest uppercase">Global Language: English | System Ready</p>
            </div>
        </div>

        <div class="absolute bottom-0 w-full p-4 sm:p-6 bg-gradient-to-t from-gray-950 via-gray-950/90 to-transparent">
            <div class="max-w-4xl mx-auto">
                <div class="flex flex-wrap gap-2 mb-3 px-1">
                    <button onclick="toggleSummarize()" id="sumBtn" class="px-3 py-1 rounded-md border border-white/10 bg-white/5 text-[10px] font-medium transition-all flex items-center gap-2">
                        <span class="w-1.5 h-1.5 rounded-full bg-gray-500" id="sumDot"></span> SUMMARIZE: <span id="sumStatus" class="text-gray-400">OFF</span>
                    </button>
                    <label class="px-3 py-1 rounded-md border border-white/10 bg-white/5 text-[10px] font-medium cursor-pointer flex items-center gap-1.5">
                        <i class="fa-solid fa-link text-indigo-400"></i> ATTACH <input type="file" id="fileInput" multiple class="hidden" onchange="updateFileStatus()" />
                    </label>
                    <span id="fileCount" class="text-[10px] text-indigo-300 self-center"></span>
                </div>

                <div class="flex gap-3 items-center glass-panel p-2 rounded-2xl border-white/10 shadow-2xl">
                    <input type="text" id="msg" placeholder="Command EDITH..." class="flex-1 bg-transparent pl-4 py-3 outline-none text-sm text-gray-100" onkeypress="if(event.key==='Enter')sendMsg()" />
                    <button onclick="toggleVoiceInput()" id="micBtn" class="w-10 h-10 text-gray-400 hover:text-indigo-400 transition-colors">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <button onclick="sendMsg()" class="w-10 h-10 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl flex items-center justify-center transition-all">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="hidden lg:flex w-72 border-l border-white/5 bg-gray-950/60 flex-col backdrop-blur-xl">
        <div class="p-5 border-b border-white/5">
            <h3 class="text-xs font-bold tracking-widest text-indigo-400 uppercase">Recent Logs</h3>
        </div>
        <div id="historyList" class="flex-1 overflow-y-auto p-2 history-container">
            </div>
        <div class="p-4">
            <button onclick="clearHistory()" class="w-full py-2 text-[10px] border border-white/5 text-gray-500 hover:text-white hover:bg-red-500/10 hover:border-red-500/20 rounded-lg transition-all">
                WIPE SESSION LOGS
            </button>
        </div>
    </div>
</div>

<script>
const API_BASE = window.location.hostname === "127.0.0.1" ? "http://localhost:5000" : "https://student-hub-edith-backend.onrender.com";
const chatArea = document.getElementById("chatArea");
const historyList = document.getElementById("historyList");
const welcomeScreen = document.getElementById("welcomeScreen");
let isSummarize = false;

// --- LOGS MANAGEMENT ---
function saveToLogs(text, isUser) {
    if(!isUser) return;
    let logs = JSON.parse(localStorage.getItem("edith_logs") || "[]");
    const title = text.length > 25 ? text.substring(0, 25) + "..." : text;
    logs.unshift({ title, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
    if(logs.length > 20) logs.pop();
    localStorage.setItem("edith_logs", JSON.stringify(logs));
    updateLogsUI();
}

function updateLogsUI() {
    let logs = JSON.parse(localStorage.getItem("edith_logs") || "[]");
    historyList.innerHTML = logs.map(item => `
        <div class="history-item p-3 mb-1 rounded-lg">
            <p class="text-[11px] text-gray-300 font-medium truncate">${item.title}</p>
            <span class="text-[9px] text-gray-600 font-mono">${item.time}</span>
        </div>
    `).join('');
}

function newChat() {
    chatArea.innerHTML = '';
    chatArea.appendChild(welcomeScreen);
    welcomeScreen.style.display = 'flex';
}

function clearHistory() {
    localStorage.removeItem("edith_logs");
    updateLogsUI();
    newChat();
}

// --- VOICE (MANUAL TRIGGER) ---
function speakText(text) {
    window.speechSynthesis.cancel();
    const cleanText = text.replace(/[#*`_~]/g, '').trim();
    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = 'en-US'; // Strict English
    utterance.rate = 1.0;
    utterance.onstart = () => document.getElementById("voiceStatus").classList.remove("hidden");
    utterance.onend = () => document.getElementById("voiceStatus").classList.add("hidden");
    window.speechSynthesis.speak(utterance);
}

// --- VOICE INPUT ---
let recognition;
if ('webkitSpeechRecognition' in window) {
    recognition = new webkitSpeechRecognition();
    recognition.lang = 'en-US';
    recognition.onresult = (e) => document.getElementById("msg").value = e.results[0][0].transcript;
}

function toggleVoiceInput() {
    if (!recognition) return alert("System Mic Unsupported");
    recognition.start();
}

// --- RENDERING ---
function renderMessage(text, isUser) {
    if (welcomeScreen) welcomeScreen.style.display = "none";
    const div = document.createElement("div");
    div.className = `flex ${isUser ? "justify-end" : "justify-start"} animate-msg w-full`;
    
    const content = isUser ? text : `
        <div class="relative group">
            ${marked.parse(text)}
            <button onclick="speakText(this.parentElement.dataset.full)" class="absolute -right-8 bottom-0 opacity-0 group-hover:opacity-100 text-indigo-400 hover:text-white transition-all p-1">
                <i class="fa-solid fa-volume-high text-xs"></i>
            </button>
        </div>`;

    const bubble = document.createElement("div");
    bubble.className = `p-4 px-5 max-w-[85%] text-sm leading-relaxed ${isUser ? "user-bubble" : "ai-bubble"}`;
    bubble.innerHTML = content;
    
    if(!isUser) bubble.querySelector('.relative').dataset.full = text;

    div.appendChild(bubble);
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
}

// --- CORE DISPATCH ---
async function sendMsg() {
    const input = document.getElementById("msg");
    const fileInput = document.getElementById("fileInput");
    const message = input.value.trim();
    const token = localStorage.getItem("token");

    if (!message && fileInput.files.length === 0) return;

    saveToLogs(message, true);
    renderMessage(message || "Analyzing input stream...", true);
    input.value = "";

    const formData = new FormData();
    formData.append("message", message);
    formData.append("isSummarize", isSummarize);
    for (let f of fileInput.files) formData.append("files", f);

    try {
        const res = await fetch(`${API_BASE}/api/chat`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
            body: formData
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        
        // Setup AI bubble for streaming
        if (welcomeScreen) welcomeScreen.style.display = "none";
        const div = document.createElement("div");
        div.className = "flex justify-start animate-msg w-full";
        const bubble = document.createElement("div");
        bubble.className = "p-4 px-5 max-w-[85%] text-sm leading-relaxed ai-bubble";
        bubble.innerHTML = `<div class="relative group"><div class="stream-box"></div><button class="absolute -right-8 bottom-0 opacity-0 group-hover:opacity-100 text-indigo-400 p-1"><i class="fa-solid fa-volume-high text-xs"></i></button></div>`;
        div.appendChild(bubble);
        chatArea.appendChild(div);
        
        const streamBox = bubble.querySelector('.stream-box');
        const volBtn = bubble.querySelector('button');
        let aiText = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            aiText += decoder.decode(value, { stream: true });
            streamBox.innerHTML = marked.parse(aiText);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        bubble.querySelector('.relative').dataset.full = aiText;
        volBtn.onclick = () => speakText(aiText);

    } catch (err) {
        renderMessage("CONNECTION ERROR: Unable to reach core.", false);
    }
}

function toggleSummarize() {
    isSummarize = !isSummarize;
    document.getElementById("sumStatus").innerText = isSummarize ? "ON" : "OFF";
    document.getElementById("sumDot").className = isSummarize ? "w-1.5 h-1.5 rounded-full bg-indigo-400" : "w-1.5 h-1.5 rounded-full bg-gray-500";
}

function updateFileStatus() {
    const files = document.getElementById("fileInput").files;
    document.getElementById("fileCount").innerText = files.length > 0 ? `• ${files.length} ready` : "";
}

window.onload = () => {
    if (!localStorage.getItem("token")) window.location.href = "login.html";
    updateLogsUI();
};
</script>
</body>
</html>
