    <style>

        @keyframes bouncePoint { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }

<script>
const API_URL = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
    ? "http://localhost:5000"
    : "https://student-hub-edith-backend.onrender.com";

const chatWindow = document.getElementById("chatWindow");
const chatHistoryList = document.getElementById("chatHistoryList");
const activeChatTitleHeader = document.getElementById("activeChatTitleHeader");

let currentSessionId = null; 
let cachedSessionsList = []; 
let voiceRecognitionInstance = null;
let isVoiceRecording = false;
let isSummarizeActive = false;
let localMediaStream = null;
let capturedCameraFiles = []; 

function initDashboardTheme() {
    const activeTheme = localStorage.getItem('edith-theme') || 'dark';
    document.documentElement.classList.toggle('dark', activeTheme === 'dark');
    const themeToggleIcon = document.getElementById("themeToggleIcon");
    themeToggleIcon.className = activeTheme === 'dark' ? "fa-solid fa-sun text-xs text-amber-400" : "fa-solid fa-moon text-xs text-slate-500";
}

function switchDashboardTheme() {
    localStorage.setItem('edith-theme', document.documentElement.classList.contains('dark') ? 'light' : 'dark');
    initDashboardTheme();
}
initDashboardTheme();

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechLib = window.SpeechRecognition || window.webkitSpeechRecognition;
    voiceRecognitionInstance = new SpeechLib();
    voiceRecognitionInstance.onstart = () => { isVoiceRecording = true; document.getElementById("speechBtn").classList.add("text-brand-500", "animate-pulse"); };
    voiceRecognitionInstance.onend = () => { isVoiceRecording = false; document.getElementById("speechBtn").classList.remove("text-brand-500", "animate-pulse"); };
    voiceRecognitionInstance.onresult = (e) => { document.getElementById("userInputText").value = e.results[0][0].transcript; };
}

function toggleSpeech() { if (!voiceRecognitionInstance) return alert("Biometric speech streaming is unsupported by this browser environment."); isVoiceRecording ? voiceRecognitionInstance.stop() : voiceRecognitionInstance.start(); }
function toggleSidebar(open) { document.getElementById("sidebar").classList.toggle("-translate-x-full", !open); document.getElementById("sidebarOverlay").classList.toggle("hidden", !open); }

function toggleSummarizeMode() {
    isSummarizeActive = !isSummarizeActive;
    const badge = document.getElementById("summarizeBadge");
    badge.textContent = isSummarizeActive ? "ACTIVE" : "STANDBY";
    badge.className = isSummarizeActive ? "text-brand-500 font-semibold" : "text-slate-400";
}

/* Vault Storage Systems Subsystems Framework */
function toggleDigitalVaultView(forceShow = null) {
    const drawer = document.getElementById("digitalVaultDrawer");
    if (forceShow !== null) {
        forceShow ? drawer.classList.remove("hidden") : drawer.classList.add("hidden");
    } else {
        drawer.classList.toggle("hidden");
    }
    renderDigitalVaultItems();
}

function fetchDigitalVaultData() {
    return JSON.parse(localStorage.getItem("edith_vault_notes") || "[]");
}

function pushItemToVault(title, rawContent) {
    const records = fetchDigitalVaultData();
    records.unshift({
        id: "vault-" + Date.now(),
        title: title || "Compiled Core Directive",
        timestamp: new Date().toLocaleString(),
        body: rawContent
    });
    localStorage.setItem("edith_vault_notes", JSON.stringify(records));
    updateVaultInterfaceBadge();
}

function updateVaultInterfaceBadge() {
    const records = fetchDigitalVaultData();
    document.getElementById("vaultItemsBadge").textContent = records.length;
}

function clearDigitalVaultStorage() {
    if(confirm("Wipe all assets from the Vault node storage configuration?")) {
        localStorage.removeItem("edith_vault_notes");
        updateVaultInterfaceBadge();
        renderDigitalVaultItems();
    }
}

function renderDigitalVaultItems() {
    const container = document.getElementById("vaultItemsContainer");
    const items = fetchDigitalVaultData();
    container.innerHTML = "";
    
    if(items.length === 0) {
        container.innerHTML = `<div class='text-xs text-slate-400 py-3 text-center font-mono'>// Storage container isolation empty.</div>`;
        return;
    }
    
    items.forEach(item => {
        const row = document.createElement("div");
        row.className = "p-2.5 bg-white dark:bg-slate-900 border dark:border-matrix-border border-slate-200 rounded-lg flex items-center justify-between gap-4";
        row.innerHTML = `
            <div class="overflow-hidden">
                <h5 class="text-xs font-semibold text-slate-800 dark:text-zinc-200 truncate">${item.title}</h5>
                <span class="text-[10px] text-slate-400 font-mono">${item.timestamp}</span>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button onclick="downloadCustomNotesPdf(\`${encodeURIComponent(item.title)}\`, \`${encodeURIComponent(item.body)}\`)" class="px-2 py-1 text-[10px] font-semibold bg-brand-500/10 hover:bg-brand-500 text-brand-500 hover:text-white rounded transition-all">Export PDF</button>
            </div>
        `;
        container.appendChild(row);
    });
}

/* Beautiful Paper-Style Academic PDF Framework Engine */
function downloadCustomNotesPdf(encodedTitle, encodedContent) {
    const title = decodeURIComponent(encodedTitle);
    const bodyMarkdown = decodeURIComponent(encodedContent);
    
    const wrapper = document.createElement("div");
    wrapper.className = "pdf-notes-container";
    
    let contentHtml = marked.parse(bodyMarkdown);
    
    wrapper.innerHTML = `
        <div class="pdf-notes-header">
            <h1 class="pdf-notes-title">${title}</h1>
            <div class="pdf-meta-tag">EDITH Automated Syllabus Notes Framework &bull; Chrono Dynamic Generation</div>
        </div>
        <div class="pdf-body-text">
            ${contentHtml}
        </div>
        <div class="pdf-footer-branding">
            &copy; 2026 EDITH Intelligence Core &bull; Confidential Distributed Data Nodes
        </div>
    `;

    wrapper.querySelectorAll("h1, h2, h3").forEach(header => {
        header.style.color = "#4f46e5";
        header.style.marginTop = "20px";
        header.style.marginBottom = "10px";
        header.style.fontWeight = "bold";
    });
    
    wrapper.querySelectorAll("p").forEach(p => {
        p.style.marginBottom = "12px";
        p.style.fontSize = "13px";
        p.style.lineHeight = "1.6";
        p.style.color = "#334155";
    });

    const options = {
        margin: [15, 15, 20, 15],
        filename: `${title.replace(/\s+/g, '-').toLowerCase()}-notes.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, letterRendering: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
    };

    html2pdf().from(wrapper).set(options).save();
}

/* Native Camera Handling Subroutines */
async function openCameraSensor() {
    try {
        localMediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        const videoFeed = document.getElementById("cameraVideoFeed");
        videoFeed.srcObject = localMediaStream;
        document.getElementById("cameraModal").classList.remove("hidden");
    } catch(err) {
        alert("Unable to map optical nodes. Ensure camera access permissions are enabled.");
    }
}

function closeCameraSensor() {
    if (localMediaStream) {
        localMediaStream.getTracks().forEach(track => track.stop());
    }
    document.getElementById("cameraModal").classList.add("hidden");
}

function captureCameraSnapshot() {
    const video = document.getElementById("cameraVideoFeed");
    const canvas = document.getElementById("cameraCanvasBuffer");
    const ctx = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    canvas.toBlob((blob) => {
        const frameFile = new File([blob], `Snapshot-${Date.now()}.jpg`, { type: "image/jpeg" });
        capturedCameraFiles.push(frameFile);
        updateInterfaceAttachmentLabels();
        closeCameraSensor();
    }, "image/jpeg", 0.85);
}

window.onload = () => {
    const userToken = localStorage.getItem("token");
    const accountName = localStorage.getItem("userName") || "Operator";
    if (!userToken) { window.location.href = "login.html"; return; }

    document.getElementById("userNameFooter").textContent = accountName;
    document.getElementById("userBadge").textContent = accountName.substring(0, 2).toUpperCase();
    marked.setOptions({ breaks: true, gfm: true });
    updateVaultInterfaceBadge();
    loadChatSessions(true);
};

async function apiCall(endpoint, config = {}) {
    const userToken = localStorage.getItem("token");
    const headers = { ...(config.headers || {}), "Authorization": `Bearer ${userToken}` };
    if (!(config.body instanceof FormData) && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
    
    const response = await fetch(`${API_URL}${endpoint}`, { ...config, headers });
    if (response.status === 401) { logoutSession(); return null; }
    return response;
}

function logoutSession() { localStorage.clear(); window.location.href = "login.html"; }

async function loadChatSessions(autoLoadFirst = false) {
    try {
        const response = await apiCall("/api/history");
        if (!response) return;
        cachedSessionsList = await response.json();
        renderSidebarList(cachedSessionsList);
        if (autoLoadFirst && cachedSessionsList.length > 0) selectSession(cachedSessionsList[0]._id);
        else if (cachedSessionsList.length === 0) showEmptyStateWelcome();
    } catch (err) { showEmptyStateWelcome(); }
}

function renderSidebarList(sessions) {
    chatHistoryList.innerHTML = "";
    document.getElementById("chatCounter").textContent = sessions.length;
    if (sessions.length === 0) {
        chatHistoryList.innerHTML = '<div class="text-center py-6 text-xs text-slate-400 font-mono">// No history logged.</div>';
        return;
    }
    sessions.forEach(session => {
        const isActive = session._id === currentSessionId;
        let title = session.messages && session.messages[0] ? session.messages[0].content : 'Untitled Chat';
        if (title.length > 22) title = title.substring(0, 22) + "...";
        if(isActive) activeChatTitleHeader.textContent = `${title.toUpperCase()}`;
        
        const div = document.createElement("div");
        div.className = "group w-full flex items-center justify-between px-2.5 py-2 text-xs rounded-lg cursor-pointer transition-all " + (isActive ? 'bg-brand-500/10 text-brand-500 font-semibold border border-brand-500/10' : 'text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800/50 hover:text-slate-800 dark:hover:text-slate-200');
        div.onclick = () => selectSession(session._id);
        div.innerHTML = '<span class="truncate flex items-center gap-2"><i class="fa-solid fa-message opacity-50 text-[10px]"></i><span class="truncate">' + title + '</span></span><button onclick="deleteSession(event, \'' + session._id + '\')" class="p-0.5 text-slate-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><i class="fa-regular fa-trash-can text-[10px]"></i></button>';
        chatHistoryList.appendChild(div);
    });
}

function createNewChat() { currentSessionId = null; chatWindow.innerHTML = ""; activeChatTitleHeader.textContent = "Ready Session Matrix"; showEmptyStateWelcome(); }
function selectSession(id) { currentSessionId = id; renderSidebarList(cachedSessionsList); loadActiveMessages(); toggleSidebar(false); }

async function deleteSession(event, id) {
    event.stopPropagation();
    if (!confirm("Are you sure you want to delete this context session?")) return;
    try {
        await apiCall("/api/chat/" + id, { method: "DELETE" });
        if (currentSessionId === id) createNewChat();
        loadChatSessions(true);
    } catch (err) {}
}

function loadActiveMessages() {
    if (!currentSessionId) return;
    const session = cachedSessionsList.find(s => s._id === currentSessionId);
    chatWindow.innerHTML = "";
    if (session && session.messages) session.messages.forEach(msg => insertMessageBubble(msg.role, msg.content));
    chatWindow.scrollTop = chatWindow.scrollHeight;
}

function showEmptyStateWelcome() {
    const name = localStorage.getItem("userName") || "Operator";
    chatWindow.innerHTML = `
        <div id="welcomeScreen" class="flex flex-col items-center justify-center flex-1 max-w-sm mx-auto text-center space-y-4 my-auto p-4">
            <div class="w-12 h-12 rounded-xl bg-brand-500/5 border border-brand-500/10 flex items-center justify-center text-brand-500 text-lg">
                <i class="fa-solid fa-terminal"></i>
            </div>
            <div class="space-y-1.5">
                <h3 class="text-base font-bold dark:text-white text-slate-900">Systems Standby. Welcome, ${name}.</h3>
                <p class="text-xs dark:text-slate-400 text-slate-500 max-w-xs mx-auto">The EDITH operational canvas is primed. Submit an active configuration instruction or file context.</p>
            </div>
            <div class="grid grid-cols-2 gap-2 w-full pt-1">
                <div onclick="document.getElementById('userInputText').value='Prepare notes on Quantum Mechanics Architecture'; document.getElementById('userInputText').focus();" class="p-2.5 border dark:border-matrix-border border-slate-200 bg-white dark:bg-slate-900/40 rounded-lg text-left cursor-pointer hover:border-brand-500/30 transition-all">
                    <h5 class="text-[11px] font-semibold text-brand-500 mb-0.5">Syllabus Notes</h5>
                    <p class="text-[10px] text-slate-400 truncate">Auto-Vault & PDF Export</p>
                </div>
                <div onclick="document.getElementById('userInputText').value='Analyze structural discrepancies inside...'; document.getElementById('userInputText').focus();" class="p-2.5 border dark:border-matrix-border border-slate-200 bg-white dark:bg-slate-900/40 rounded-lg text-left cursor-pointer hover:border-brand-500/30 transition-all">
                    <h5 class="text-[11px] font-semibold text-brand-500 mb-0.5">Code Inspection</h5>
                    <p class="text-[10px] text-slate-400 truncate">Optimize script structure</p>
                </div>
            </div>
        </div>`;
}

function insertMessageBubble(role, content) {
    const welcome = document.getElementById("welcomeScreen"); if(welcome) welcome.remove();
    const wrapper = document.createElement("div");
    wrapper.className = "flex gap-3 w-full max-w-2xl mx-auto py-1.5 " + (role === 'user' ? 'flex-row-reverse' : 'flex-row');
    
    const bubble = document.createElement("div");
    bubble.className = "rounded-xl px-3.5 py-2.5 text-xs md:text-sm leading-relaxed break-words shadow-sm max-w-[85%] " + (role === 'user' ? 'bg-brand-500 text-white' : 'dark:bg-matrix-darkCard bg-white dark:text-slate-200 text-slate-800 border dark:border-matrix-border border-slate-200/60');
    
    if (role === 'user') {
        bubble.textContent = content;
        wrapper.appendChild(bubble);
    } else {
        const uniqueId = "directive-node-" + Math.floor(Math.random() * 100000);
        const textWrapper = document.createElement("div");
        textWrapper.id = uniqueId;
        textWrapper.className = "prose-content";
        textWrapper.innerHTML = marked.parse(content);
        bubble.appendChild(textWrapper);
        
        if (content.includes("###") || content.includes("==") || content.includes("**Notes**") || content.toLowerCase().includes("syllabus")) {
            const headingMatch = content.match(/###\s+(.*)/);
            const identifiedTitle = headingMatch ? headingMatch[1].trim() : "Compiled Syllabus Notes";
            
            const actionBtn = document.createElement("button");
            actionBtn.className = "download-pdf-trigger";
            actionBtn.innerHTML = `<i class="fa-solid fa-file-pdf"></i> Lock to Vault & Export PDF`;
            actionBtn.onclick = () => {
                pushItemToVault(identifiedTitle, content);
                downloadCustomNotesPdf(encodeURIComponent(identifiedTitle), encodeURIComponent(content));
            };
            bubble.appendChild(actionBtn);
        }
        wrapper.appendChild(bubble);
    }
    
    chatWindow.appendChild(wrapper);
    chatWindow.scrollTop = chatWindow.scrollHeight;
}

function handleFileSelect() {
    const files = document.getElementById("fileAttachment").files;
    const label = document.getElementById("fileBadgeLabel");
    if (files.length > 0) {
        label.textContent = `${files.length} context items injected`;
        label.classList.remove("hidden");
    } else {
        label.classList.add("hidden");
    }
}

function updateInterfaceAttachmentLabels() {
    const label = document.getElementById("fileBadgeLabel");
    const dynamicCount = capturedCameraFiles.length + document.getElementById("fileAttachment").files.length;
    if(dynamicCount > 0) {
        label.textContent = `${dynamicCount} object sources attached`;
        label.classList.remove("hidden");
    } else {
        label.classList.add("hidden");
    }
}

async function sendMessage() {
    const input = document.getElementById("userInputText");
    const fileElement = document.getElementById("fileAttachment");
    const query = input.value.trim();
    if (!query && fileElement.files.length === 0 && capturedCameraFiles.length === 0) return;

    insertMessageBubble('user', query || "[Injected Media Context Package]");
    input.value = "";

    const loader = document.createElement("div");
    loader.className = "flex gap-2 items-center p-3 max-w-2xl mx-auto text-slate-400 font-mono text-xs";
    loader.innerHTML = `<span>Processing input string</span> <div class="space-x-0.5"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
    chatWindow.appendChild(loader);
    chatWindow.scrollTop = chatWindow.scrollHeight;

    const pack = new FormData();
    pack.append("message", query);
    pack.append("summarize", isSummarizeActive);
    if(currentSessionId) pack.append("sessionId", currentSessionId);

    for (let i = 0; i < fileElement.files.length; i++) {
        pack.append("files", fileElement.files[i]);
    }
    capturedCameraFiles.forEach(file => pack.append("files", file));

    try {
        const response = await apiCall("/api/chat", { method: "POST", body: pack });
        loader.remove();
        fileElement.value = "";
        capturedCameraFiles = [];
        document.getElementById("fileBadgeLabel").classList.add("hidden");

        if (!response) return;
        const resData = await response.json();
        
        if (!currentSessionId && resData.sessionId) {
            currentSessionId = resData.sessionId;
        }
        
        insertMessageBubble('assistant', resData.response);
        loadChatSessions(false);
    } catch(err) {
        loader.remove();
        insertMessageBubble('assistant', "System error processing current configuration package link.");
    }
}
</script>
</body>
</html>
