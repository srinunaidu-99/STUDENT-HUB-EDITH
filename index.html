<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDITH - Intelligence Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* Exact background gradient */
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #030712 70%);
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Core Orb Styling */
        .edith-orb {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            animation: pulseGlow 4s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 25px 2px rgba(99, 102, 241, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 0 40px 8px rgba(99, 102, 241, 0.6); }
        }

        /* Glassmorphism */
        .glass-panel {
            background: rgba(10, 11, 23, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .ai-bubble {
            background: rgba(23, 24, 51, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.25);
            color: #f3f4f6;
            border-radius: 20px 20px 20px 4px;
        }
    </style>
</head>

<body class="flex items-center justify-center p-4">

<div class="w-full max-w-5xl h-[92vh] flex flex-col glass-panel rounded-3xl shadow-2xl relative overflow-hidden">
    
    <div class="p-4 border-b border-white/5 flex justify-between items-center bg-gray-950/20 px-6">
        <div class="flex items-center gap-3.5">
            <div class="edith-orb w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold shadow-lg shadow-indigo-500/30">E</div>
            <div>
                <h1 class="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-white to-indigo-300">
                    EDITH <span class="text-[10px] bg-indigo-500/10 border border-indigo-500/30 px-1.5 py-0.5 rounded-md">V3.2</span>
                </h1>
                <p class="text-[10px] uppercase tracking-widest text-indigo-400 font-bold">Operator: Student</p>
            </div>
        </div>
    </div>

    <div class="flex-1 overflow-y-auto p-6 flex flex-col justify-center items-center text-center">
        <div class="edith-orb w-20 h-20 rounded-3xl flex items-center justify-center text-3xl text-white mb-6">
            <i class="fa-solid fa-brain"></i>
        </div>
        <h2 class="text-3xl font-bold mb-2 text-white">How can I assist you today?</h2>
        <p class="text-gray-400 text-sm max-w-sm">I can process documents, parse voice input, or run brainstorm sessions.</p>
    </div>

    <div class="p-6 bg-gray-950/40 border-t border-white/5 backdrop-blur-md">
        <div class="flex gap-3 items-center">
            <input type="text" placeholder="Ask EDITH anything..." 
                class="w-full bg-gray-900/80 border border-white/10 rounded-2xl pl-5 py-4 outline-none text-gray-100 shadow-inner focus:border-indigo-500/50">
            <button class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center hover:bg-indigo-500 transition-all">
                <i class="fa-solid fa-paper-plane text-white"></i>
            </button>
        </div>
    </div>
</div>

</body>
</html>
