<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Assistant</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
body{
    background:#212121;
    color:white;
    overflow:hidden;
}

::-webkit-scrollbar{
    width:6px;
}
::-webkit-scrollbar-thumb{
    background:#444;
    border-radius:20px;
}

.message pre{
    background:#111;
    padding:15px;
    border-radius:10px;
    overflow:auto;
    position:relative;
}

.message code{
    color:#a5b4fc;
}

.copy-btn{
    position:absolute;
    top:8px;
    right:8px;
    font-size:12px;
    padding:4px 8px;
    background:#333;
    border-radius:6px;
    cursor:pointer;
}

.sidebar-item:hover{
    background:#2a2a2a;
}
</style>
</head>

<body>

<div class="flex h-screen">

    <!-- SIDEBAR -->
    <aside id="sidebar"
        class="w-64 bg-[#171717] border-r border-[#333] flex flex-col">

        <div class="p-3">
            <button
                onclick="newChat()"
                class="w-full p-3 rounded-lg bg-[#2f2f2f] hover:bg-[#3d3d3d] text-left">
                + New Chat
            </button>
        </div>

        <div
            id="chatList"
            class="flex-1 overflow-y-auto px-2">
        </div>

        <div class="p-3 border-t border-[#333]">
            <div class="text-sm text-gray-400">
                AI Assistant
            </div>
        </div>

    </aside>

    <!-- MAIN -->
    <main class="flex-1 flex flex-col">

        <!-- TOP -->
        <div class="h-14 border-b border-[#333] flex items-center px-5">
            <h1 class="font-semibold">
                ChatGPT Style Assistant
            </h1>
        </div>

        <!-- CHAT -->
        <div
            id="chatArea"
            class="flex-1 overflow-y-auto">

            <div
                id="welcome"
                class="h-full flex flex-col justify-center items-center">

                <h1 class="text-4xl font-semibold mb-3">
                    What can I help with?
                </h1>

                <p class="text-gray-400">
                    Start a conversation below.
                </p>

            </div>

        </div>

        <!-- INPUT -->
        <div class="p-4">

            <div
                class="max-w-4xl mx-auto bg-[#2f2f2f] rounded-3xl border border-[#444] flex items-center p-3">

                <input
                    id="msg"
                    placeholder="Ask anything..."
                    class="flex-1 bg-transparent outline-none px-3 text-white"
                    onkeypress="if(event.key==='Enter')sendMessage()">

                <button
                    onclick="sendMessage()"
                    class="w-10 h-10 rounded-full bg-white text-black font-bold">
                    ↑
                </button>

            </div>

        </div>

    </main>

</div>

<script>

const API_BASE = "YOUR_API_ENDPOINT";

let chats = JSON.parse(localStorage.getItem("chats")) || [];
let currentChat = null;

function saveChats(){
    localStorage.setItem("chats",JSON.stringify(chats));
}

function newChat(){

    const chat={
        id:Date.now(),
        title:"New Chat",
        messages:[]
    };

    chats.unshift(chat);

    currentChat=chat.id;

    saveChats();

    renderSidebar();
    renderChat();
}

function renderSidebar(){

    const list=document.getElementById("chatList");

    list.innerHTML="";

    chats.forEach(chat=>{

        const div=document.createElement("div");

        div.className=
        "sidebar-item p-3 rounded-lg cursor-pointer text-sm mb-1 flex justify-between";

        div.innerHTML=`
            <span>${chat.title}</span>
            <button onclick="deleteChat(${chat.id})">×</button>
        `;

        div.onclick=(e)=>{

            if(e.target.tagName==="BUTTON") return;

            currentChat=chat.id;

            renderChat();
        };

        list.appendChild(div);
    });
}

function deleteChat(id){

    chats=chats.filter(c=>c.id!==id);

    saveChats();

    if(chats.length){
        currentChat=chats[0].id;
    }

    renderSidebar();
    renderChat();
}

function getCurrentChat(){
    return chats.find(c=>c.id===currentChat);
}

function renderChat(){

    const area=document.getElementById("chatArea");

    const chat=getCurrentChat();

    if(!chat){

        area.innerHTML=`
            <div class="h-full flex justify-center items-center">
                No Chat Selected
            </div>
        `;

        return;
    }

    if(chat.messages.length===0){

        area.innerHTML=`
            <div class="h-full flex justify-center items-center">
                <div class="text-center">
                    <h2 class="text-3xl mb-2">What can I help with?</h2>
                </div>
            </div>
        `;

        return;
    }

    area.innerHTML="";

    chat.messages.forEach(msg=>{

        const wrapper=document.createElement("div");

        wrapper.className=
        msg.role==="user"
        ?"flex justify-end p-4"
        :"flex justify-start p-4";

        const bubble=document.createElement("div");

        bubble.className=
        "message max-w-3xl p-4 rounded-2xl";

        bubble.style.background=
        msg.role==="user"
        ?"#2f2f2f"
        :"transparent";

        bubble.innerHTML=
        msg.role==="user"
        ?escapeHtml(msg.content)
        :marked.parse(msg.content);

        wrapper.appendChild(bubble);

        area.appendChild(wrapper);
    });

    addCopyButtons();

    area.scrollTop=area.scrollHeight;
}

function escapeHtml(text){
    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

function addCopyButtons(){

    document.querySelectorAll("pre").forEach(pre=>{

        if(pre.querySelector(".copy-btn")) return;

        const btn=document.createElement("button");

        btn.innerText="Copy";

        btn.className="copy-btn";

        btn.onclick=()=>{

            navigator.clipboard.writeText(pre.innerText);

            btn.innerText="Copied";

            setTimeout(()=>{
                btn.innerText="Copy";
            },2000);
        };

        pre.appendChild(btn);
    });
}

async function sendMessage(){

    const input=document.getElementById("msg");

    const text=input.value.trim();

    if(!text) return;

    let chat=getCurrentChat();

    if(!chat){

        newChat();
        chat=getCurrentChat();
    }

    chat.messages.push({
        role:"user",
        content:text
    });

    if(chat.title==="New Chat"){
        chat.title=text.substring(0,25);
    }

    saveChats();

    renderSidebar();
    renderChat();

    input.value="";

    const loading={
        role:"assistant",
        content:"Thinking..."
    };

    chat.messages.push(loading);

    renderChat();

    try{

        const response=await fetch(API_BASE,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                message:text
            })
        });

        const data=await response.json();

        loading.content=
            data.reply ||
            data.response ||
            "No response";

    }catch(err){

        loading.content=
            "Connection error.";

        console.error(err);
    }

    saveChats();
    renderChat();
}

if(chats.length===0){
    newChat();
}else{
    currentChat=chats[0].id;
}

renderSidebar();
renderChat();

</script>

</body>
</html>
