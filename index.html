<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDITH - Advanced Intelligence Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 0%, #0f172a 0%, #020617 80%);
            overflow: hidden;
        }

        /* --- PREMIUM SCROLLBAR STYLES --- */
        .chat-container::-webkit-scrollbar, .sidebar-scroll::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .chat-container::-webkit-scrollbar-track, .sidebar-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-container::-webkit-scrollbar-thumb, .sidebar-scroll::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.1);
            border-radius: 10px;
        }
        .chat-container::-webkit-scrollbar-thumb:hover, .sidebar-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(6, 182, 212, 0.3);
        }

        /* --- PROFESSIONAL ORB GLOW --- */
        @keyframes subtlePulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 20px 1px rgba(6, 182, 212, 0.25), 0 0 40px 4px rgba(79, 70, 229, 0.15);
            }
            50% {
                transform: scale(1.02);
                box-shadow: 0 0 30px 4px rgba(6, 182, 212, 0.4), 0 0 50px 8px rgba(79, 70, 229, 0.25);
            }
        }
        .edith-orb {
            animation: subtlePulse 5s ease-in-out infinite;
            background: linear-gradient(135deg, #06b6d4, #4f46e5);
        }

        /* --- SMOOTH TRANSITION SLIDE IN --- */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-msg {
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Mic Pulsing Effect */
        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .mic-active {
            animation: micPulse 1.5s infinite;
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #dc2626 !important;
        }

        /* --- PROFESSIONAL MODERN GLASSMORPHISM --- */
        .glass-panel {
            background: rgba(3, 7, 18, 0.6);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .ai-bubble {
            background: rgba(15, 23, 42, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #e2e8f0;
            border-radius: 12px;
        }
        .user-bubble {
            background: rgba(30, 41, 59, 0.7);
            color: #f8fafc;
            border: 1px solid rgba(6, 182, 212, 0.2);
            border-radius: 12px;
        }

        /* --- SIDEBAR ACTIVE STATES --- */
        .history-active {
            background: rgba(6, 182, 212, 0.08) !important;
            color: #06b6d4 !important;
            font-weight: 500 !important;
            border-left: 2px solid #06b6d4 !important;
            border-radius: 6px !important;
        }

        /* Code Block Wrapper styling */
        .code-block-wrapper {
            position: relative;
            margin: 16px 0;
            width: 100%;
        }
        pre {
            background: #020617 !important;
            padding: 20px 16px 16px 16px;
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.03);
            max-width: 100%;
        }
        code {
            font-family: 'JetBrains Mono', monospace;
            color: #cbd5e1;
            font-size: 0.85rem;
            white-space: pre;
        }
        .copy-code-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 10;
        }
        .copy-code-btn:hover {
            background: rgba(6, 182, 212, 0.1);
            color: #06b6d4;
            border-color: rgba(6, 182, 212, 0.3);
        }

        /* --- TYPING INDICATOR --- */
        .typing-dot {
            animation: typingBounce 1.4s infinite ease-in-out both;
            width: 5px;
            height: 5px;
            background-color: #06b6d4;
            border-radius: 50%;
            display: inline-block;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0.3); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .delete-chat-btn {
            opacity: 0;
            transition: all 0.15s ease;
        }
        .history-item-wrapper:hover .delete-chat-btn {
            opacity: 1;
        }
    </style>
</head>

<body class="text-slate-200 min-h-screen flex items-center justify-center p-0 sm:p-6">

<div class="w-full max-w-7xl h-screen sm:h-[90vh] flex glass-panel sm:rounded-2xl shadow-2xl relative overflow-hidden">
    
    <aside id="sidebarPanel" class="w-64 bg-slate-950/40 flex flex-col h-full hidden lg:flex border-r border-white/5 transition-all z-30">
        
        <div class="p-4 flex flex-col gap-2">
            <button onclick="createNewChatSession()" class="w-full flex items-center gap-3 px-3 py-2 text-xs text-slate-200 hover:bg-white/5 rounded-lg transition-all font-medium bg-white/5 border border-white/5">
                <i class="fa-regular fa-pen-to-square text-sm text-cyan-400"></i> Initialize Session
            </button>
            <div class="w-full relative mt-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                <input type="text" id="searchChatsInput" oninput="filterSidebarChats()" placeholder="Filter chat history..." class="w-full bg-slate-900/60 border border-white/5 text-xs rounded-lg pl-9 pr-3 py-2 outline-none text-slate-200 placeholder-slate-600 focus:border-cyan-500/30">
            </div>
        </div>

        <div class="px-4 pt-3 pb-1">
            <span class="text-[10px] font-semibold text-slate-500 tracking-wider block uppercase">Recent Records</span>
        </div>

        <div id="historyLogContainer" class="flex-1 overflow-y-auto px-2 pb-4 space-y-0.5 sidebar-scroll">
            <div class="text-center py-8 text-xs text-slate-600 font-light">Parsing registry logs...</div>
        </div>

        <div class="p-4 border-t border-white/5 bg-slate-950/60 flex items-center justify-between px-4">
            <div class="flex items-center gap-3">
                <div class="w-7 h-7 rounded-md bg-slate-800 border border-white/5 flex items-center justify-center text-xs font-semibold text-slate-300 uppercase tracking-wider" id="profileBadge">
                    OP
                </div>
                <div>
                    <span class="block text-xs font-medium text-slate-300" id="displayUserFooterName">Operator</span>
                    <span class="block text-[9px] text-slate-500 uppercase tracking-tight">System Tier</span>
                </div>
            </div>
            <button onclick="localStorage.clear(); window.location.href='login.html';" title="Disconnect" class="text-slate-500 hover:text-red-400 transition-all text-xs p-1">
                <i class="fa-solid fa-power-off"></i>
            </button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col h-full relative overflow-hidden bg-transparent">
        
        <div class="p-4 border-b border-white/5 flex justify-between items-center bg-slate-950/20 px-6">
            <div class="flex items-center gap-4">
                <button onclick="toggleMobileSidebar()" class="lg:hidden w-8 h-8 border border-white/5 bg-white/5 rounded-lg flex items-center justify-center text-slate-400">
                    <i class="fa-solid fa-bars text-xs"></i>
                </button>

                <div class="edith-orb w-8 h-8 rounded-lg flex items-center justify-center text-white font-bold tracking-wider text-xs">
                    E
                </div>
                <div>
                    <h1 class="text-sm font-semibold tracking-tight text-slate-100 flex items-center gap-2">
                        EDITH <span class="text-[9px] font-medium text-cyan-400 border border-cyan-500/20 px-1.5 py-0.2 rounded bg-cyan-500/5">V3.2 Architecture</span>
                    </h1>
                    <p class="text-[9px] uppercase tracking-widest text-slate-500 font-medium flex items-center gap-1.5 mt-0.5">
                        <span class="w-1 h-1 bg-cyan-400 rounded-full inline-block"></span>
                        Active Instance Node: <span id="displayUserName" class="text-slate-300">Operator</span>
                    </p>
                </div>
            </div>
            
            <div class="hidden sm:flex items-center gap-4 text-right">
                <div class="text-[11px]">
                    <span class="text-slate-600 uppercase block text-[8px] tracking-wider font-semibold">Latency ping</span>
                    <span class="text-cyan-400 font-mono">14ms</span>
                </div>
                <div class="w-px h-5 bg-white/5"></div>
                <div class="text-[11px]">
                    <span class="text-slate-600 uppercase block text-[8px] tracking-wider font-semibold">Core processing load</span>
                    <span class="text-slate-400 font-mono">2.4%</span>
                </div>
            </div>
        </div>

        <div id="chatArea" class="flex-1 overflow-y-auto p-6 space-y-4 chat-container"></div>

        <div class="p-4 sm:p-5 bg-slate-950/50 border-t border-white/5">
            <div class="flex flex-wrap gap-2 mb-3 px-1">
                <button onclick="toggleSummarize()" id="sumBtn" class="px-3 py-1 rounded-md border border-white/5 hover:border-cyan-500/20 bg-white/5 text-[10px] font-medium transition-all flex items-center gap-2 text-slate-400">
                    <span class="w-1 h-1 rounded-full bg-slate-500" id="sumDot"></span>
                    Compress Execution Notes: <span id="sumStatus" class="font-semibold text-slate-500">OFF</span>
                </button>

                <label class="px-3 py-1 rounded-md border border-white/5 hover:border-cyan-500/20 bg-white/5 text-[10px] font-medium cursor-pointer transition-all flex items-center gap-1.5 text-slate-400">
                    <i class="fa-solid fa-paperclip text-cyan-500"></i> Attach Assets
                    <input type="file" id="fileInput" multiple class="hidden" onchange="updateFileStatus()" />
                </label>
                <span id="fileCount" class="text-[10px] text-cyan-400 self-center font-medium font-mono"></span>
            </div>

            <div class="flex gap-2 items-center relative">
                <input type="text" id="msg" placeholder="Awaiting computational sequence instructions..." 
                    class="w-full bg-slate-900/40 border border-white/5 focus:border-cyan-500/30 rounded-xl pl-4 pr-24 py-3 outline-none transition-all text-xs placeholder-slate-600 text-slate-200 shadow-inner"
                    onkeypress="if(event.key==='Enter')sendMsg()" />

                <div class="absolute right-1.5 flex items-center gap-1">
                    <button onclick="toggleVoiceInput()" id="micBtn" title="Voice Processing"
                        class="w-8 h-8 bg-white/5 hover:bg-white/10 border border-white/5 text-slate-400 rounded-lg flex items-center justify-center transition-all">
                        <i class="fa-solid fa-microphone text-xs"></i>
                    </button>
                    
                    <button onclick="sendMsg()" class="w-8 h-8 bg-cyan-600 hover:bg-cyan-500 active:scale-95 text-slate-950 rounded-lg flex items-center justify-center transition-all shadow-md shadow-cyan-600/10">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
const API_BASE = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
    ? "http://localhost:5000"
    : "https://student-hub-edith-backend.onrender.com";

const chatArea = document.getElementById("chatArea");
const historyLogContainer = document.getElementById("historyLogContainer");
let isSummarize = false;
let currentActiveSessionId = null; 
let globallyCachedHistoryTree = []; 

let recognition;
let isRecording = false;

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    recognition.onstart = () => {
        isRecording = true;
        document.getElementById("micBtn").classList.add("mic-active");
        document.getElementById("msg").placeholder = "Listening intelligently...";
    };

    recognition.onend = () => {
        isRecording = false;
        document.getElementById("micBtn").classList.remove("mic-active");
        document.getElementById("msg").placeholder = "Awaiting computational sequence instructions...";
    };

    recognition.onresult = (event) => {
        document.getElementById("msg").value = event.results[0][0].transcript;
    };
}

function toggleVoiceInput() {
    if (!recognition) {
        alert("Voice engine unsupported in this node browser browser profile.");
        return;
    }
    if (isRecording) recognition.stop();
    else recognition.start();
}

window.onload = () => {
    const token = localStorage.getItem("token");
    const name = localStorage.getItem("userName") || "Operator";

    if (!token) {
        window.location.href = "login.html";
        return;
    }
    
    document.getElementById("displayUserName").innerText = name;
    document.getElementById("displayUserFooterName").innerText = name;
    document.getElementById("profileBadge").innerText = name.substring(0, 2).toUpperCase();
    
    renderBlankWelcomeInterface();
    loadChatHistory(true); 
};

function renderBlankWelcomeInterface() {
    chatArea.innerHTML = `
        <div id="welcomeScreen" class="flex flex-col justify-center items-center mt-20 text-center px-4 animate-msg">
            <div class="edith-orb w-14 h-14 rounded-xl flex items-center justify-center text-xl text-slate-950 mb-4 shadow-xl">
                <i class="fa-solid fa-brain"></i>
            </div>
            <h2 class="text-lg font-medium mb-1 tracking-tight text-slate-100">Intelligent Hub Matrix Operational</h2>
            <p class="text-slate-500 text-xs max-w-sm font-normal leading-relaxed">System ready to ingest files, compile data schemas, or process standalone core infrastructure streams.</p>
        </div>
    `;
}

async function loadChatHistory(autoLoadFirstSession = false) {
    const token = localStorage.getItem("token");
    if(!token) return;

    try {
        const response = await fetch(`${API_BASE}/api/history`, {
            method: "GET",
            headers: { 
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            }
        });

        if (response.ok) {
            globallyCachedHistoryTree = await response.json();
            renderSidebarHistoryList(globallyCachedHistoryTree);
            
            if (autoLoadFirstSession && globallyCachedHistoryTree.length > 0) {
                loadSelectedSessionStream(globallyCachedHistoryTree[0]._id);
            }
        } else {
            historyLogContainer.innerHTML = `<div class="text-center py-8 text-[11px] text-slate-600 font-light">No core sessions found.</div>`;
        }
    } catch (err) {
        console.error("History sync error:", err);
        historyLogContainer.innerHTML = `<div class="text-center py-6 text-xs text-red-400/40">Server Sync Interrupted</div>`;
    }
}

function renderSidebarHistoryList(historyArray) {
    if (!historyArray || historyArray.length === 0) {
        historyLogContainer.innerHTML = `<div class="text-center py-8 text-[11px] text-slate-600 font-light">No core sessions found.</div>`;
        return;
    }
    historyLogContainer.innerHTML = "";
    
    historyArray.forEach((session) => {
        if (!session) return;
        const id = session._id;
        let displayTitle = "Untitled Chat Session";
        
        if (session.messages && session.messages.length > 0 && session.messages[0]) {
            displayTitle = session.messages[0].content || "Empty Prompt Layer";
        } else if (session.title) {
            displayTitle = session.title;
        }
        
        if (displayTitle.length > 22) {
            displayTitle = displayTitle.substring(0, 22) + "...";
        }

        const itemWrapper = document.createElement("div");
        itemWrapper.className = "flex items-center justify-between w-full relative group history-item-wrapper rounded-lg transition-all pr-1 hover:bg-white/5";

        const btn = document.createElement("button");
        btn.id = `sidebar-session-${id}`;
        btn.onclick = () => loadSelectedSessionStream(id);
        
        const activeClass = (String(id) === String(currentActiveSessionId)) ? 'history-active' : '';
        btn.className = `flex-1 text-left px-3 py-2 text-[11px] tracking-wide transition-all overflow-hidden text-ellipsis whitespace-nowrap block truncate text-slate-400 rounded-lg ${activeClass}`;
        btn.innerText = displayTitle;

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-chat-btn text-slate-600 hover:text-red-400 p-1 text-[11px] rounded transition-all ml-1";
        deleteBtn.innerHTML = `<i class="fa-regular fa-trash-can"></i>`;
        deleteBtn.onclick = (e) => {
            e.stopPropagation(); 
            deleteChatSessionFromServer(id);
        };

        itemWrapper.appendChild(btn);
        itemWrapper.appendChild(deleteBtn);
        historyLogContainer.appendChild(itemWrapper);
    });
}

async function deleteChatSessionFromServer(sessionId) {
    if (!confirm("Are you sure you want to purge this chat session stream?")) return;
    
    const token = localStorage.getItem("token");
    try {
        const res = await fetch(`${API_BASE}/api/chat/${sessionId}`, {
            method: "DELETE",
            headers: { "Authorization": `Bearer ${token}` }
        });

        if (res.ok) {
            if (String(currentActiveSessionId) === String(sessionId)) {
                currentActiveSessionId = null;
                renderBlankWelcomeInterface();
            }
            await silentRefreshHistoryTree();
        } else {
            alert("Failed to execute purge on backend structure.");
        }
    } catch (err) {
        console.error("Purge failure:", err);
        alert("Server network disconnect during chat deletion.");
    }
}

function loadSelectedSessionStream(sessionId) {
    if (!sessionId) return;
    currentActiveSessionId = sessionId;
    
    const blocks = historyLogContainer.querySelectorAll("button");
    blocks.forEach(b => b.classList.remove("history-active"));
    
    const targetedActiveBtn = document.getElementById(`sidebar-session-${sessionId}`);
    if (targetedActiveBtn) targetedActiveBtn.classList.add("history-active");

    const targetedSession = globallyCachedHistoryTree.find(s => String(s._id) === String(sessionId));
    chatArea.innerHTML = "";

    if (targetedSession && Array.isArray(targetedSession.messages)) {
        if (targetedSession.messages.length === 0) {
            renderBlankWelcomeInterface();
            return;
        }
        targetedSession.messages.forEach(msg => {
            if(msg && msg.content) {
                appendMessageToUI(msg.content, String(msg.role).toLowerCase() === "user");
            }
        });
        chatArea.scrollTop = chatArea.scrollHeight;
    }
}

function createNewChatSession() {
    currentActiveSessionId = null; 
    const blocks = historyLogContainer.querySelectorAll("button");
    blocks.forEach(b => b.classList.remove("history-active"));
    renderBlankWelcomeInterface();
    document.getElementById("msg").focus();
}

function filterSidebarChats() {
    const query = document.getElementById("searchChatsInput").value.toLowerCase();
    const filtered = globallyCachedHistoryTree.filter(s => {
        const title = s.messages?.[0]?.content || s.title || "";
        return title.toLowerCase().includes(query);
    });
    renderSidebarHistoryList(filtered);
}

async function sendMsg() {
    const input = document.getElementById("msg");
    const fileInput = document.getElementById("fileInput");
    const message = input.value.trim();
    const token = localStorage.getItem("token");

    if (!message && fileInput.files.length === 0) return;

    appendMessageToUI(message || "Ingesting active stream layers...", true);
    input.value = "";

    const formData = new FormData();
    formData.append("message", message);
    formData.append("isSummarize", isSummarize);
    if (currentActiveSessionId) formData.append("sessionId", currentActiveSessionId);

    for (let file of fileInput.files) {
        formData.append("files", file);
    }

    showTypingIndicator();

    try {
        const res = await fetch(`${API_BASE}/api/chat`, {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}` },
            body: formData
        });

        removeTypingIndicator();

        if (!res.ok) {
            appendMessageToUI("❌ Command execution stream failure.", false);
            return;
        }

        const incomingSessionId = res.headers.get("X-Session-Id");
        if (incomingSessionId && !currentActiveSessionId) {
            currentActiveSessionId = incomingSessionId;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        const aiBubble = appendMessageToUI("", false);
        let accumulatedText = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value, { stream: true });
            accumulatedText += chunk;
            
            aiBubble.innerHTML = cleanAndParseMarkdown(accumulatedText);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        await silentRefreshHistoryTree();

        if (isSummarize) {
            isSummarize = false;
            updateSummarizeUI();
        }

    } catch (err) {
        removeTypingIndicator();
        appendMessageToUI("❌ Core pipeline drop encountered.", false);
    }

    fileInput.value = "";
    document.getElementById("fileCount").innerText = "";
}

async function silentRefreshHistoryTree() {
    const token = localStorage.getItem("token");
    try {
        const response = await fetch(`${API_BASE}/api/history`, {
            method: "GET",
            headers: { "Authorization": `Bearer ${token}` }
        });
        if (response.ok) {
            globallyCachedHistoryTree = await response.json();
            renderSidebarHistoryList(globallyCachedHistoryTree);
            
            if (currentActiveSessionId) {
                const activeBtn = document.getElementById(`sidebar-session-${currentActiveSessionId}`);
                if (activeBtn) activeBtn.classList.add("history-active");
            }
        }
    } catch (e) {}
}

function appendMessageToUI(text, isUser) {
    const internalWelcome = document.getElementById("welcomeScreen");
    if (internalWelcome) internalWelcome.remove();

    const div = document.createElement("div");
    div.className = `flex ${isUser ? "justify-end" : "justify-start"} animate-msg w-full`;

    div.innerHTML = `
        <div class="p-3.5 px-4 max-w-[85%] text-xs leading-relaxed shadow-sm ${isUser ? "user-bubble" : "ai-bubble break-words overflow-hidden"}">
            ${isUser ? escapeHtml(text) : cleanAndParseMarkdown(text)}
        </div>
    `;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div.querySelector("div");
}

function cleanAndParseMarkdown(text) {
    if (!text) return "";
    let rawHtml = marked.parse(text);
    const container = document.createElement('div');
    container.innerHTML = rawHtml;

    container.querySelectorAll('pre').forEach((pre) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper';
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-code-btn';
        copyBtn.innerHTML = '<i class="fa-regular fa-copy mr-1"></i> Copy';
        
        copyBtn.onclick = () => {
            navigator.clipboard.writeText(pre.querySelector('code')?.innerText || pre.innerText).then(() => {
                copyBtn.innerHTML = '<i class="fa-solid fa-check text-emerald-400 mr-1"></i> Copied';
                setTimeout(() => { copyBtn.innerHTML = '<i class="fa-regular fa-copy mr-1"></i> Copy'; }, 2000);
            });
        };
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);
        wrapper.appendChild(copyBtn);
    });
    return container.innerHTML;
}

function showTypingIndicator() {
    const div = document.createElement("div");
    div.id = "edithTypingIndicator";
    div.className = "flex justify-start animate-msg";
    div.innerHTML = `<div class="p-3 px-4 ai-bubble flex items-center gap-1 shadow-sm"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTypingIndicator() {
    const ind = document.getElementById("edithTypingIndicator");
    if (ind) ind.remove();
}

function toggleSummarize() { isSummarize = !isSummarize; updateSummarizeUI(); }
function updateSummarizeUI() {
    const statusText = document.getElementById("sumStatus");
    const dotElement = document.getElementById("sumDot");
    const btn = document.getElementById("sumBtn");
    statusText.innerText = isSummarize ? "ON" : "OFF";
    statusText.className = isSummarize ? "font-semibold text-cyan-400" : "font-semibold text-slate-500";
    dotElement.className = isSummarize ? "w-1 h-1 rounded-full bg-cyan-400" : "w-1 h-1 rounded-full bg-slate-500";
    if (isSummarize) btn.classList.add("border-cyan-500/20", "bg-cyan-500/5"); else btn.classList.remove("border-cyan-500/20", "bg-cyan-500/5");
}

function updateFileStatus() {
    const files = document.getElementById("fileInput").files;
    document.getElementById("fileCount").innerText = files.length > 0 ? `• ${files.length} loaded` : "";
}

function toggleMobileSidebar() {
    const sidebar = document.getElementById("sidebarPanel");
    sidebar.classList.toggle("hidden");
    if (!sidebar.classList.contains("hidden")) {
        sidebar.classList.add("fixed", "inset-y-0", "left-0", "w-64", "z-50", "bg-slate-950");
    }
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
</script>

</body>
</html>
