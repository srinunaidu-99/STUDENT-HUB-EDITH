<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDITH - Intelligence Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #030712 70%);
            overflow: hidden;
            height: 100vh;
        }

        /* Custom Scrollbar */
        .chat-container::-webkit-scrollbar, .history-container::-webkit-scrollbar { width: 4px; }
        .chat-container::-webkit-scrollbar-thumb, .history-container::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.2); border-radius: 10px; }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px 2px rgba(99, 102, 241, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px 5px rgba(168, 85, 247, 0.4); }
        }
        .edith-orb { animation: pulseGlow 4s ease-in-out infinite; background: linear-gradient(135deg, #6366f1, #a855f7); }

        .glass-panel { background: rgba(10, 11, 23, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .ai-bubble { background: rgba(23, 24, 51, 0.6); border: 1px solid rgba(99, 102, 241, 0.2); color: #f3f4f6; border-radius: 18px 18px 18px 4px; position: relative; }
        .user-bubble { background: linear-gradient(135deg, #4f46e5, #3730a3); color: white; border-radius: 18px 18px 4px 18px; }
        
        .history-item { transition: all 0.2s; border-left: 2px solid transparent; }
        .history-item:hover { background: rgba(99, 102, 241, 0.1); border-left: 2px solid #6366f1; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-msg { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>

<body class="text-gray-100 flex items-center justify-center">

<div class="w-full h-full flex flex-row overflow-hidden">
    
    <div class="flex-1 flex flex-col relative h-full">
        <div class="p-4 border-b border-white/5 flex justify-between items-center bg-gray-950/40 px-6 backdrop-blur-md">
            <div class="flex items-center gap-3">
                <div class="edith-orb w-9 h-9 rounded-lg flex items-center justify-center text-white font-bold shadow-lg">E</div>
                <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-white to-indigo-300 bg-clip-text text-transparent">EDITH <span class="text-[10px] text-indigo-400 font-mono tracking-tighter">OS V3.5</span></h1>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="newChat()" class="px-4 py-1.5 bg-indigo-600/20 hover:bg-indigo-600/40 border border-indigo-500/30 rounded-full text-xs font-bold transition-all flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> NEW SESSION
                </button>
            </div>
        </div>

        <div id="chatArea" class="flex-1 overflow-y-auto p-6 space-y-6 chat-container pb-32">
            <div id="welcomeScreen" class="flex flex-col justify-center items-center mt-32 text-center">
                <div class="edith-orb w-16 h-16 rounded-2xl flex items-center justify-center text-2xl text-white mb-6">
                    <i class="fa-solid fa-terminal"></i>
                </div>
                <h2 class="text-xl font-bold mb-2 text-white">Interface Initialized</h2>
                <p class="text-gray-500 text-xs tracking-widest uppercase italic">English Interaction Protocol Active</p>
            </div>
        </div>

        <div class="absolute bottom-0 w-full p-4 sm:p-6 bg-gradient-to-t from-gray-950 via-gray-950/90 to-transparent">
            <div class="max-w-4xl mx-auto">
                <div class="flex flex-wrap gap-2 mb-3 px-1">
                    <button onclick="toggleSummarize()" id="sumBtn" class="px-3 py-1 rounded-md border border-white/10 bg-white/5 text-[10px] font-medium transition-all flex items-center gap-2">
                        <span class="w-1.5 h-1.5 rounded-full bg-gray-500" id="sumDot"></span> SUMMARIZE: <span id="sumStatus" class="text-gray-400">OFF</span>
                    </button>
                    <label class="px-3 py-1 rounded-md border border-white/10 bg-white/5 text-[10px] font-medium cursor-pointer flex items-center gap-1.5">
                        <i class="fa-solid fa-link text-indigo-400"></i> ATTACH <input type="file" id="fileInput" multiple class="hidden" onchange="updateFileStatus()" />
                    </label>
                    <span id="fileCount" class="text-[10px] text-indigo-300 self-center"></span>
                </div>

                <div class="flex gap-3 items-center glass-panel p-2 rounded-2xl border-white/10 shadow-2xl">
                    <input type="text" id="msg" placeholder="Type your command..." class="flex-1 bg-transparent pl-4 py-3 outline-none text-sm text-gray-100" onkeypress="if(event.key==='Enter')sendMsg()" />
                    <button onclick="toggleVoiceInput()" id="micBtn" class="w-10 h-10 text-gray-400 hover:text-indigo-400 transition-colors">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <button onclick="sendMsg()" class="w-10 h-10 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl flex items-center justify-center transition-all">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="hidden lg:flex w-72 border-l border-white/5 bg-gray-950/60 flex-col backdrop-blur-xl">
        <div class="p-5 border-b border-white/5 flex justify-between items-center">
            <h3 class="text-xs font-bold tracking-widest text-indigo-400 uppercase">Interaction Logs</h3>
            <i class="fa-solid fa-clock-rotate-left text-xs text-gray-600"></i>
        </div>
        <div id="historyList" class="flex-1 overflow-y-auto p-2 history-container">
            </div>
        <div class="p-4 border-t border-white/5">
            <button onclick="clearHistory()" class="w-full py-2 text-[10px] border border-red-500/10 text-gray-500 hover:text-red-400 hover:bg-red-500/5 rounded-lg transition-all">
                WIPE ALL LAB DATA
            </button>
        </div>
    </div>
</div>

<script>
const API_BASE = window.location.hostname === "127.0.0.1" ? "http://localhost:5000" : "https://student-hub-edith-backend.onrender.com";
const chatArea = document.getElementById("chatArea");
const historyList = document.getElementById("historyList");
const welcomeScreen = document.getElementById("welcomeScreen");
let isSummarize = false;

// --- PERSISTENT HISTORY (LAB SAVED) ---
function saveToLogs(text, isUser) {
    let logs = JSON.parse(localStorage.getItem("edith_lab_history") || "[]");
    logs.push({ text, isUser, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
    if(logs.length > 50) logs.shift();
    localStorage.setItem("edith_lab_history", JSON.stringify(logs));
    updateLogsUI();
}

function updateLogsUI() {
    let logs = JSON.parse(localStorage.getItem("edith_lab_history") || "[]");
    historyList.innerHTML = logs.filter(l => l.isUser).reverse().map(item => `
        <div class="history-item p-3 mb-1 rounded-lg">
            <p class="text-[11px] text-gray-300 font-medium truncate">${item.text}</p>
            <span class="text-[9px] text-gray-600 font-mono italic">${item.time}</span>
        </div>
    `).join('');
}

function loadSavedChat() {
    let logs = JSON.parse(localStorage.getItem("edith_lab_history") || "[]");
    if (logs.length > 0) {
        welcomeScreen.style.display = "none";
        logs.forEach(msg => renderMessage(msg.text, msg.isUser, false));
        chatArea.scrollTop = chatArea.scrollHeight;
    }
}

function newChat() {
    chatArea.innerHTML = '';
    chatArea.appendChild(welcomeScreen);
    welcomeScreen.style.display = 'flex';
}

function clearHistory() {
    if(confirm("Wipe all persistent lab logs?")) {
        localStorage.removeItem("edith_lab_history");
        location.reload();
    }
}

// --- VOICE (MANUAL TRIGGER - STRICT ENGLISH) ---
function speakText(text) {
    window.speechSynthesis.cancel();
    const cleanText = text.replace(/[#*`_~]/g, '').trim();
    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = 'en-US'; 
    utterance.rate = 1.0;
    window.speechSynthesis.speak(utterance);
}

// --- VOICE INPUT ---
let recognition;
if ('webkitSpeechRecognition' in window) {
    recognition = new webkitSpeechRecognition();
    recognition.lang = 'en-US';
    recognition.onresult = (e) => document.getElementById("msg").value
