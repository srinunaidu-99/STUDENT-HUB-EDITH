<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDITH | Intelligence Core</title>

    <!-- Core Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#6366f1', 
                            600: '#4f46e5', 
                        },
                        matrix: {
                            darkBg: '#090d16',
                            darkCard: '#111827',
                            border: 'rgba(255, 255, 255, 0.06)'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Scrollbar Styling */
        .chat-scroll::-webkit-scrollbar { width: 5px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .dark .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 99px; }

        /* Prose Styling for AI responses */
        .prose-content p { margin-bottom: 0.75rem; line-height: 1.6; }
        .prose-content ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.75rem; }
        
        .download-pdf-trigger { 
            margin-top: 10px; 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            padding: 6px 12px; 
            background: rgba(99, 102, 241, 0.1); 
            border: 1px solid rgba(99, 102, 241, 0.2); 
            font-size: 11px; 
            font-weight: 600; 
            border-radius: 6px; 
            color: #818cf8; 
            cursor: pointer; 
        }

        .dot { animation: bouncePoint 1.4s infinite ease-in-out; width: 4px; height: 4px; background-color: #6366f1; border-radius: 50%; display: inline-block; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bouncePoint { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
    </style>
</head>

<body class="w-screen h-screen flex dark:bg-matrix-darkBg bg-slate-50 text-slate-800 dark:text-slate-200 overflow-hidden text-sm">

    <!-- CAMERA MODAL -->
    <div id="cameraModal" class="hidden fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="w-full max-w-md dark:bg-matrix-darkCard bg-white border dark:border-matrix-border rounded-xl overflow-hidden shadow-2xl">
            <div class="px-4 py-3 border-b dark:border-matrix-border flex justify-between items-center">
                <span class="text-xs font-bold tracking-widest uppercase text-brand-500">Visual Input Node</span>
                <button onclick="closeCamera()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <video id="videoFeed" autoplay playsinline class="w-full aspect-video bg-black object-cover"></video>
            <div class="p-4 flex gap-2">
                <button onclick="captureImage()" class="flex-1 bg-brand-500 py-2 rounded-lg font-bold text-white text-xs">CAPTURE FRAME</button>
            </div>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 -translate-x-full lg:translate-x-0 lg:relative z-50 flex flex-col h-full dark:bg-matrix-darkCard bg-white border-r dark:border-matrix-border transition-transform">
        
        <div class="p-6 space-y-6 shrink-0">
            <!-- New Geometric Logo -->
            <div class="flex items-center gap-3">
                <div class="relative w-10 h-10 flex items-center justify-center">
                    <div class="absolute inset-0 bg-brand-500/20 blur-md rounded-full animate-pulse"></div>
                    <svg class="relative w-8 h-8" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L3.5 7V17L12 22L20.5 17V7L12 2Z" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 22V12M12 12L3.5 7M12 12L20.5 7" stroke="#6366f1" stroke-width="1" stroke-opacity="0.5"/>
                        <circle cx="12" cy="12" r="2.5" fill="#6366f1" class="animate-pulse" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tighter leading-none">EDITH</h1>
                    <p class="text-[9px] uppercase tracking-[0.3em] text-slate-500 font-bold">Intelligence Core</p>
                </div>
            </div>

            <button onclick="newChat()" class="w-full py-2.5 bg-brand-500 hover:bg-brand-600 text-white rounded-lg text-xs font-bold shadow-lg shadow-brand-500/20 transition-all active:scale-95">
                + NEW WORKSPACE
            </button>
        </div>

        <!-- History -->
        <div class="flex-1 overflow-y-auto px-4 space-y-1 chat-scroll" id="historyList">
            <p class="text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-2 px-2">Session Logs</p>
        </div>

        <!-- User Profile -->
        <div class="p-4 border-t dark:border-matrix-border flex items-center gap-3 bg-slate-900/20">
            <div class="w-8 h-8 rounded-lg bg-brand-500 flex items-center justify-center font-bold text-white text-xs">OP</div>
            <div class="flex-1 overflow-hidden">
                <p class="text-xs font-bold truncate">Operator</p>
                <p class="text-[10px] text-slate-500">Secure Link Active</p>
            </div>
            <button onclick="logout()" class="text-slate-500 hover:text-red-400"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col min-w-0">
        <!-- Header -->
        <header class="h-14 border-b dark:border-matrix-border flex items-center justify-between px-6 bg-white dark:bg-matrix-darkCard">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="lg:hidden text-slate-400"><i class="fa-solid fa-bars"></i></button>
                <span id="sessionTitle" class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Terminal Ready</span>
            </div>
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-[9px] font-bold text-emerald-500 tracking-tighter">NODE ONLINE</span>
                </div>
            </div>
        </header>

        <!-- Chat Area -->
        <main id="chatBox" class="flex-1 overflow-y-auto p-6 space-y-6 chat-scroll flex flex-col items-center">
            <!-- Welcome State -->
            <div id="welcome" class="my-auto text-center space-y-4 max-w-sm">
                <div class="w-16 h-16 bg-brand-500/10 border border-brand-500/20 rounded-2xl flex items-center justify-center mx-auto text-brand-500 text-2xl">
                    <i class="fa-solid fa-microchip"></i>
                </div>
                <h2 class="text-xl font-bold">Initialize System Directive</h2>
                <p class="text-xs text-slate-500 leading-relaxed">EDITH is ready to assist with neural data analysis, syllabus compilation, and tactical planning.</p>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="p-6 bg-white dark:bg-matrix-darkCard border-t dark:border-matrix-border">
            <div class="max-w-3xl mx-auto space-y-4">
                <div class="flex items-center gap-4 text-[10px] font-bold text-slate-500">
                    <button class="hover:text-brand-500 transition-colors" onclick="document.getElementById('fileInput').click()">
                        <i class="fa-solid fa-paperclip mr-1 text-brand-500"></i> ATTACH
                    </button>
                    <button class="hover:text-brand-500 transition-colors" onclick="openCamera()">
                        <i class="fa-solid fa-camera mr-1 text-brand-500"></i> SCAN
                    </button>
                    <div id="fileStatus" class="hidden text-brand-500 bg-brand-500/10 px-2 py-0.5 rounded">0 FILES READY</div>
                </div>

                <div class="relative group">
                    <input type="file" id="fileInput" multiple class="hidden" onchange="updateFileCount()">
                    <input type="text" id="userInput" placeholder="Input system command..." 
                        class="w-full bg-slate-100 dark:bg-slate-900 border dark:border-matrix-border rounded-xl py-4 px-5 pr-14 outline-none focus:border-brand-500/50 transition-all text-sm font-medium">
                    <button onclick="handleSend()" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-brand-500 text-white rounded-lg flex items-center justify-center hover:bg-brand-600 shadow-lg shadow-brand-500/30 active:scale-90 transition-all">
                        <i class="fa-solid fa-arrow-up"></i>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const fileInput = document.getElementById('fileInput');
        
        let stream = null;
        let capturedFiles = [];

        // UI Logic
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        function updateFileCount() {
            const count = fileInput.files.length + capturedFiles.length;
            const status = document.getElementById('fileStatus');
            if (count > 0) {
                status.textContent = `${count} ASSETS ATTACHED`;
                status.classList.remove('hidden');
            } else {
                status.classList.add('hidden');
            }
        }

        // Message Handling
        function appendMessage(role, text) {
            document.getElementById('welcome')?.remove();
            
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full max-w-3xl animate-in fade-in slide-in-from-bottom-2 duration-300 ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = `max-w-[85%] p-4 rounded-2xl text-sm ${
                role === 'user' 
                ? 'bg-brand-500 text-white font-medium ml-12' 
                : 'dark:bg-slate-900 bg-slate-100 border dark:border-matrix-border mr-12'
            }`;

            if (role === 'ai') {
                bubble.innerHTML = `<div class="prose-content">${marked.parse(text)}</div>`;
                if (text.includes('###')) {
                    const btn = document.createElement('button');
                    btn.className = 'download-pdf-trigger';
                    btn.innerHTML = `<i class="fa-solid fa-file-export"></i> EXPORT SYLLABUS PDF`;
                    btn.onclick = () => alert('Generating Encrypted PDF...');
                    bubble.appendChild(btn);
                }
            } else {
                bubble.textContent = text;
            }

            wrapper.appendChild(bubble);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleSend() {
            const val = userInput.value.trim();
            if (!val && fileInput.files.length === 0) return;

            appendMessage('user', val || "Context upload initiated.");
            userInput.value = '';
            
            // Simulate AI response
            setTimeout(() => {
                appendMessage('ai', "### Analysis Complete\nProcessing your query through the EDITH neural core. \n\n*   **Status**: Success\n*   **Node**: Primary\n\nHow should we proceed with this data?");
            }, 800);
            
            fileInput.value = '';
            capturedFiles = [];
            updateFileCount();
        }

        // Camera Logic
        async function openCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('videoFeed').srcObject = stream;
                document.getElementById('cameraModal').classList.remove('hidden');
            } catch (err) {
                alert("Camera access denied.");
            }
        }

        function closeCamera() {
            stream?.getTracks().forEach(t => t.stop());
            document.getElementById('cameraModal').classList.add('hidden');
        }

        function captureImage() {
            const video = document.getElementById('videoFeed');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            canvas.toBlob(blob => {
                const file = new File([blob], "capture.jpg", { type: "image/jpeg" });
                capturedFiles.push(file);
                updateFileCount();
                closeCamera();
            });
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        function newChat() {
            chatBox.innerHTML = `
                <div id="welcome" class="my-auto text-center space-y-4 max-w-sm">
                    <div class="w-16 h-16 bg-brand-500/10 border border-brand-500/20 rounded-2xl flex items-center justify-center mx-auto text-brand-500 text-2xl">
                        <i class="fa-solid fa-microchip"></i>
                    </div>
                    <h2 class="text-xl font-bold">New Matrix Initialized</h2>
                    <p class="text-xs text-slate-500 leading-relaxed">System ready for new operational parameters.</p>
                </div>
            `;
        }
    </script>
</body>

</html>
