<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDITH - Intelligence Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #030712 70%);
            overflow: hidden;
        }

        /* Custom Scrollbar */
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.2);
            border-radius: 10px;
        }
        .chat-container::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.4);
        }

        /* Core Orb Animations */
        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 25px 2px rgba(99, 102, 241, 0.4), 0 0 50px 10px rgba(168, 85, 247, 0.2);
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 0 40px 8px rgba(99, 102, 241, 0.6), 0 0 70px 20px rgba(168, 85, 247, 0.4);
            }
        }
        .edith-orb {
            animation: pulseGlow 4s ease-in-out infinite;
            background: linear-gradient(135deg, #6366f1, #a855f7);
        }

        /* Smooth slide in for incoming messages */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.99);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-msg {
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Mic Pulsing Effect when recording */
        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .mic-active {
            animation: micPulse 1.5s infinite;
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #f87171 !important;
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(10, 11, 23, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .ai-bubble {
            background: rgba(23, 24, 51, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.25);
            color: #f3f4f6;
            border-radius: 20px 20px 20px 4px;
        }
        .user-bubble {
            background: linear-gradient(135deg, #4f46e5, #3730a3);
            color: white;
            border-radius: 20px 20px 4px 20px;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.25);
        }

        /* Code Block Copy Enhancement Wrapper */
        .code-block-wrapper {
            position: relative;
            margin: 12px 0;
            width: 100%;
        }
        pre {
            background: #020617 !important;
            padding: 18px 16px 16px 16px;
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 100%;
        }
        code {
            color: #a5b4fc;
            font-size: 0.875rem;
            white-space: pre;
        }
        .copy-code-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 10;
        }
        .copy-code-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        /* Typing Dots Animation */
        .typing-dot {
            animation: typingBounce 1.4s infinite ease-in-out both;
            width: 6px;
            height: 6px;
            background-color: #a5b4fc;
            border-radius: 50%;
            display: inline-block;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>

<body class="text-gray-100 min-h-screen flex items-center justify-center p-0 sm:p-4">

<div class="w-full max-w-5xl h-screen sm:h-[92vh] flex flex-col glass-panel sm:rounded-3xl shadow-2xl relative overflow-hidden">
    
    <!-- Top Navbar -->
    <div class="p-4 border-b border-white/5 flex justify-between items-center bg-gray-950/20 px-6">
        <div class="flex items-center gap-3.5">
            <div class="edith-orb w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold tracking-wider text-sm shadow-lg shadow-indigo-500/30">
                E
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-white via-gray-200 to-indigo-300 bg-clip-text text-transparent">
                    EDITH <span class="text-xs font-semibold text-indigo-400 border border-indigo-500/30 px-1.5 py-0.5 rounded-md ml-1.5 bg-indigo-500/10">V3.2</span>
                </h1>
                <p class="text-[10px] uppercase tracking-widest text-indigo-400 font-bold flex items-center gap-1.5 mt-0.5">
                    <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full inline-block animate-pulse"></span>
                    Operator: <span id="displayUserName">Student</span>
                </p>
            </div>
        </div>
        
        <!-- Live Infrastructure Monitoring Metrics -->
        <div class="hidden sm:flex items-center gap-4 text-right">
            <div class="text-[11px] font-medium text-gray-400">
                <span class="text-gray-500 uppercase block text-[9px] tracking-wider font-bold">Latency</span>
                <span class="text-emerald-400 font-mono">14ms</span>
            </div>
            <div class="w-px h-6 bg-white/10"></div>
            <div class="text-[11px] font-medium text-gray-400">
                <span class="text-gray-500 uppercase block text-[9px] tracking-wider font-bold">Core Load</span>
                <span class="text-indigo-400 font-mono">2.4%</span>
            </div>
        </div>
    </div>

    <!-- Chat Space -->
    <div id="chatArea" class="flex-1 overflow-y-auto p-6 space-y-6 chat-container">
        <!-- Rebranded Welcome Screen -->
        <div id="welcomeScreen" class="flex flex-col justify-center items-center mt-24 text-center px-4">
            <div class="edith-orb w-20 h-20 rounded-3xl flex items-center justify-center text-3xl text-white mb-6">
                <i class="fa-solid fa-brain"></i>
            </div>
            <h2 class="text-2xl sm:text-3xl font-bold mb-2 tracking-tight text-white">
                How can I assist you today?
            </h2>
            <p class="text-gray-400 text-sm max-w-sm font-light leading-relaxed">
                I can process documents, parse voice input, analyze complex media datasets, or just run brainstorm sessions.
            </p>
        </div>
    </div>

    <!-- Input Dashboard -->
    <div class="p-4 sm:p-6 bg-gray-950/40 border-t border-white/5 backdrop-blur-md">
        <div class="flex flex-wrap gap-2 mb-3.5 px-1">
            <!-- Mode Selector Toggles -->
            <button onclick="toggleSummarize()" id="sumBtn" class="px-4 py-1.5 rounded-full border border-white/10 hover:border-indigo-500/40 bg-white/5 text-[11px] font-medium transition-all flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-gray-400" id="sumDot"></span>
                Summarize Notes: <span id="sumStatus" class="font-bold text-gray-400">OFF</span>
            </button>

            <label class="px-4 py-1.5 rounded-full border border-white/10 hover:border-indigo-500/40 bg-white/5 text-[11px] font-medium cursor-pointer transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-paperclip text-indigo-400"></i> Attach Files
                <input type="file" id="fileInput" multiple class="hidden" onchange="updateFileStatus()" />
            </label>
            <span id="fileCount" class="text-[11px] text-indigo-300 self-center font-medium"></span>
        </div>

        <!-- System Control Interaction Line -->
        <div class="flex gap-3 items-center relative">
            <input type="text" id="msg" placeholder="Ask EDITH anything..." 
                class="w-full bg-gray-900/80 border border-white/10 focus:border-indigo-500/50 rounded-2xl pl-5 pr-28 py-4 outline-none transition-all text-sm placeholder-gray-500 text-gray-100 shadow-inner"
                onkeypress="if(event.key==='Enter')sendMsg()" />

            <div class="absolute right-2 flex items-center gap-1.5">
                <!-- Microphone System Input Button -->
                <button onclick="toggleVoiceInput()" id="micBtn" title="Voice Input"
                    class="w-10 h-10 bg-white/5 hover:bg-white/10 border border-white/10 text-gray-300 rounded-xl flex items-center justify-center transition-all">
                    <i class="fa-solid fa-microphone text-sm"></i>
                </button>
                
                <!-- Action Send Button -->
                <button onclick="sendMsg()" class="w-10 h-10 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white rounded-xl flex items-center justify-center transition-all shadow-lg shadow-indigo-600/20">
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
const API_BASE = window.location.hostname === "127.0.0.1"
    ? "http://localhost:5000"
    : "https://student-hub-edith-backend.onrender.com";

const chatArea = document.getElementById("chatArea");
const welcomeScreen = document.getElementById("welcomeScreen");
let isSummarize = false;

let recognition;
let isRecording = false;

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    recognition.onstart = () => {
        isRecording = true;
        document.getElementById("micBtn").classList.add("mic-active");
        document.getElementById("msg").placeholder = "Listening intelligently...";
    };

    recognition.onend = () => {
        isRecording = false;
        document.getElementById("micBtn").classList.remove("mic-active");
        document.getElementById("msg").placeholder = "Ask EDITH anything...";
    };

    recognition.onresult = (event) => {
        const speechToText = event.results[0][0].transcript;
        document.getElementById("msg").value = speechToText;
    };

    recognition.onerror = (err) => {
        console.error("Speech Architecture Fault:", err);
        isRecording = false;
        document.getElementById("micBtn").classList.remove("mic-active");
    };
}

function toggleVoiceInput() {
    if (!recognition) {
        alert("Voice recognition is not supported natively in this browser window configuration.");
        return;
    }
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
        } catch(e) {
            console.warn("Recognition structure is already active contextually.", e);
        }
    }
}

window.onload = () => {
    const token = localStorage.getItem("token");
    const name = localStorage.getItem("userName");

    if (!token) {
        window.location.href = "login.html";
        return;
    }
    if (name) {
        document.getElementById("displayUserName").innerText = name;
    }
};

function toggleSummarize() {
    isSummarize = !isSummarize;
    const statusText = document.getElementById("sumStatus");
    const dotElement = document.getElementById("sumDot");
    const btn = document.getElementById("sumBtn");

    if (isSummarize) {
        statusText.innerText = "ON";
        statusText.className = "font-bold text-indigo-400";
        dotElement.className = "w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse";
        btn.classList.add("border-indigo-500/40", "bg-indigo-500/5");
    } else {
        statusText.innerText = "OFF";
        statusText.className = "font-bold text-gray-400";
        dotElement.className = "w-1.5 h-1.5 rounded-full bg-gray-400";
        btn.classList.remove("border-indigo-500/40", "bg-indigo-500/5");
    }
}

function updateFileStatus() {
    const files = document.getElementById("fileInput").files;
    document.getElementById("fileCount").innerText = files.length > 0 
        ? `•  ${files.length} ready` 
        : "";
}

function cleanAndParseMarkdown(text) {
    let rawHtml = marked.parse(text);
    const container = document.createElement('div');
    container.innerHTML = rawHtml;

    const preBlocks = container.querySelectorAll('pre');
    preBlocks.forEach((pre) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper';
        
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-code-btn';
        copyBtn.innerHTML = '<i class="fa-regular fa-copy mr-1"></i> Copy';
        
        copyBtn.onclick = () => {
            const codeText = pre.querySelector('code')?.innerText || pre.innerText;
            navigator.clipboard.writeText(codeText).then(() => {
                copyBtn.innerHTML = '<i class="fa-solid fa-check text-emerald-400 mr-1"></i> Copied';
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fa-regular fa-copy mr-1"></i> Copy';
                }, 2000);
            });
        };

        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);
        wrapper.appendChild(copyBtn);
    });

    return container.innerHTML;
}

function addMessage(text, isUser) {
    if (welcomeScreen && welcomeScreen.style.display !== "none") {
        welcomeScreen.style.display = "none";
    }

    const div = document.createElement("div");
    div.className = `flex ${isUser ? "justify-end" : "justify-start"} animate-msg w-full`;

    div.innerHTML = `
        <div class="p-4 px-5 max-w-[85%] text-sm leading-relaxed shadow-sm ${isUser ? "user-bubble" : "ai-bubble break-words overflow-hidden"}">
            ${isUser ? escapeHtml(text) : cleanAndParseMarkdown(text)}
        </div>
    `;

    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div.querySelector("div");
}

function showTypingIndicator() {
    const div = document.createElement("div");
    div.id = "edithTypingIndicator";
    div.className = "flex justify-start animate-msg";
    div.innerHTML = `
        <div class="p-4 px-5 ai-bubble flex items-center gap-1.5 shadow-sm">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
        </div>
    `;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTypingIndicator() {
    const indicator = document.getElementById("edithTypingIndicator");
    if (indicator) indicator.remove();
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function sendMsg() {
    const input = document.getElementById("msg");
    const fileInput = document.getElementById("fileInput");
    const message = input.value.trim();
    const token = localStorage.getItem("token");

    if (!message && fileInput.files.length === 0) return;

    addMessage(message || "Analyzing documents...", true);
    input.value = "";

    const formData = new FormData();
    formData.append("message", message);
    formData.append("isSummarize", isSummarize);

    for (let file of fileInput.files) {
        formData.append("files", file);
    }

    showTypingIndicator();

    try {
        const res = await fetch(`${API_BASE}/api/chat`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
            body: formData
        });

        removeTypingIndicator();

        if (!res.ok) {
            const errText = await res.text();
            let errMsg = "AI service error";
            try {
                const errJson = JSON.parse(errText);
                errMsg = errJson.error || errMsg;
            } catch (e) {
                errMsg = errText || errMsg;
            }
            addMessage("❌ " + errMsg, false);
            return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        const aiBubble = addMessage("", false);
        let aiText = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            aiText += decoder.decode(value, { stream: true });
            aiBubble.innerHTML = cleanAndParseMarkdown(aiText);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
    } catch (err) {
        console.error(err);
        removeTypingIndicator();
        addMessage("❌ Matrix Connection Interrupted (Server Failure)", false);
    }

    fileInput.value = "";
    document.getElementById("fileCount").innerText = "";
}
</script>

</body>
</html>
