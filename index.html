<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDITH - Intelligence Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #030712 70%);
            overflow: hidden;
        }

        /* Custom Scrollbar for Chat & Sidebar Containers */
        .chat-container::-webkit-scrollbar, .sidebar-scroll::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .chat-container::-webkit-scrollbar-track, .sidebar-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-container::-webkit-scrollbar-thumb, .sidebar-scroll::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.15);
            border-radius: 10px;
        }
        .chat-container::-webkit-scrollbar-thumb:hover, .sidebar-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.35);
        }

        /* Core Orb Animations */
        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 25px 2px rgba(99, 102, 241, 0.4), 0 0 50px 10px rgba(168, 85, 247, 0.2);
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 0 40px 8px rgba(99, 102, 241, 0.6), 0 0 70px 20px rgba(168, 85, 247, 0.4);
            }
        }
        .edith-orb {
            animation: pulseGlow 4s ease-in-out infinite;
            background: linear-gradient(135deg, #6366f1, #a855f7);
        }

        /* Smooth slide in for incoming messages */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.99);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-msg {
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Mic Pulsing Effect when recording */
        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .mic-active {
            animation: micPulse 1.5s infinite;
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #f87171 !important;
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(10, 11, 23, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .ai-bubble {
            background: rgba(23, 24, 51, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.25);
            color: #f3f4f6;
            border-radius: 20px 20px 20px 4px;
        }
        .user-bubble {
            background: linear-gradient(135deg, #4f46e5, #3730a3);
            color: white;
            border-radius: 20px 20px 4px 20px;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.25);
        }

        /* Sidebar active selection history node */
        .history-active {
            background: rgba(99, 102, 241, 0.15) !important;
            border-color: rgba(99, 102, 241, 0.3) !important;
            color: white !important;
        }

        /* Code Block Copy Enhancement Wrapper */
        .code-block-wrapper {
            position: relative;
            margin: 12px 0;
            width: 100%;
        }
        pre {
            background: #020617 !important;
            padding: 18px 16px 16px 16px;
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 100%;
        }
        code {
            color: #a5b4fc;
            font-size: 0.875rem;
            white-space: pre;
        }
        .copy-code-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 10;
        }
        .copy-code-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        /* Typing Dots Animation */
        .typing-dot {
            animation: typingBounce 1.4s infinite ease-in-out both;
            width: 6px;
            height: 6px;
            background-color: #a5b4fc;
            border-radius: 50%;
            display: inline-block;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>

<body class="text-gray-100 min-h-screen flex items-center justify-center p-0 sm:p-4">

<div class="w-full max-w-6xl h-screen sm:h-[92vh] flex glass-panel sm:rounded-3xl shadow-2xl relative overflow-hidden">
    
    <!-- LEFT SIDEBAR: CHAT HISTORY ENGINE ARCHITECTURE -->
    <aside id="sidebarPanel" class="w-64 border-r border-white/5 bg-gray-950/40 flex flex-col h-full hidden lg:flex transition-all z-30">
        <!-- Sidebar Engine Header Row -->
        <div class="p-4 border-b border-white/5 flex flex-col gap-3">
            <div class="flex items-center gap-2.5">
                <div class="w-6 h-6 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-xs text-white">E</div>
                <span class="text-xs font-bold uppercase tracking-wider text-gray-400">Database Streams</span>
            </div>
            
            <!-- NEW CHAT AUTOMATION EMITTER NODE -->
            <button onclick="createNewChatSession()" class="w-full py-2.5 px-4 rounded-xl border border-dashed border-indigo-500/30 hover:border-indigo-500/60 bg-indigo-500/5 hover:bg-indigo-500/10 text-xs font-semibold text-indigo-300 transition-all flex items-center justify-center gap-2 group">
                <i class="fa-solid fa-plus text-[10px] group-hover:rotate-90 transition-all"></i> New Chat Session
            </button>
        </div>

        <!-- Scrollable Log Container Nodes -->
        <div id="historyLogContainer" class="flex-1 overflow-y-auto p-3 space-y-1.5 sidebar-scroll">
            <div class="text-center py-8 text-xs text-gray-600 font-light">Loading database history tree...</div>
        </div>

        <!-- Sidebar Base Dynamic Identity Block -->
        <div class="p-3.5 border-t border-white/5 bg-gray-950/40 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-full bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-xs text-indigo-400 font-bold">
                    SH
                </div>
                <div class="text-[11px]">
                    <span class="block font-semibold text-gray-300">Student Hub AI</span>
                    <span class="block text-[9px] text-gray-500 font-light">Engine System Integration</span>
                </div>
            </div>
            <button onclick="localStorage.clear(); window.location.reload();" title="Logout Stream" class="text-gray-500 hover:text-red-400 transition-all text-xs p-1">
                <i class="fa-solid fa-power-off"></i>
            </button>
        </div>
    </aside>

    <!-- RIGHT PANEL: CHAT INTERACTION CORE SYSTEM LAYOUT -->
    <div class="flex-1 flex flex-col h-full relative overflow-hidden bg-transparent">
        
        <!-- Top Navbar Row Structure -->
        <div class="p-4 border-b border-white/5 flex justify-between items-center bg-gray-950/20 px-6">
            <div class="flex items-center gap-3.5">
                <!-- Mobile Sidebar Responsive Drawer Toggle Button -->
                <button onclick="toggleMobileSidebar()" class="lg:hidden w-9 h-9 border border-white/10 bg-white/5 rounded-xl flex items-center justify-center text-gray-300">
                    <i class="fa-solid fa-bars text-sm"></i>
                </button>

                <div class="edith-orb w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold tracking-wider text-sm shadow-lg shadow-indigo-500/30">
                    E
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-white via-gray-200 to-indigo-300 bg-clip-text text-transparent">
                        EDITH <span class="text-xs font-semibold text-indigo-400 border border-indigo-500/30 px-1.5 py-0.5 rounded-md ml-1.5 bg-indigo-500/10">V3.2</span>
                    </h1>
                    <p class="text-[10px] uppercase tracking-widest text-indigo-400 font-bold flex items-center gap-1.5 mt-0.5">
                        <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full inline-block animate-pulse"></span>
                        Operator: <span id="displayUserName">Student</span>
                    </p>
                </div>
            </div>
            
            <!-- Live Infrastructure Monitoring Metrics -->
            <div class="hidden sm:flex items-center gap-4 text-right">
                <div class="text-[11px] font-medium text-gray-400">
                    <span class="text-gray-500 uppercase block text-[9px] tracking-wider font-bold">Latency</span>
                    <span class="text-emerald-400 font-mono">14ms</span>
                </div>
                <div class="w-px h-6 bg-white/10"></div>
                <div class="text-[11px] font-medium text-gray-400">
                    <span class="text-gray-500 uppercase block text-[9px] tracking-wider font-bold">Core Load</span>
                    <span class="text-indigo-400 font-mono">2.4%</span>
                </div>
            </div>
        </div>

        <!-- Chat Space Canvas Viewport -->
        <div id="chatArea" class="flex-1 overflow-y-auto p-6 space-y-6 chat-container">
            <!-- Rebranded Welcome Greeting Banner Screen -->
            <div id="welcomeScreen" class="flex flex-col justify-center items-center mt-24 text-center px-4">
                <div class="edith-orb w-20 h-20 rounded-3xl flex items-center justify-center text-3xl text-white mb-6">
                    <i class="fa-solid fa-brain"></i>
                </div>
                <h2 class="text-2xl sm:text-3xl font-bold mb-2 tracking-tight text-white">
                    How can I assist you today?
                </h2>
                <p class="text-gray-400 text-sm max-w-sm font-light leading-relaxed">
                    I can process documents, parse voice input, analyze complex media datasets, or just run brainstorm sessions.
                </p>
            </div>
        </div>

        <!-- Input Control Panel Dashboard Structure -->
        <div class="p-4 sm:p-6 bg-gray-950/40 border-t border-white/5 backdrop-blur-md">
            <div class="flex flex-wrap gap-2 mb-3.5 px-1">
                <!-- Mode Selector Action Toggles Buttons -->
                <button onclick="toggleSummarize()" id="sumBtn" class="px-4 py-1.5 rounded-full border border-white/10 hover:border-indigo-500/40 bg-white/5 text-[11px] font-medium transition-all flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-gray-400" id="sumDot"></span>
                    Summarize Notes: <span id="sumStatus" class="font-bold text-gray-400">OFF</span>
                </button>

                <label class="px-4 py-1.5 rounded-full border border-white/10 hover:border-indigo-500/40 bg-white/5 text-[11px] font-medium cursor-pointer transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-paperclip text-indigo-400"></i> Attach Files
                    <input type="file" id="fileInput" multiple class="hidden" onchange="updateFileStatus()" />
                </label>
                <span id="fileCount" class="text-[11px] text-indigo-300 self-center font-medium"></span>
            </div>

            <!-- System Control Interaction Line Deck -->
            <div class="flex gap-3 items-center relative">
                <input type="text" id="msg" placeholder="Ask EDITH anything..." 
                    class="w-full bg-gray-900/80 border border-white/10 focus:border-indigo-500/50 rounded-2xl pl-5 pr-28 py-4 outline-none transition-all text-sm placeholder-gray-500 text-gray-100 shadow-inner"
                    onkeypress="if(event.key==='Enter')sendMsg()" />

                <div class="absolute right-2 flex items-center gap-1.5">
                    <!-- Microphone System Input Button Trigger Component -->
                    <button onclick="toggleVoiceInput()" id="micBtn" title="Voice Input"
                        class="w-10 h-10 bg-white/5 hover:bg-white/10 border border-white/10 text-gray-300 rounded-xl flex items-center justify-center transition-all">
                        <i class="fa-solid fa-microphone text-sm"></i>
                    </button>
                    
                    <!-- Action Send Matrix Transmission Execution Button Trigger Component -->
                    <button onclick="sendMsg()" class="w-10 h-10 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white rounded-xl flex items-center justify-center transition-all shadow-lg shadow-indigo-600/20">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
const API_BASE = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
    ? "http://localhost:5000"
    : "https://student-hub-edith-backend.onrender.com";

const chatArea = document.getElementById("chatArea");
const welcomeScreen = document.getElementById("welcomeScreen");
const historyLogContainer = document.getElementById("historyLogContainer");
let isSummarize = false;
let currentActiveSessionId = null; 
let globallyCachedHistoryTree = []; 

// Audio Web Speech API Recognition Setup Architecture Configurations Mappings 
let recognition;
let isRecording = false;

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    recognition.onstart = () => {
        isRecording = true;
        document.getElementById("micBtn").classList.add("mic-active");
        document.getElementById("msg").placeholder = "Listening intelligently...";
    };

    recognition.onend = () => {
        isRecording = false;
        document.getElementById("micBtn").classList.remove("mic-active");
        document.getElementById("msg").placeholder = "Ask EDITH anything...";
    };

    recognition.onresult = (event) => {
        const speechToText = event.results[0][0].transcript;
        document.getElementById("msg").value = speechToText;
    };

    recognition.onerror = (err) => {
        console.error("Speech Architecture Fault:", err);
        isRecording = false;
        document.getElementById("micBtn").classList.remove("mic-active");
    };
}

function toggleVoiceInput() {
    if (!recognition) {
        alert("Voice recognition is not supported natively in this browser window configuration.");
        return;
    }
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
        } catch(e) {
            console.warn("Recognition structure is already active contextually.", e);
        }
    }
}

window.onload = () => {
    const token = localStorage.getItem("token");
    const name = localStorage.getItem("userName");

    if (!token) {
        window.location.href = "login.html";
        return;
    }
    if (name) {
        document.getElementById("displayUserName").innerText = name;
    }
    // Call background load history tree data pipeline
    loadChatHistory();
};

// --- CHAT HISTORY STREAM LOADER & SIDEBAR HYDRATION PIPELINE ---
async function loadChatHistory() {
    const token = localStorage.getItem("token");
    if (!token) return;

    try {
        const response = await fetch(`${API_BASE}/api/history`, {
            method: "GET",
            headers: { "Authorization": `Bearer ${token}` }
        });

        if (response.ok) {
            globallyCachedHistoryTree = await response.json();
            renderSidebarHistoryList(globallyCachedHistoryTree);
            
            // Auto load first active stream cluster if history records populated
            if (globallyCachedHistoryTree && globallyCachedHistoryTree.length > 0 && currentActiveSessionId === null) {
                loadSelectedSessionStream(globallyCachedHistoryTree[0]._id || globallyCachedHistoryTree[0].id);
            }
        } else {
            historyLogContainer.innerHTML = `<div class="text-center py-6 text-xs text-gray-500">Failed to pull database maps.</div>`;
        }
    } catch (err) {
        console.error("Error context rendering history logs:", err);
        historyLogContainer.innerHTML = `<div class="text-center py-6 text-xs text-red-400/60">Server Matrix Sync Timeout</div>`;
    }
}

// Side-bar list items rendering engine template logic mapper control
function renderSidebarHistoryList(historyArray) {
    if (!historyArray || historyArray.length === 0) {
        historyLogContainer.innerHTML = `<div class="text-center py-8 text-[11px] text-gray-500 font-light">No historical stream logs found.</div>`;
        return;
    }

    historyLogContainer.innerHTML = ""; // Wipe container layer clean to start iteration updates
    
    historyArray.forEach((session) => {
        const id = session._id || session.id;
        
        // Isolate message body string parameters to construct standard visible header block names snippets
        let displayTitle = "Optimization Process Array";
        if (session.messages && session.messages.length > 0) {
            const firstUserMessage = session.messages.find(m => m.role === "user");
            if (firstUserMessage && firstUserMessage.content) {
                displayTitle = firstUserMessage.content.length > 24 
                    ? firstUserMessage.content.substring(0, 24) + "..." 
                    : firstUserMessage.content;
            }
        }

        const btn = document.createElement("button");
        btn.id = `sidebar-session-${id}`;
        btn.onclick = () => loadSelectedSessionStream(id);
        btn.className = `w-full text-left px-3 py-2.5 rounded-xl border border-transparent hover:bg-white/5 text-gray-400 text-xs font-medium tracking-wide transition-all flex items-center gap-2.5 overflow-hidden text-ellipsis whitespace-nowrap group`;
        
        if (id === currentActiveSessionId) {
            btn.classList.add("history-active");
        }

        btn.innerHTML = `
            <i class="fa-regular fa-comment text-[13px] text-indigo-400/70 group-hover:text-indigo-400 transition-all flex-shrink-0"></i>
            <span class="truncate block w-full text-gray-300 group-hover:text-white transition-all">${escapeHtml(displayTitle)}</span>
        `;
        
        historyLogContainer.appendChild(btn);
    });
}

// Loads isolated target session dataset inside central main layout framework
function loadSelectedSessionStream(sessionId) {
    currentActiveSessionId = sessionId;
    
    // Manage dynamic styling highlights structures elements loop tracking state switches
    const blocks = historyLogContainer.querySelectorAll("button");
    blocks.forEach(b => b.classList.remove("history-active"));
    
    const targetedActiveBtn = document.getElementById(`sidebar-session-${sessionId}`);
    if (targetedActiveBtn) targetedActiveBtn.classList.add("history-active");

    // Pull out core record from memory metrics local map object array tree container data store
    const targetedSession = globallyCachedHistoryTree.find(s => (s._id || s.id) === sessionId);
    
    // Reset view container matrix blocks to prepare drawing stream contents
    chatArea.innerHTML = "";
    if (welcomeScreen) welcomeScreen.style.display = "none";

    if (targetedSession && Array.isArray(targetedSession.messages)) {
        targetedSession.messages.forEach(msg => {
            const isUser = msg.role === "user";
            appendHistoryMessageToUI(msg.content, isUser);
        });
        chatArea.scrollTop = chatArea.scrollHeight;
    }
}

// Emitters execution function module to generate clean workspace setups
function createNewChatSession() {
    currentActiveSessionId = null;
    
    // Clear active styling tracking marks safely from sidebar array rows
    const blocks = historyLogContainer.querySelectorAll("button");
    blocks.forEach(b => b.classList.remove("history-active"));

    // Draw native blank dashboard metrics layer interface configurations mapping view setups
    chatArea.innerHTML = `
        <div id="welcomeScreen" class="flex flex-col justify-center items-center mt-24 text-center px-4 animate-msg">
            <div class="edith-orb w-20 h-20 rounded-3xl flex items-center justify-center text-3xl text-white mb-6">
                <i class="fa-solid fa-brain"></i>
            </div>
            <h2 class="text-2xl sm:text-3xl font-bold mb-2 tracking-tight text-white">
                Initialization Matrix Ready
            </h2>
            <p class="text-gray-400 text-sm max-w-sm font-light leading-relaxed">
                New operational stack context created. Transmit payload elements inside control lines to begin synthesis pipelines.
            </p>
        </div>
    `;
    
    // Mobile viewport slide helper interaction auto closure execution handling
    const sidebar = document.getElementById("sidebarPanel");
    if (!sidebar.classList.contains("hidden") && window.innerWidth < 1024) {
        sidebar.classList.add("hidden");
    }
    
    document.getElementById("msg").focus();
}

function toggleMobileSidebar() {
    const sidebar = document.getElementById("sidebarPanel");
    if (sidebar.classList.contains("hidden")) {
        sidebar.classList.remove("hidden");
        sidebar.classList.add("fixed", "inset-y-0", "left-0", "w-64", "shadow-3xl");
    } else {
        sidebar.classList.add("hidden");
        sidebar.classList.remove("fixed", "inset-y-0", "left-0", "w-64", "shadow-3xl");
    }
}

function appendHistoryMessageToUI(text, isUser) {
    const div = document.createElement("div");
    div.className = `flex ${isUser ? "justify-end" : "justify-start"} animate-msg w-full`;
    div.innerHTML = `
        <div class="p-4 px-5 max-w-[85%] text-sm leading-relaxed shadow-sm ${isUser ? "user-bubble" : "ai-bubble break-words overflow-hidden"}">
            ${isUser ? escapeHtml(text) : cleanAndParseMarkdown(text)}
        </div>
    `;
    chatArea.appendChild(div);
}

function toggleSummarize() {
    isSummarize = !isSummarize;
    const statusText = document.getElementById("sumStatus");
    const dotElement = document.getElementById("sumDot");
    const btn = document.getElementById("sumBtn");

    if (isSummarize) {
        statusText.innerText = "ON";
        statusText.className = "font-bold text-indigo-400";
        dotElement.className = "w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse";
        btn.classList.add("border-indigo-500/40", "bg-indigo-500/5");
    } else {
        statusText.innerText = "OFF";
        statusText.className = "font-bold text-gray-400";
        dotElement.className = "w-1.5 h-1.5 rounded-full bg-gray-400";
        btn.classList.remove("border-indigo-500/40", "bg-indigo-500/5");
    }
}

function updateFileStatus() {
    const files = document.getElementById("fileInput").files;
    document.getElementById("fileCount").innerText = files.length > 0 
        ? `•  ${files.length} ready` 
        : "";
}

function cleanAndParseMarkdown(text) {
    let rawHtml = marked.parse(text);
    const container = document.createElement('div');
    container.innerHTML = rawHtml;

    const preBlocks = container.querySelectorAll('pre');
    preBlocks.forEach((pre) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper';
        
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-code-btn';
        copyBtn.innerHTML = '<i class="fa-regular fa-copy mr-1"></i> Copy';
        
        copyBtn.onclick = () => {
            const codeText = pre.querySelector('code')?.innerText || pre.innerText;
            navigator.clipboard.writeText(codeText).then(() => {
                copyBtn.innerHTML = '<i class="fa-solid fa-check text-emerald-400 mr-1"></i> Copied';
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fa-regular fa-copy mr-1"></i> Copy';
                }, 2000);
            });
        };

        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);
        wrapper.appendChild(copyBtn);
    });

    return container.innerHTML;
}

function addMessage(text, isUser) {
    const internalWelcome = document.getElementById("welcomeScreen");
    if (internalWelcome) {
        internalWelcome.remove();
    }

    const div = document.createElement("div");
    div.className = `flex ${isUser ? "justify-end" : "justify-start"} animate-msg w-full`;

    div.innerHTML = `
        <div class="p-4 px-5 max-w-[85%] text-sm leading-relaxed shadow-sm ${isUser ? "user-bubble" : "ai-bubble break-words overflow-hidden"}">
            ${isUser ? escapeHtml(text) : cleanAndParseMarkdown(text)}
        </div>
    `;

    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div.querySelector("div");
}

function showTypingIndicator() {
    const div = document.createElement("div");
    div.id = "edithTypingIndicator";
    div.className = "flex justify-start animate-msg";
    div.innerHTML = `
        <div class="p-4 px-5 ai-bubble flex items-center gap-1.5 shadow-sm">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
        </div>
    `;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTypingIndicator() {
    const indicator = document.getElementById("edithTypingIndicator");
    if (indicator) indicator.remove();
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function sendMsg() {
    const input = document.getElementById("msg");
    const fileInput = document.getElementById("fileInput");
    const message = input.value.trim();
    const token = localStorage.getItem("token");

    if (!message && fileInput.files.length === 0) return;

    addMessage(message || "Analyzing documents...", true);
    input.value = "";

    const formData = new FormData();
    formData.append("message", message);
    formData.append("isSummarize", isSummarize);
    if (currentActiveSessionId) {
        formData.append("sessionId", currentActiveSessionId); 
    }

    for (let file of fileInput.files) {
        formData.append("files", file);
    }

    showTypingIndicator();

    try {
        const res = await fetch(`${API_BASE}/api/chat`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
            body: formData
        });

        removeTypingIndicator();

        if (!res.ok) {
            const err = await res.text();
            addMessage("❌ " + err, false);
            return;
        }

        // Catch response header configurations payload markers tokens to check if new session was auto created 
        const responseSessionIdHeader = res.headers.get("x-session-id");
        if (responseSessionIdHeader && !currentActiveSessionId) {
            currentActiveSessionId = responseSessionIdHeader;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        const aiBubble = addMessage("", false);
        let aiText = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            aiText += decoder.decode(value, { stream: true });
            aiBubble.innerHTML = cleanAndParseMarkdown(aiText);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Re-hydrate full background history tracking lists automatically 
        loadChatHistory();

    } catch (err) {
        console.error(err);
        removeTypingIndicator();
        addMessage("❌ Matrix Connection Interrupted (Server Failure)", false);
    }

    fileInput.value = "";
    document.getElementById("fileCount").innerText = "";
}
</script>
