<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDITH AI Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: {50:'#ecfeff',100:'#cffafe',500:'#06b6d4',600:'#0891b2',700:'#0e7490'}, matrix: {darkBg:'#05070a',darkCard:'#0b0f17',border:'#1e293b'}}}}
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .chat-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 99px; }
        .code-block-container { position: relative; margin: 16px 0; border-radius: 12px; overflow: hidden; border: 1px solid #1e293b; }
        pre { background: #010409 !important; padding: 16px; overflow-x: auto; margin: 0; border-radius: 8px; }
        .pdf-notes-container { font-family: 'Plus Jakarta Sans', sans-serif; color: #1e293b; padding: 45px; background: #ffffff; }
        .pdf-notes-header { border-bottom: 3px solid #0891b2; padding-bottom: 20px; margin-bottom: 30px; }
        .pdf-notes-title { font-family: 'Playfair Display', serif; font-size: 28px; color: #0f172a; font-weight: 700; }
    </style>
</head>
<body class="w-screen h-screen flex dark:bg-matrix-darkBg bg-slate-50 text-slate-900 dark:text-zinc-100 transition-colors duration-200 overflow-hidden text-sm md:text-base">

    <!-- Camera Modal -->
    <div id="cameraModal" class="hidden fixed inset-0 z-[60] bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="w-full max-w-md dark:bg-matrix-darkCard bg-white border dark:border-matrix-border border-slate-200 rounded-2xl overflow-hidden shadow-2xl flex flex-col">
            <div class="px-4 py-3 border-b flex justify-between items-center">
                <span class="text-xs font-mono font-bold uppercase tracking-widest text-cyan-400">// Visual Sensor Stream</span>
                <button onclick="closeCameraSensor()" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="relative bg-black aspect-video">
                <video id="cameraVideoFeed" autoplay playsinline class="w-full h-full object-cover scale-x-[-1]"></video>
                <canvas id="cameraCanvasBuffer" class="hidden"></canvas>
            </div>
            <div class="p-4 flex gap-3 justify-center border-t">
                <button onclick="captureCameraSnapshot()" class="bg-brand-500 hover:bg-brand-600 text-white font-bold px-6 py-3 rounded-xl flex items-center gap-2">Capture Frame</button>
                <button onclick="closeCameraSensor()" class="border px-6 py-3 rounded-xl">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-72 -translate-x-full lg:translate-x-0 z-50 flex flex-col h-full dark:bg-matrix-darkCard bg-white border-r dark:border-matrix-border transition-all">
        <!-- Header -->
        <div class="p-4 space-y-4">
            <div class="flex items-center gap-3">
                <div class="relative w-9 h-9">
                    <div class="absolute inset-0 bg-gradient-to-tr from-cyan-500 to-indigo-600 rounded-xl blur opacity-70 animate-pulse"></div>
                    <div class="relative w-full h-full rounded-xl bg-slate-900 border border-white/10 flex items-center justify-center">
                        <span class="text-sm font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">E⚡️</span>
                    </div>
                </div>
                <span class="text-xl font-black">EDITH <span class="text-cyan-400">AI</span></span>
            </div>
            <button onclick="createNewChat()" class="w-full h-11 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-xl flex items-center justify-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> New Stream
            </button>
        </div>

        <div class="px-4 pb-2">
            <button onclick="toggleDigitalVaultView()" class="w-full py-3 border border-dashed dark:border-cyan-500/30 text-cyan-400 rounded-xl flex items-center justify-between px-4 hover:bg-cyan-500/10">
                <span class="font-bold uppercase text-xs flex items-center gap-2"><i class="fa-solid fa-vault"></i> Digital Vault</span>
                <span id="vaultItemsBadge" class="bg-cyan-500 text-white text-[10px] px-2.5 py-0.5 rounded-full font-mono">0</span>
            </button>
        </div>

        <div class="px-5 py-2.5 border-b text-xs font-bold uppercase tracking-wider text-slate-400">Context History</div>
        <div id="chatHistoryList" class="flex-1 overflow-y-auto p-3 space-y-1 chat-scroll"></div>

        <div class="p-4 border-t flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div id="userBadge" class="w-9 h-9 rounded-xl bg-gradient-to-br from-slate-800 to-slate-900 text-cyan-400 flex items-center justify-center font-black">OP</div>
                <div>
                    <div id="userNameFooter" class="font-bold">Operator</div>
                    <div class="text-xs text-brand-500">Verified Node</div>
                </div>
            </div>
            <button onclick="logoutSession()" class="text-red-400 hover:text-red-500"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col h-full">
        <header class="h-16 border-b dark:border-matrix-border flex items-center px-6 justify-between bg-white dark:bg-matrix-darkCard">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar(true)" class="lg:hidden"><i class="fa-solid fa-bars text-xl"></i></button>
                <div id="activeChatTitleHeader" class="font-mono text-xs uppercase tracking-widest text-slate-400">// Standby Matrix Ready</div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="switchDashboardTheme()" class="w-9 h-9 flex items-center justify-center"><i id="themeToggleIcon" class="fa-solid fa-moon"></i></button>
                <div class="text-xs font-bold tracking-widest bg-cyan-500/10 text-cyan-400 px-4 py-2 rounded-2xl flex items-center gap-2">
                    <span class="w-2 h-2 bg-cyan-400 rounded-full animate-ping"></span> GRID ACTIVE
                </div>
            </div>
        </header>

        <!-- Vault Drawer -->
        <div id="digitalVaultDrawer" class="hidden p-4 border-b dark:border-matrix-border bg-slate-50 dark:bg-zinc-950 max-h-[380px] overflow-auto">
            <div class="max-w-3xl mx-auto">
                <div class="flex justify-between mb-4">
                    <h4 class="uppercase font-bold text-cyan-400 text-sm">Encrypted Vault</h4>
                    <button onclick="clearDigitalVaultStorage()" class="text-red-400 text-sm">Wipe All</button>
                </div>
                <div id="vaultItemsContainer" class="space-y-3"></div>
            </div>
        </div>

        <main id="chatWindow" class="flex-1 overflow-y-auto p-6 space-y-8 chat-scroll dark:bg-matrix-darkBg"></main>

        <footer class="p-4 border-t dark:border-matrix-border bg-white dark:bg-matrix-darkCard">
            <div class="max-w-3xl mx-auto">
                <div class="flex items-center gap-4 mb-3 text-xs">
                    <button onclick="toggleSummarizeMode()" class="flex items-center gap-2 border px-4 py-2 rounded-xl hover:border-cyan-400">
                        Executive Summary <span id="summarizeBadge" class="text-slate-400">OFF</span>
                    </button>
                    <label class="cursor-pointer flex items-center gap-2 hover:text-cyan-400">
                        <i class="fa-solid fa-paperclip"></i> Attach
                        <input type="file" id="fileAttachment" multiple class="hidden" onchange="handleFileSelect()">
                    </label>
                    <button onclick="openCameraSensor()" class="flex items-center gap-2 hover:text-cyan-400"><i class="fa-solid fa-camera"></i> Camera</button>
                </div>

                <div class="relative">
                    <input type="text" id="userInputText" placeholder="Ask anything... (e.g. Prepare notes on Quantum Computing)"
                        class="w-full bg-slate-100 dark:bg-zinc-900 border dark:border-matrix-border rounded-2xl px-6 py-4 pr-16 focus:outline-none focus:border-cyan-400"
                        onkeypress="if(event.key==='Enter') sendMessage()">
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 flex gap-2">
                        <button onclick="toggleSpeech()" id="speechBtn"><i class="fa-solid fa-microphone text-xl"></i></button>
                        <button onclick="sendMessage()" class="w-10 h-10 bg-brand-500 hover:bg-brand-600 text-white rounded-xl flex items-center justify-center">
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>
                </div>
            </div>
        </footer>
    </div>

<script>
// ==================== CONFIG ====================
const API_URL = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost" 
    ? "http://localhost:5000" : "https://student-hub-edith-backend.onrender.com";

let currentSessionId = null;
let cachedSessionsList = [];
let isSummarizeActive = false;
let localMediaStream = null;
let capturedCameraFiles = [];

// ==================== THEME ====================
function initDashboardTheme() {
    const isDark = localStorage.getItem('edith-theme') !== 'light';
    document.documentElement.classList.toggle('dark', isDark);
    document.getElementById("themeToggleIcon").className = isDark ? "fa-solid fa-sun text-amber-400" : "fa-solid fa-moon";
}
function switchDashboardTheme() {
    localStorage.setItem('edith-theme', document.documentElement.classList.contains('dark') ? 'light' : 'dark');
    initDashboardTheme();
}

// ==================== SPEECH ====================
let voiceRecognitionInstance = null;
if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
    voiceRecognitionInstance = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    voiceRecognitionInstance.onresult = e => document.getElementById("userInputText").value = e.results[0][0].transcript;
}
function toggleSpeech() {
    if (!voiceRecognitionInstance) return alert("Speech recognition not supported in this browser.");
    voiceRecognitionInstance[voiceRecognitionInstance.running ? 'stop' : 'start']();
}

// ==================== SIDEBAR & VAULT ====================
function toggleSidebar(open) {
    document.getElementById("sidebar").classList.toggle("-translate-x-full", !open);
}

function toggleDigitalVaultView() {
    const drawer = document.getElementById("digitalVaultDrawer");
    drawer.classList.toggle("hidden");
    if (!drawer.classList.contains("hidden")) renderDigitalVaultItems();
}

function fetchDigitalVaultData() {
    return JSON.parse(localStorage.getItem("edith_vault_notes") || "[]");
}
function updateVaultInterfaceBadge() {
    document.getElementById("vaultItemsBadge").textContent = fetchDigitalVaultData().length;
}
function pushItemToVault(title, rawContent) {
    const records = fetchDigitalVaultData();
    records.unshift({
        id: "vault-" + Date.now(),
        title: title || "EDITH Notes",
        timestamp: new Date().toLocaleString(),
        body: rawContent
    });
    localStorage.setItem("edith_vault_notes", JSON.stringify(records));
    updateVaultInterfaceBadge();
}
function clearDigitalVaultStorage() {
    if (confirm("Clear entire Digital Vault?")) {
        localStorage.removeItem("edith_vault_notes");
        updateVaultInterfaceBadge();
        renderDigitalVaultItems();
    }
}
function renderDigitalVaultItems() {
    const container = document.getElementById("vaultItemsContainer");
    container.innerHTML = "";
    const items = fetchDigitalVaultData();
    if (items.length === 0) {
        container.innerHTML = `<p class="text-center text-zinc-500 py-8">Vault is empty.</p>`;
        return;
    }
    items.forEach(item => {
        const div = document.createElement("div");
        div.className = "bg-white dark:bg-zinc-900 border dark:border-matrix-border p-4 rounded-2xl flex justify-between items-center";
        div.innerHTML = `
            <div>
                <div class="font-semibold">${item.title}</div>
                <div class="text-xs text-zinc-500">${item.timestamp}</div>
            </div>
            <button onclick="downloadCustomNotesPdf('${encodeURIComponent(item.title)}','${encodeURIComponent(item.body)}')" 
                    class="bg-cyan-500 hover:bg-cyan-600 text-white text-xs px-4 py-2 rounded-xl">Export PDF</button>
        `;
        container.appendChild(div);
    });
}

// ==================== PDF ====================
function downloadCustomNotesPdf(encodedTitle, encodedContent) {
    const title = decodeURIComponent(encodedTitle);
    const content = decodeURIComponent(encodedContent);
    const wrapper = document.createElement("div");
    wrapper.className = "pdf-notes-container";
    wrapper.innerHTML = `
        <div class="pdf-notes-header">
            <h1 class="pdf-notes-title">${title}</h1>
            <div class="text-xs uppercase tracking-widest text-slate-500">EDITH AI • ${new Date().toLocaleDateString()}</div>
        </div>
        <div class="prose prose-slate max-w-none">${marked.parse(content)}</div>
        <div class="mt-16 text-center text-xs text-slate-400">© 2026 EDITH Intelligence Core</div>
    `;
    html2pdf().from(wrapper).set({
        margin: 15,
        filename: `${title.toLowerCase().replace(/\s+/g,'-')}-notes.pdf`,
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).save();
}

// ==================== CAMERA ====================
async function openCameraSensor() {
    try {
        localMediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }});
        document.getElementById("cameraVideoFeed").srcObject = localMediaStream;
        document.getElementById("cameraModal").classList.remove("hidden");
    } catch(e) { alert("Camera access failed."); }
}
function closeCameraSensor() {
    if (localMediaStream) localMediaStream.getTracks().forEach(t => t.stop());
    document.getElementById("cameraModal").classList.add("hidden");
}
function captureCameraSnapshot() {
    const video = document.getElementById("cameraVideoFeed");
    const canvas = document.getElementById("cameraCanvasBuffer");
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    const ctx = canvas.getContext("2d");
    ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0);
    canvas.toBlob(blob => {
        capturedCameraFiles.push(new File([blob], `capture-${Date.now()}.jpg`, {type: "image/jpeg"}));
        closeCameraSensor();
        alert("Snapshot captured and attached!");
    }, "image/jpeg", 0.9);
}

// ==================== CHAT ====================
function insertMessageBubble(role, content) {
    const chatWindow = document.getElementById("chatWindow");
    const welcome = document.getElementById("welcomeScreen");
    if (welcome) welcome.remove();

    const div = document.createElement("div");
    div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} gap-3`;
    div.innerHTML = `
        <div class="max-w-[80%] ${role === 'user' ? 'bg-brand-500 text-white' : 'dark:bg-matrix-darkCard bg-white border dark:border-matrix-border'} rounded-3xl px-5 py-4">
            ${role === 'assistant' ? marked.parse(content) : `<p>${content}</p>`}
        </div>
    `;
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById("userInputText");
    const message = input.value.trim();
    if (!message) return;

    insertMessageBubble('user', message);
    input.value = "";

    const loadingDiv = document.createElement("div");
    loadingDiv.id = "loadingIndicator";
    loadingDiv.className = "flex justify-start gap-3";
    loadingDiv.innerHTML = `<div class="dark:bg-matrix-darkCard bg-white border dark:border-matrix-border rounded-3xl px-5 py-4 flex items-center gap-2"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
    document.getElementById("chatWindow").appendChild(loadingDiv);
    document.getElementById("chatWindow").scrollTop = document.getElementById("chatWindow").scrollHeight;

    try {
        const formData = new FormData();
        formData.append("message", message);
        if (currentSessionId) formData.append("sessionId", currentSessionId);
        if (isSummarizeActive) formData.append("summarize", "true");

        capturedCameraFiles.forEach(file => formData.append("files", file));

        const res = await fetch(`${API_URL}/api/chat`, {
            method: "POST",
            headers: { "Authorization": `Bearer ${localStorage.getItem("token")}` },
            body: formData
        });

        const data = await res.json();
        document.getElementById("loadingIndicator")?.remove();

        if (data.response) {
            insertMessageBubble('assistant', data.response);
            if (data.sessionId) currentSessionId = data.sessionId;
            loadChatSessions();
        }
    } catch(e) {
        document.getElementById("loadingIndicator")?.remove();
        insertMessageBubble('assistant', "Sorry, I couldn't process that. Please try again.");
    }
}

function toggleSummarizeMode() {
    isSummarizeActive = !isSummarizeActive;
    document.getElementById("summarizeBadge").textContent = isSummarizeActive ? "ON" : "OFF";
    document.getElementById("summarizeBadge").className = isSummarizeActive ? "text-cyan-400 font-bold" : "text-slate-400";
}

// ==================== SESSION MANAGEMENT ====================
async function loadChatSessions(autoLoad = false) {
    try {
        const res = await fetch(`${API_URL}/api/history`, {
            headers: { "Authorization": `Bearer ${localStorage.getItem("token")}` }
        });
        cachedSessionsList = await res.json();
        renderSidebarList();
        if (autoLoad && cachedSessionsList.length > 0 && !currentSessionId) {
            selectSession(cachedSessionsList[0]._id);
        }
    } catch(e) {}
}

function renderSidebarList() {
    const container = document.getElementById("chatHistoryList");
    container.innerHTML = "";
    document.getElementById("chatCounter").textContent = cachedSessionsList.length;

    cachedSessionsList.forEach(session => {
        const isActive = session._id === currentSessionId;
        const title = (session.messages?.[0]?.content || "New Chat").substring(0, 28) + "...";
        const div = document.createElement("div");
        div.className = `px-4 py-3 rounded-2xl cursor-pointer transition-all ${isActive ? 'bg-cyan-500/10 text-cyan-400' : 'hover:bg-zinc-900/50'}`;
        div.innerHTML = `<div class="truncate">${title}</div>`;
        div.onclick = () => selectSession(session._id);
        container.appendChild(div);
    });
}

function selectSession(id) {
    currentSessionId = id;
    renderSidebarList();
    loadActiveMessages();
}

async function loadActiveMessages() {
    const session = cachedSessionsList.find(s => s._id === currentSessionId);
    if (!session) return;
    document.getElementById("chatWindow").innerHTML = "";
    session.messages.forEach(msg => insertMessageBubble(msg.role, msg.content));
}

function createNewChat() {
    currentSessionId = null;
    document.getElementById("chatWindow").innerHTML = `
        <div id="welcomeScreen" class="flex-1 flex flex-col items-center justify-center text-center">
            <h2 class="text-3xl font-bold mb-2">Systems Online</h2>
            <p class="text-slate-400">How can I assist you today?</p>
        </div>`;
    document.getElementById("activeChatTitleHeader").textContent = "// Standby Matrix Ready";
}

function logoutSession() {
    localStorage.clear();
    window.location.href = "login.html";
}

// ==================== INIT ====================
window.onload = () => {
    if (!localStorage.getItem("token")) return window.location.href = "login.html";
    
    document.getElementById("userNameFooter").textContent = localStorage.getItem("userName") || "Operator";
    document.getElementById("userBadge").textContent = (localStorage.getItem("userName") || "OP").slice(0,2).toUpperCase();

    marked.setOptions({ breaks: true, gfm: true });
    initDashboardTheme();
    updateVaultInterfaceBadge();
    loadChatSessions(true);
};
</script>
</body>
</html>
